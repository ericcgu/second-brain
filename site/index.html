github.io/second-brain/graph/) • [🧭 Mind Map](https://ericcgu.github.io/second-brain/mindmap/) • [Architecture](#-architecture--progressive-disclosure) • [Agent Guidelines](#-agent-native-workflow-agentsmd) • [Getting Started](#-quick-start) --- </div>"},{"level":2,"title":"💡 Overview","slug":"overview","text":"Traditional \"second brains\" (Obsidian, Notion, Foam) often degenerate into sprawling spiderwebs of bidirectional links. While visually interesting, this structure suffers from two fatal flaws: 1. **Human Friction:** Maintaining tags, metadata, and folders creates cognitive drag, leading to abandoned systems. 2. **LLM Context Bloat:** Feeding unstructured link mazes into AI coding agents (Antigravity, Gemini, Claude, Cursor) triggers exponential token consumption, lost context, and hallucinations. **This Second Brain solves both.** Built on **Google's Open Knowledge Format (OKF v0.2)**, knowledge is structured as a **hierarchical progressive-disclosure tree**. AI agents read only high-level indexes before selectively traversing specific nodes, preserving token budgets and maximizing retrieval precision. The exact same knowledge tree automatically compiles into an **interactive Mind Map and Developer Docs portal** with zero external dependencies. ---"},{"level":2,"title":"⚡ Key Highlights","slug":"key-highlights","text":"- **🤖 AI-First, Human-Effortless:** The AI agent handles 100% of formatting, tagging, indexing, changelogs, and mind-map regeneration. Humans only need to dump thoughts into [`inbox.md`](./inbox.md). - **🌲 Progressive Context Disclosure:** OKF v0.2 hierarchical structure allows AI assistants to navigate vast knowledge bases without loading entire repositories into context. - **🎨 Interactive Mind Map & Docs Portal:** Self-contained build pipeline (`scripts/export-graph.mjs`) generates a high-performance web dashboard featuring: - Dynamic canvas-based mind map with smooth Bezier curve connections. - Multi-panel dockable workspace (Mind Map, Docs, Split View). - `Cmd+K` Spotlight command palette with MiniSearch fuzzy matching. - Tokyo Night Storm syntax highlighting with instant code copying. - Triple-theme switcher (*Paper*, *Light*, *Dark*). - **🔗 Shareable View URLs:** Every visualizer has its own link: | View | URL | |------|-----| | Docs + Mind Map (split) | [`/second-brain/`](https://ericcgu.github.io/second-brain/) | | Graph | [`/second-brain/graph/`](https://ericcgu.github.io/second-brain/graph/) | | Mind Map | [`/second-brain/mindmap/`](https://ericcgu.github.io/second-brain/mindmap/) | Any view also accepts `?view=graph|mindmap|docs|split`, and a note hash such as `#notes%2Fopen-knowledge-format.md`. - **🚀 Zero-Dependency Deployment:** Native Node.js build system with automated GitHub Actions CI/CD to publish directly to GitHub Pages. ---"},{"level":2,"title":"🏗 Architecture & Progressive Disclosure","slug":"architecture-progressive-disclosure","text":"``` second-brain/ ├── index.md # Root Table of Contents (okf_version: \"0.2\") ├── inbox.md # Human scratchpad & quick capture (type: inbox) ├── log.md # Automated AI changelog ├── AGENTS.md # System instructions & rules for AI assistants ├── notes/ # Knowledge base (type: note, concept, reference) │ ├── open-knowledge-format.md │ └── how-to-use-this.md ├── dev-tools/ # Replicable system environments & AI prompts │ ├── index.md │ ├── macos-terminal-tokyo-glass.md │ ├── tokyo-night-storm.md │ └── agy-cli-permissions.md ├── scripts/ │ ├── validate-okf.mjs # Fast YAML frontmatter & graph integrity validator │ └── export-graph.mjs # Standalone Mind Map & Docs HTML generator ├── site/ │ ├── index.html # Compiled docs + mind map (split view) │ ├── graph/index.html # Graph view → /graph/ │ └── mindmap/index.html # Mind map view → /mindmap/ └── .github/workflows/ └── deploy.yml # Automated GitHub Pages deployment pipeline ```"},{"level":3,"title":"Progressive Disclosure Flow","slug":"progressive-disclosure-flow","text":"```mermaid flowchart TD A[Human Prompt / Idea] --> B[inbox.md / Scratchpad] B --> C[AI Agent Reads index.md Root] C --> D{Branch Decision} D -->|Targeted Context| E[notes/*.md or dev-tools/*.md] D -->|New Knowledge| F[Synthesize Note + Frontmatter] F --> G[Update index.md & log.md] G --> H[Run scripts/export-graph.mjs] H --> I[Push to GitHub & Auto-Deploy Pages] ``` ---"},{"level":2,"title":"🤖 Agent-Native Workflow (AGENTS.md)","slug":"agent-native-workflow-agents-md","text":"This repository is governed by an automated rule engine located in [`AGENTS.md`](./AGENTS.md). Whenever an AI assistant creates or updates content, it runs the maintenance checklist: 1. **Strict OKF Frontmatter:** Validates `type`, `title`, `description`, `tags`, and `updated` timestamps. 2. **Root TOC Synchronization:** Maintains bidirectional references in [`index.md`](./index.md). 3. **Audit Log:** Records single-line chronological entries in [`log.md`](./log.md). 4. **Validation & Build:** Executes: ```bash node scripts/validate-okf.mjs && node scripts/export-graph.mjs ``` ---"},{"level":2,"title":"🚀 Quick Start","slug":"quick-start","text":""},{"level":3,"title":"1. Clone & Inspect","slug":"1-clone-inspect","text":"```bash git clone https://github.com/ericcgu/second-brain.git cd second-brain ```"},{"level":3,"title":"2. Add or Edit Notes","slug":"2-add-or-edit-notes","text":"Create a note under `notes/` with standard OKF frontmatter: ```yaml --- type: concept title: \"Distributed Systems Consensus\" subtitle: \"Raft vs Paxos comparison\" description: \"Core trade-offs between leader-based consensus protocols.\" tags: [architecture, distributed-systems] updated: 2026-11-08 --- # Distributed Systems Consensus ... ```"},{"level":3,"title":"3. Build & Preview Locally","slug":"3-build-preview-locally","text":"Run the zero-dependency generator (no `npm install` required): ```bash node scripts/validate-okf.mjs node scripts/export-graph.mjs ``` Open `site/index.html` in your browser to view your live Mind Map and documentation. ---"},{"level":2,"title":"🌐 GitHub Pages Deployment","slug":"github-pages-deployment","text":"The repository includes a GitHub Actions workflow ([`.github/workflows/deploy.yml`](./.github/workflows/deploy.yml)) that automatically builds and deploys your mind map whenever you push to `main`. To enable: 1. Open your repository on GitHub &rarr; **Settings** &rarr; **Pages**. 2. Under **Build and deployment** &rarr; **Source**, select **GitHub Actions**. 3. Push to `main`: ```bash git add . git commit -m \"docs: update second brain\" git push origin main ``` ---"},{"level":2,"title":"🛠 Tech Stack","slug":"tech-stack","text":"- **Format:** Google Open Knowledge Format (OKF v0.2) - **Engine:** Pure Node.js (`node:fs`, `node:path`) - **Search:** MiniSearch Client-Side Fuzzy Search - **Syntax Highlighter:** Highlight.js (Tokyo Night Theme) - **Visualizer:** HTML5 Canvas Bezier Tree Renderer - **Typography:** Vercel Geist Variable Sans & Mono"}],"body":"<div align=\"center\">\n\n# 🧠 Second Brain\n### Agentic AI Context Architecture • Google OKF v0.2 • Interactive Mind Map\n\n[![Google OKF](https://img.shields.io/badge/Format-Google_OKF_v0.2-4285F4?style=flat-square&logo=google&logoColor=white)](https://github.com/ericcgu/second-brain)\n[![GitHub Pages](https://img.shields.io/badge/Live-GitHub_Pages-22c55e?style=flat-square&logo=githubpages&logoColor=white)](https://ericcgu.github.io/second-brain/)\n[![Design System](https://img.shields.io/badge/UI_Design-Geist_/_Linear-09090b?style=flat-square)](https://github.com/ericcgu/second-brain)\n\n*A low-friction, agent-native personal knowledge management engine designed for both human clarity and LLM context precision.*\n\n[🌐 Live Docs](https://ericcgu.github.io/second-brain/) • [🕸 Graph](https://ericcgu.github.io/second-brain/graph/) • [🧭 Mind Map](https://ericcgu.github.io/second-brain/mindmap/) • [Architecture](#-architecture--progressive-disclosure) • [Agent Guidelines](#-agent-native-workflow-agentsmd) • [Getting Started](#-quick-start)\n\n---\n\n</div>\n\n## 💡 Overview\n\nTraditional \"second brains\" (Obsidian, Notion, Foam) often degenerate into sprawling spiderwebs of bidirectional links. While visually interesting, this structure suffers from two fatal flaws:\n1. **Human Friction:** Maintaining tags, metadata, and folders creates cognitive drag, leading to abandoned systems.\n2. **LLM Context Bloat:** Feeding unstructured link mazes into AI coding agents (Antigravity, Gemini, Claude, Cursor) triggers exponential token consumption, lost context, and hallucinations.\n\n**This Second Brain solves both.** Built on **Google's Open Knowledge Format (OKF v0.2)**, knowledge is structured as a **hierarchical progressive-disclosure tree**. AI agents read only high-level indexes before selectively traversing specific nodes, preserving token budgets and maximizing retrieval precision. \n\nThe exact same knowledge tree automatically compiles into an **interactive Mind Map and Developer Docs portal** with zero external dependencies.\n\n---\n\n## ⚡ Key Highlights\n\n- **🤖 AI-First, Human-Effortless:** The AI agent handles 100% of formatting, tagging, indexing, changelogs, and mind-map regeneration. Humans only need to dump thoughts into [`inbox.md`](./inbox.md).\n- **🌲 Progressive Context Disclosure:** OKF v0.2 hierarchical structure allows AI assistants to navigate vast knowledge bases without loading entire repositories into context.\n- **🎨 Interactive Mind Map & Docs Portal:** Self-contained build pipeline (`scripts/export-graph.mjs`) generates a high-performance web dashboard featuring:\n  - Dynamic canvas-based mind map with smooth Bezier curve connections.\n  - Multi-panel dockable workspace (Mind Map, Docs, Split View).\n  - `Cmd+K` Spotlight command palette with MiniSearch fuzzy matching.\n  - Tokyo Night Storm syntax highlighting with instant code copying.\n  - Triple-theme switcher (*Paper*, *Light*, *Dark*).\n- **🔗 Shareable View URLs:** Every visualizer has its own link:\n\n  | View | URL |\n  |------|-----|\n  | Docs + Mind Map (split) | [`/second-brain/`](https://ericcgu.github.io/second-brain/) |\n  | Graph | [`/second-brain/graph/`](https://ericcgu.github.io/second-brain/graph/) |\n  | Mind Map | [`/second-brain/mindmap/`](https://ericcgu.github.io/second-brain/mindmap/) |\n\n  Any view also accepts `?view=graph|mindmap|docs|split`, and a note hash such as `#notes%2Fopen-knowledge-format.md`.\n- **🚀 Zero-Dependency Deployment:** Native Node.js build system with automated GitHub Actions CI/CD to publish directly to GitHub Pages.\n\n---\n\n## 🏗 Architecture & Progressive Disclosure\n\n```\nsecond-brain/\n├── index.md                  # Root Table of Contents (okf_version: \"0.2\")\n├── inbox.md                  # Human scratchpad & quick capture (type: inbox)\n├── log.md                    # Automated AI changelog\n├── AGENTS.md                 # System instructions & rules for AI assistants\n├── notes/                    # Knowledge base (type: note, concept, reference)\n│   ├── open-knowledge-format.md\n│   └── how-to-use-this.md\n├── dev-tools/                # Replicable system environments & AI prompts\n│   ├── index.md\n│   ├── macos-terminal-tokyo-glass.md\n│   ├── tokyo-night-storm.md\n│   └── agy-cli-permissions.md\n├── scripts/\n│   ├── validate-okf.mjs      # Fast YAML frontmatter & graph integrity validator\n│   └── export-graph.mjs      # Standalone Mind Map & Docs HTML generator\n├── site/\n│   ├── index.html            # Compiled docs + mind map (split view)\n│   ├── graph/index.html      # Graph view  →  /graph/\n│   └── mindmap/index.html    # Mind map view  →  /mindmap/\n└── .github/workflows/\n    └── deploy.yml            # Automated GitHub Pages deployment pipeline\n```\n\n### Progressive Disclosure Flow\n\n```mermaid\nflowchart TD\n    A[Human Prompt / Idea] --> B[inbox.md / Scratchpad]\n    B --> C[AI Agent Reads index.md Root]\n    C --> D{Branch Decision}\n    D -->|Targeted Context| E[notes/*.md or dev-tools/*.md]\n    D -->|New Knowledge| F[Synthesize Note + Frontmatter]\n    F --> G[Update index.md & log.md]\n    G --> H[Run scripts/export-graph.mjs]\n    H --> I[Push to GitHub & Auto-Deploy Pages]\n```\n\n---\n\n## 🤖 Agent-Native Workflow (`AGENTS.md`)\n\nThis repository is governed by an automated rule engine located in [`AGENTS.md`](./AGENTS.md). Whenever an AI assistant creates or updates content, it runs the maintenance checklist:\n\n1. **Strict OKF Frontmatter:** Validates `type`, `title`, `description`, `tags`, and `updated` timestamps.\n2. **Root TOC Synchronization:** Maintains bidirectional references in [`index.md`](./index.md).\n3. **Audit Log:** Records single-line chronological entries in [`log.md`](./log.md).\n4. **Validation & Build:** Executes:\n   ```bash\n   node scripts/validate-okf.mjs && node scripts/export-graph.mjs\n   ```\n\n---\n\n## 🚀 Quick Start\n\n### 1. Clone & Inspect\n```bash\ngit clone https://github.com/ericcgu/second-brain.git\ncd second-brain\n```\n\n### 2. Add or Edit Notes\nCreate a note under `notes/` with standard OKF frontmatter:\n```yaml\n---\ntype: concept\ntitle: \"Distributed Systems Consensus\"\nsubtitle: \"Raft vs Paxos comparison\"\ndescription: \"Core trade-offs between leader-based consensus protocols.\"\ntags: [architecture, distributed-systems]\nupdated: 2026-11-08\n---\n\n# Distributed Systems Consensus\n...\n```\n\n### 3. Build & Preview Locally\nRun the zero-dependency generator (no `npm install` required):\n```bash\nnode scripts/validate-okf.mjs\nnode scripts/export-graph.mjs\n```\nOpen `site/index.html` in your browser to view your live Mind Map and documentation.\n\n---\n\n## 🌐 GitHub Pages Deployment\n\nThe repository includes a GitHub Actions workflow ([`.github/workflows/deploy.yml`](./.github/workflows/deploy.yml)) that automatically builds and deploys your mind map whenever you push to `main`.\n\nTo enable:\n1. Open your repository on GitHub &rarr; **Settings** &rarr; **Pages**.\n2. Under **Build and deployment** &rarr; **Source**, select **GitHub Actions**.\n3. Push to `main`:\n   ```bash\n   git add .\n   git commit -m \"docs: update second brain\"\n   git push origin main\n   ```\n\n---\n\n## 🛠 Tech Stack\n\n- **Format:** Google Open Knowledge Format (OKF v0.2)\n- **Engine:** Pure Node.js (`node:fs`, `node:path`)\n- **Search:** MiniSearch Client-Side Fuzzy Search\n- **Syntax Highlighter:** Highlight.js (Tokyo Night Theme)\n- **Visualizer:** HTML5 Canvas Bezier Tree Renderer\n- **Typography:** Vercel Geist Variable Sans & Mono\n","color":"#1c1917","backlinks":["log.md"]},{"id":"dev-tools/agy-cli-permissions.md","title":"AGY CLI Auto-Approval Setup","subtitle":"Turn off manual command approval pauses","type":"concept","group":null,"description":"How to configure ~/.gemini/antigravity-cli/settings.json and command allowlists so the agy CLI runs without manual approval pauses.","updated":"2026-11-07","tags":["agy","cli","workflow","permissions"],"headings":[{"level":2,"text":"Option 1: Interactive Prefix Allowlist","slug":"option-1-interactive-prefix-allowlist"},{"level":2,"text":"Option 2: Global Wildcard in settings.json","slug":"option-2-global-wildcard-in-settings-json"},{"level":2,"text":"Option 3: One-Line Terminal Command to Apply It","slug":"option-3-one-line-terminal-command-to-apply-it"},{"level":2,"text":"Related Notes","slug":"related-notes"}],"sections":[{"level":1,"title":"Overview","slug":"","text":"# AGY CLI Auto-Approval Setup Eliminate manual command approval pauses in the `agy` terminal CLI using either interactive prefix allowlisting or wildcard rules in `settings.json`."},{"level":2,"title":"Option 1: Interactive Prefix Allowlist","slug":"option-1-interactive-prefix-allowlist","text":"During a prompt, when `agy` asks for permission to run a command, select the **\"Always allow...\"** option so that command prefix is permanently added to your allowlist."},{"level":2,"title":"Option 2: Global Wildcard in settings.json","slug":"option-2-global-wildcard-in-settings-json","text":"Open `~/.gemini/antigravity-cli/settings.json` and add wildcard rules under `\"permissions\".\"allow\"` so you aren't prompted for each new command: ```json { \"permissions\": { \"allow\": [ \"command(*)\" ] } } ```"},{"level":2,"title":"Option 3: One-Line Terminal Command to Apply It","slug":"option-3-one-line-terminal-command-to-apply-it","text":"Run this command in your own terminal to merge `\"command(*)\"` into `~/.gemini/antigravity-cli/settings.json`: ```bash python3 - <<'EOF' import json, pathlib p = pathlib.Path.home() / \".gemini/antigravity-cli/settings.json\" p.parent.mkdir(parents=True, exist_ok=True) data = json.loads(p.read_text()) if p.exists() else {} allow = data.setdefault(\"permissions\", {}).setdefault(\"allow\", []) if \"command(*)\" not in allow: allow.append(\"command(*)\") p.write_text(json.dumps(data, indent=2) + \"\\n\") print(\"Updated\", p) EOF ```"},{"level":2,"title":"Related Notes","slug":"related-notes","text":"- [Dev Tools Index](./index.md) - [macOS Terminal TokyoGlass](./macos-terminal-tokyo-glass.md) - [VS Code Tokyo Night Glass](./tokyo-night-storm.md)"}],"body":"\n# AGY CLI Auto-Approval Setup\n\nEliminate manual command approval pauses in the `agy` terminal CLI using either interactive prefix allowlisting or wildcard rules in `settings.json`.\n\n## Option 1: Interactive Prefix Allowlist\n\nDuring a prompt, when `agy` asks for permission to run a command, select the **\"Always allow...\"** option so that command prefix is permanently added to your allowlist.\n\n## Option 2: Global Wildcard in `settings.json`\n\nOpen `~/.gemini/antigravity-cli/settings.json` and add wildcard rules under `\"permissions\".\"allow\"` so you aren't prompted for each new command:\n\n```json\n{\n  \"permissions\": {\n    \"allow\": [\n      \"command(*)\"\n    ]\n  }\n}\n```\n\n## Option 3: One-Line Terminal Command to Apply It\n\nRun this command in your own terminal to merge `\"command(*)\"` into `~/.gemini/antigravity-cli/settings.json`:\n\n```bash\npython3 - <<'EOF'\nimport json, pathlib\np = pathlib.Path.home() / \".gemini/antigravity-cli/settings.json\"\np.parent.mkdir(parents=True, exist_ok=True)\ndata = json.loads(p.read_text()) if p.exists() else {}\nallow = data.setdefault(\"permissions\", {}).setdefault(\"allow\", [])\nif \"command(*)\" not in allow:\n    allow.append(\"command(*)\")\np.write_text(json.dumps(data, indent=2) + \"\\n\")\nprint(\"Updated\", p)\nEOF\n```\n\n## Related Notes\n\n- [Dev Tools Index](./index.md)\n- [macOS Terminal TokyoGlass](./macos-terminal-tokyo-glass.md)\n- [VS Code Tokyo Night Glass](./tokyo-night-storm.md)\n","color":"#44403c","backlinks":["dev-tools/index.md","index.md","log.md"]},{"id":"dev-tools/index.md","title":"Dev Tools","subtitle":"OKF Knowledge Index","type":"index","group":null,"description":"OKF Knowledge Index","updated":"","tags":[],"headings":[{"level":2,"text":"Concepts","slug":"concepts"}],"sections":[{"level":1,"title":"Overview","slug":"","text":"# Dev Tools Concept guides, configurations, and copy-paste prompts for replicating local development environments on any Mac."},{"level":2,"title":"Concepts","slug":"concepts","text":"- [macOS Terminal TokyoGlass](./macos-terminal-tokyo-glass.md) - Concept breakdown, step-by-step script, and AI prompt to replicate the `TokyoGlass16_5` frosted-glass macOS Terminal profile. - [VS Code Tokyo Night Glass](./tokyo-night-storm.md) - Concept breakdown, step-by-step setup, and AI prompt to replicate the Tokyo Night Storm frosted-glass theme in VS Code. - [AGY CLI Auto-Approval Setup](./agy-cli-permissions.md) - Turn off manual command approval pauses in the `agy` CLI via allowlists or `settings.json`."}],"body":"# Dev Tools\n\nConcept guides, configurations, and copy-paste prompts for replicating local development environments on any Mac.\n\n## Concepts\n\n- [macOS Terminal TokyoGlass](./macos-terminal-tokyo-glass.md) - Concept breakdown, step-by-step script, and AI prompt to replicate the `TokyoGlass16_5` frosted-glass macOS Terminal profile.\n- [VS Code Tokyo Night Glass](./tokyo-night-storm.md) - Concept breakdown, step-by-step setup, and AI prompt to replicate the Tokyo Night Storm frosted-glass theme in VS Code.\n- [AGY CLI Auto-Approval Setup](./agy-cli-permissions.md) - Turn off manual command approval pauses in the `agy` CLI via allowlists or `settings.json`.\n","color":"#1c1917","backlinks":["dev-tools/agy-cli-permissions.md","index.md"]},{"id":"dev-tools/macos-terminal-tokyo-glass.md","title":"macOS Terminal TokyoGlass","subtitle":"Frosted-glass Terminal.app profile (TokyoGlass16_5)","type":"concept","group":"Themes","description":"Step-by-step concept guide and reusable AI prompt to replicate the custom TokyoGlass16_5 frosted-glass macOS Terminal profile on any Mac.","updated":"2026-11-07","tags":["macos","terminal","tokyo-night","glass","ai-prompt"],"headings":[{"level":2,"text":"1. Concept: How the Frosted Glass Terminal Works","slug":"1-concept-how-the-frosted-glass-terminal-works"},{"level":2,"text":"2. Copy-Paste AI Prompt (Replicate on Any Mac)","slug":"2-copy-paste-ai-prompt-replicate-on-any-mac"},{"level":2,"text":"3. Step-by-Step Manual / Scripted Replication","slug":"3-step-by-step-manual-scripted-replication"},{"level":3,"text":"Step 1: Run the Self-Contained Installer Script","slug":"step-1-run-the-self-contained-installer-script"},{"level":3,"text":"Step 2: Export or Import as a .terminal File (Alternative)","slug":"step-2-export-or-import-as-a-terminal-file-alternative"}],"sections":[{"level":1,"title":"Overview","slug":"","text":"# macOS Terminal TokyoGlass Setup (`TokyoGlass16_5`) This concept documents how the **`TokyoGlass16_5`** macOS `Terminal.app` profile works under the hood, along with a **copy-paste AI prompt** and **step-by-step instructions** to replicate the exact frosted Tokyo Night glass terminal on any Mac. Related: [VS Code Tokyo Night Storm Glass Setup](./tokyo-night-storm.md) · [Second Brain Index](../index.md) ---"},{"level":2,"title":"1. Concept: How the Frosted Glass Terminal Works","slug":"1-concept-how-the-frosted-glass-terminal-works","text":"macOS `Terminal.app` stores custom profiles in `~/Library/Preferences/com.apple.Terminal.plist` under the `\"Window Settings\"` dictionary. Each color and font property is serialized as a binary `NSKeyedArchiver` (`NSColor` / `NSFont`) blob. The **`TokyoGlass16_5`** aesthetic is built from four pillars: 1. **Frosted Dark Navy Glass Backdrop** - **Background RGB**: `0.086, 0.102, 0.157` (`#161A28`) - **Background Opacity (Alpha)**: `0.60` (60% opacity / 40% translucency) - **Active Window Blur (`BackgroundBlur`)**: `0.65` (65% Gaussian blur via macOS WindowServer) - **Inactive Window Blur (`BackgroundBlurInactive`)**: `0.0` (`BackgroundSettingsForInactiveWindows: false`) 2. **Typography & Geometry** - **Font**: `SFMonoTerminal-Regular` (`16pt`, antialiased) - **Line Height (`FontHeightSpacing`)**: `1.12` - **Character Width (`FontWidthSpacing`)**: `1.01` - **Window Grid**: `120` columns × `30` rows 3. **Cursor, Text & Selection** - **Normal Text (`TextColor`)**: `#D8E0F1` (`0.847, 0.878, 0.945`) - **Bold Text (`TextBoldColor`)**: `#F1F6FF` (`0.945, 0.965, 1.000`) - **Cursor**: Blinking vertical bar (`CursorType: 2`, `CursorBlink: true`) in Sky Cyan `#7DCFFF` (`0.490, 0.812, 1.000`) - **Selection (`SelectionColor`)**: `#374E79` at `0.75` alpha (`0.215, 0.305, 0.475, 0.75`) - **Input & Bell**: `useOptionAsMetaKey: true`, `Bell: false`, `VisualBell: false`, `ShowWindowSettingsNameInTitle: false` 4. **16-Color Tokyo Night ANSI Palette** | ANSI Slot | Hex | Normalized `NSRGB` (`R G B`) | | :--- | :--- | :--- | | **Black** (`ANSIBlackColor`) | `#252A3C` | `0.145 0.165 0.235` | | **Bright Black** (`ANSIBrightBlackColor`) | `#565F7E` | `0.337 0.373 0.494` | | **Red** (`ANSIRedColor`) | `#F7768E` | `0.969 0.463 0.557` | | **Bright Red** (`ANSIBrightRedColor`) | `#FF94A8` | `1.000 0.580 0.659` | | **Green** (`ANSIGreenColor`) | `#9ECE6A` | `0.620 0.808 0.416` | | **Bright Green** (`ANSIBrightGreenColor`) | `#B3E285` | `0.702 0.886 0.522` | | **Yellow** (`ANSIYellowColor`) | `#E0AF68` | `0.878 0.686 0.408` | | **Bright Yellow** (`ANSIBrightYellowColor`) | `#F2CB8A` | `0.949 0.796 0.541` | | **Blue** (`ANSIBlueColor`) | `#7AA2F7` | `0.478 0.635 0.969` | | **Bright Blue** (`ANSIBrightBlueColor`) | `#91B9FF` | `0.569 0.725 1.000` | | **Magenta** (`ANSIMagentaColor`) | `#BB9AF7` | `0.733 0.604 0.969` | | **Bright Magenta** (`ANSIBrightMagentaColor`) | `#D0B4FF` | `0.816 0.706 1.000` | | **Cyan** (`ANSICyanColor`) | `#7DCFFF` | `0.490 0.812 1.000` | | **Bright Cyan** (`ANSIBrightCyanColor`) | `#9BE2FF` | `0.608 0.886 1.000` | | **White** (`ANSIWhiteColor`) | `#C0CAF5` | `0.753 0.792 0.898` | | **Bright White** (`ANSIBrightWhiteColor`) | `#F1F6FF` | `0.945 0.965 1.000` | ---"},{"level":2,"title":"2. Copy-Paste AI Prompt (Replicate on Any Mac)","slug":"2-copy-paste-ai-prompt-replicate-on-any-mac","text":"Paste the block below into `agy` (or any terminal AI agent) on a new Mac to automatically create and activate the `TokyoGlass16_5` profile: ```text Configure my macOS Terminal.app with a custom profile named \"TokyoGlass16_5\" and set it as both the Default and Startup Window Settings in ~/Library/Preferences/com.apple.Terminal.plist. Use these exact specifications: 1. Glass & Window: - BackgroundColor: NSRGB \"0.086 0.102 0.157 0.6\" (#161A28 at 60% opacity) - BackgroundBlur: 0.65 - BackgroundBlurInactive: 0.0 - BackgroundSettingsForInactiveWindows: false - columnCount: 120, rowCount: 30 - ShowWindowSettingsNameInTitle: false - Bell: false, VisualBell: false - useOptionAsMetaKey: true - DynamicANSIForegroundColors: false 2. Font: - Font: SFMonoTerminal-Regular, size 16.0 - FontAntialias: true - FontHeightSpacing: 1.12 - FontWidthSpacing: 1.01 3. Text, Cursor & Selection: - TextColor: NSRGB \"0.847 0.878 0.945\" (#D8E0F1) - TextBoldColor: NSRGB \"0.945 0.965 1\" (#F1F6FF) - CursorColor: NSRGB \"0.49 0.812 1\" (#7DCFFF) - CursorType: 2 (Vertical Bar), CursorBlink: true - SelectionColor: NSRGB \"0.215 0.305 0.475 0.75\" (#374E79 @ 75%) 4. ANSI Palette (NSKeyedArchiver NSColor blobs with NSColorSpace=1): - ANSIBlackColor: \"0.145 0.165 0.235\" - ANSIBrightBlackColor: \"0.337 0.373 0.494\" - ANSIRedColor: \"0.969 0.463 0.557\" - ANSIBrightRedColor: \"1 0.58 0.659\" - ANSIGreenColor: \"0.62 0.808 0.416\" - ANSIBrightGreenColor: \"0.702 0.886 0.522\" - ANSIYellowColor: \"0.878 0.686 0.408\" - ANSIBrightYellowColor: \"0.949 0.796 0.541\" - ANSIBlueColor: \"0.478 0.635 0.969\" - ANSIBrightBlueColor: \"0.569 0.725 1\" - ANSIMagentaColor: \"0.733 0.604 0.969\" - ANSIBrightMagentaColor: \"0.816 0.706 1\" - ANSICyanColor: \"0.49 0.812 1\" - ANSIBrightCyanColor: \"0.608 0.886 1\" - ANSIWhiteColor: \"0.753 0.792 0.898\" - ANSIBrightWhiteColor: \"0.945 0.965 1\" Write a Python script using plistlib to encode the NSKeyedArchiver NSColor/NSFont objects, inject \"TokyoGlass16_5\" into ~/Library/Preferences/com.apple.Terminal.plist, set \"Default Window Settings\" and \"Startup Window Settings\" to \"TokyoGlass16_5\", and reload cfprefsd. ``` ---"},{"level":2,"title":"3. Step-by-Step Manual / Scripted Replication","slug":"3-step-by-step-manual-scripted-replication","text":""},{"level":3,"title":"Step 1: Run the Self-Contained Installer Script","slug":"step-1-run-the-self-contained-installer-script","text":"On any Mac, run the following Python script in Terminal to generate and activate `TokyoGlass16_5`: ```bash python3 - <<'EOF' import os, plistlib, subprocess plist_path = os.path.expanduser(\"~/Library/Preferences/com.apple.Terminal.plist\") with open(plist_path, \"rb\") as f: prefs = plistlib.load(f) def make_nscolor(nsrgb_str): archive = { \"$version\": 100000, \"$archiver\": \"NSKeyedArchiver\", \"$top\": {\"root\": plistlib.UID(1)}, \"$objects\": [ \"$null\", { \"NSRGB\": nsrgb_str.encode(\"ascii\") + b\"\\x00\", \"NSColorSpace\": 1, \"$class\": plistlib.UID(2), }, {\"$classname\": \"NSColor\", \"$classes\": [\"NSColor\", \"NSObject\"]}, ], } return plistlib.dumps(archive, fmt=plistlib.FMT_BINARY) def make_nsfont(name, size): archive = { \"$version\": 100000, \"$archiver\": \"NSKeyedArchiver\", \"$top\": {\"root\": plistlib.UID(1)}, \"$objects\": [ \"$null\", { \"NSSize\": float(size), \"NSfFlags\": 16, \"NSName\": plistlib.UID(2), \"$class\": plistlib.UID(3), }, name, {\"$classname\": \"NSFont\", \"$classes\": [\"NSFont\", \"NSObject\"]}, ], } return plistlib.dumps(archive, fmt=plistlib.FMT_BINARY) profile = { \"name\": \"TokyoGlass16_5\", \"type\": \"Window Settings\", \"ProfileCurrentVersion\": 2.09, \"columnCount\": 120, \"rowCount\": 30, \"BackgroundBlur\": 0.65, \"BackgroundBlurInactive\": 0.0, \"BackgroundSettingsForInactiveWindows\": False, \"BackgroundColor\": make_nscolor(\"0.086 0.102 0.157 0.6\"), \"TextColor\": make_nscolor(\"0.847 0.878 0.945\"), \"TextBoldColor\": make_nscolor(\"0.945 0.965 1\"), \"CursorColor\": make_nscolor(\"0.49 0.812 1\"), \"CursorType\": 2, \"CursorBlink\": True, \"SelectionColor\": make_nscolor(\"0.215 0.305 0.475 0.75\"), \"Font\": make_nsfont(\"SFMonoTerminal-Regular\", 16.0), \"FontAntialias\": True, \"FontHeightSpacing\": 1.12, \"FontWidthSpacing\": 1.01, \"Bell\": False, \"VisualBell\": False, \"ShowWindowSettingsNameInTitle\": False, \"DynamicANSIForegroundColors\": False, \"useOptionAsMetaKey\": True, \"ANSIBlackColor\": make_nscolor(\"0.145 0.165 0.235\"), \"ANSIBrightBlackColor\": make_nscolor(\"0.337 0.373 0.494\"), \"ANSIRedColor\": make_nscolor(\"0.969 0.463 0.557\"), \"ANSIBrightRedColor\": make_nscolor(\"1 0.58 0.659\"), \"ANSIGreenColor\": make_nscolor(\"0.62 0.808 0.416\"), \"ANSIBrightGreenColor\": make_nscolor(\"0.702 0.886 0.522\"), \"ANSIYellowColor\": make_nscolor(\"0.878 0.686 0.408\"), \"ANSIBrightYellowColor\": make_nscolor(\"0.949 0.796 0.541\"), \"ANSIBlueColor\": make_nscolor(\"0.478 0.635 0.969\"), \"ANSIBrightBlueColor\": make_nscolor(\"0.569 0.725 1\"), \"ANSIMagentaColor\": make_nscolor(\"0.733 0.604 0.969\"), \"ANSIBrightMagentaColor\": make_nscolor(\"0.816 0.706 1\"), \"ANSICyanColor\": make_nscolor(\"0.49 0.812 1\"), \"ANSIBrightCyanColor\": make_nscolor(\"0.608 0.886 1\"), \"ANSIWhiteColor\": make_nscolor(\"0.753 0.792 0.898\"), \"ANSIBrightWhiteColor\": make_nscolor(\"0.945 0.965 1\"), } prefs.setdefault(\"Window Settings\", {})[\"TokyoGlass16_5\"] = profile prefs[\"Default Window Settings\"] = \"TokyoGlass16_5\" prefs[\"Startup Window Settings\"] = \"TokyoGlass16_5\" with open(plist_path, \"wb\") as f: plistlib.dump(prefs, f, fmt=plistlib.FMT_BINARY) subprocess.run([\"killall\", \"cfprefsd\"], check=False) print(\"✅ TokyoGlass16_5 installed and set as default!\") EOF ```"},{"level":3,"title":"Step 2: Export or Import as a .terminal File (Alternative)","slug":"step-2-export-or-import-as-a-terminal-file-alternative","text":"If you want to export the profile as a portable `.terminal` file from an existing Mac: ```bash plutil -extract \"Window Settings.TokyoGlass16_5\" xml1 -o ~/Desktop/TokyoGlass16_5.terminal ~/Library/Preferences/com.apple.Terminal.plist ``` On any new Mac, double-click `TokyoGlass16_5.terminal` and click **Shell → Use Settings as Default**."}],"body":"\n# macOS Terminal TokyoGlass Setup (`TokyoGlass16_5`)\n\nThis concept documents how the **`TokyoGlass16_5`** macOS `Terminal.app` profile works under the hood, along with a **copy-paste AI prompt** and **step-by-step instructions** to replicate the exact frosted Tokyo Night glass terminal on any Mac.\n\nRelated: [VS Code Tokyo Night Storm Glass Setup](./tokyo-night-storm.md) · [Second Brain Index](../index.md)\n\n---\n\n## 1. Concept: How the Frosted Glass Terminal Works\n\nmacOS `Terminal.app` stores custom profiles in `~/Library/Preferences/com.apple.Terminal.plist` under the `\"Window Settings\"` dictionary. Each color and font property is serialized as a binary `NSKeyedArchiver` (`NSColor` / `NSFont`) blob.\n\nThe **`TokyoGlass16_5`** aesthetic is built from four pillars:\n\n1. **Frosted Dark Navy Glass Backdrop**\n   - **Background RGB**: `0.086, 0.102, 0.157` (`#161A28`)\n   - **Background Opacity (Alpha)**: `0.60` (60% opacity / 40% translucency)\n   - **Active Window Blur (`BackgroundBlur`)**: `0.65` (65% Gaussian blur via macOS WindowServer)\n   - **Inactive Window Blur (`BackgroundBlurInactive`)**: `0.0` (`BackgroundSettingsForInactiveWindows: false`)\n2. **Typography & Geometry**\n   - **Font**: `SFMonoTerminal-Regular` (`16pt`, antialiased)\n   - **Line Height (`FontHeightSpacing`)**: `1.12`\n   - **Character Width (`FontWidthSpacing`)**: `1.01`\n   - **Window Grid**: `120` columns × `30` rows\n3. **Cursor, Text & Selection**\n   - **Normal Text (`TextColor`)**: `#D8E0F1` (`0.847, 0.878, 0.945`)\n   - **Bold Text (`TextBoldColor`)**: `#F1F6FF` (`0.945, 0.965, 1.000`)\n   - **Cursor**: Blinking vertical bar (`CursorType: 2`, `CursorBlink: true`) in Sky Cyan `#7DCFFF` (`0.490, 0.812, 1.000`)\n   - **Selection (`SelectionColor`)**: `#374E79` at `0.75` alpha (`0.215, 0.305, 0.475, 0.75`)\n   - **Input & Bell**: `useOptionAsMetaKey: true`, `Bell: false`, `VisualBell: false`, `ShowWindowSettingsNameInTitle: false`\n4. **16-Color Tokyo Night ANSI Palette**\n\n| ANSI Slot | Hex | Normalized `NSRGB` (`R G B`) |\n| :--- | :--- | :--- |\n| **Black** (`ANSIBlackColor`) | `#252A3C` | `0.145 0.165 0.235` |\n| **Bright Black** (`ANSIBrightBlackColor`) | `#565F7E` | `0.337 0.373 0.494` |\n| **Red** (`ANSIRedColor`) | `#F7768E` | `0.969 0.463 0.557` |\n| **Bright Red** (`ANSIBrightRedColor`) | `#FF94A8` | `1.000 0.580 0.659` |\n| **Green** (`ANSIGreenColor`) | `#9ECE6A` | `0.620 0.808 0.416` |\n| **Bright Green** (`ANSIBrightGreenColor`) | `#B3E285` | `0.702 0.886 0.522` |\n| **Yellow** (`ANSIYellowColor`) | `#E0AF68` | `0.878 0.686 0.408` |\n| **Bright Yellow** (`ANSIBrightYellowColor`) | `#F2CB8A` | `0.949 0.796 0.541` |\n| **Blue** (`ANSIBlueColor`) | `#7AA2F7` | `0.478 0.635 0.969` |\n| **Bright Blue** (`ANSIBrightBlueColor`) | `#91B9FF` | `0.569 0.725 1.000` |\n| **Magenta** (`ANSIMagentaColor`) | `#BB9AF7` | `0.733 0.604 0.969` |\n| **Bright Magenta** (`ANSIBrightMagentaColor`) | `#D0B4FF` | `0.816 0.706 1.000` |\n| **Cyan** (`ANSICyanColor`) | `#7DCFFF` | `0.490 0.812 1.000` |\n| **Bright Cyan** (`ANSIBrightCyanColor`) | `#9BE2FF` | `0.608 0.886 1.000` |\n| **White** (`ANSIWhiteColor`) | `#C0CAF5` | `0.753 0.792 0.898` |\n| **Bright White** (`ANSIBrightWhiteColor`) | `#F1F6FF` | `0.945 0.965 1.000` |\n\n---\n\n## 2. Copy-Paste AI Prompt (Replicate on Any Mac)\n\nPaste the block below into `agy` (or any terminal AI agent) on a new Mac to automatically create and activate the `TokyoGlass16_5` profile:\n\n```text\nConfigure my macOS Terminal.app with a custom profile named \"TokyoGlass16_5\" and set it as both the Default and Startup Window Settings in ~/Library/Preferences/com.apple.Terminal.plist.\n\nUse these exact specifications:\n1. Glass & Window:\n   - BackgroundColor: NSRGB \"0.086 0.102 0.157 0.6\" (#161A28 at 60% opacity)\n   - BackgroundBlur: 0.65\n   - BackgroundBlurInactive: 0.0\n   - BackgroundSettingsForInactiveWindows: false\n   - columnCount: 120, rowCount: 30\n   - ShowWindowSettingsNameInTitle: false\n   - Bell: false, VisualBell: false\n   - useOptionAsMetaKey: true\n   - DynamicANSIForegroundColors: false\n2. Font:\n   - Font: SFMonoTerminal-Regular, size 16.0\n   - FontAntialias: true\n   - FontHeightSpacing: 1.12\n   - FontWidthSpacing: 1.01\n3. Text, Cursor & Selection:\n   - TextColor: NSRGB \"0.847 0.878 0.945\" (#D8E0F1)\n   - TextBoldColor: NSRGB \"0.945 0.965 1\" (#F1F6FF)\n   - CursorColor: NSRGB \"0.49 0.812 1\" (#7DCFFF)\n   - CursorType: 2 (Vertical Bar), CursorBlink: true\n   - SelectionColor: NSRGB \"0.215 0.305 0.475 0.75\" (#374E79 @ 75%)\n4. ANSI Palette (NSKeyedArchiver NSColor blobs with NSColorSpace=1):\n   - ANSIBlackColor: \"0.145 0.165 0.235\"\n   - ANSIBrightBlackColor: \"0.337 0.373 0.494\"\n   - ANSIRedColor: \"0.969 0.463 0.557\"\n   - ANSIBrightRedColor: \"1 0.58 0.659\"\n   - ANSIGreenColor: \"0.62 0.808 0.416\"\n   - ANSIBrightGreenColor: \"0.702 0.886 0.522\"\n   - ANSIYellowColor: \"0.878 0.686 0.408\"\n   - ANSIBrightYellowColor: \"0.949 0.796 0.541\"\n   - ANSIBlueColor: \"0.478 0.635 0.969\"\n   - ANSIBrightBlueColor: \"0.569 0.725 1\"\n   - ANSIMagentaColor: \"0.733 0.604 0.969\"\n   - ANSIBrightMagentaColor: \"0.816 0.706 1\"\n   - ANSICyanColor: \"0.49 0.812 1\"\n   - ANSIBrightCyanColor: \"0.608 0.886 1\"\n   - ANSIWhiteColor: \"0.753 0.792 0.898\"\n   - ANSIBrightWhiteColor: \"0.945 0.965 1\"\n\nWrite a Python script using plistlib to encode the NSKeyedArchiver NSColor/NSFont objects, inject \"TokyoGlass16_5\" into ~/Library/Preferences/com.apple.Terminal.plist, set \"Default Window Settings\" and \"Startup Window Settings\" to \"TokyoGlass16_5\", and reload cfprefsd.\n```\n\n---\n\n## 3. Step-by-Step Manual / Scripted Replication\n\n### Step 1: Run the Self-Contained Installer Script\n\nOn any Mac, run the following Python script in Terminal to generate and activate `TokyoGlass16_5`:\n\n```bash\npython3 - <<'EOF'\nimport os, plistlib, subprocess\n\nplist_path = os.path.expanduser(\"~/Library/Preferences/com.apple.Terminal.plist\")\nwith open(plist_path, \"rb\") as f:\n    prefs = plistlib.load(f)\n\ndef make_nscolor(nsrgb_str):\n    archive = {\n        \"$version\": 100000,\n        \"$archiver\": \"NSKeyedArchiver\",\n        \"$top\": {\"root\": plistlib.UID(1)},\n        \"$objects\": [\n            \"$null\",\n            {\n                \"NSRGB\": nsrgb_str.encode(\"ascii\") + b\"\\x00\",\n                \"NSColorSpace\": 1,\n                \"$class\": plistlib.UID(2),\n            },\n            {\"$classname\": \"NSColor\", \"$classes\": [\"NSColor\", \"NSObject\"]},\n        ],\n    }\n    return plistlib.dumps(archive, fmt=plistlib.FMT_BINARY)\n\ndef make_nsfont(name, size):\n    archive = {\n        \"$version\": 100000,\n        \"$archiver\": \"NSKeyedArchiver\",\n        \"$top\": {\"root\": plistlib.UID(1)},\n        \"$objects\": [\n            \"$null\",\n            {\n                \"NSSize\": float(size),\n                \"NSfFlags\": 16,\n                \"NSName\": plistlib.UID(2),\n                \"$class\": plistlib.UID(3),\n            },\n            name,\n            {\"$classname\": \"NSFont\", \"$classes\": [\"NSFont\", \"NSObject\"]},\n        ],\n    }\n    return plistlib.dumps(archive, fmt=plistlib.FMT_BINARY)\n\nprofile = {\n    \"name\": \"TokyoGlass16_5\",\n    \"type\": \"Window Settings\",\n    \"ProfileCurrentVersion\": 2.09,\n    \"columnCount\": 120,\n    \"rowCount\": 30,\n    \"BackgroundBlur\": 0.65,\n    \"BackgroundBlurInactive\": 0.0,\n    \"BackgroundSettingsForInactiveWindows\": False,\n    \"BackgroundColor\": make_nscolor(\"0.086 0.102 0.157 0.6\"),\n    \"TextColor\": make_nscolor(\"0.847 0.878 0.945\"),\n    \"TextBoldColor\": make_nscolor(\"0.945 0.965 1\"),\n    \"CursorColor\": make_nscolor(\"0.49 0.812 1\"),\n    \"CursorType\": 2,\n    \"CursorBlink\": True,\n    \"SelectionColor\": make_nscolor(\"0.215 0.305 0.475 0.75\"),\n    \"Font\": make_nsfont(\"SFMonoTerminal-Regular\", 16.0),\n    \"FontAntialias\": True,\n    \"FontHeightSpacing\": 1.12,\n    \"FontWidthSpacing\": 1.01,\n    \"Bell\": False,\n    \"VisualBell\": False,\n    \"ShowWindowSettingsNameInTitle\": False,\n    \"DynamicANSIForegroundColors\": False,\n    \"useOptionAsMetaKey\": True,\n    \"ANSIBlackColor\": make_nscolor(\"0.145 0.165 0.235\"),\n    \"ANSIBrightBlackColor\": make_nscolor(\"0.337 0.373 0.494\"),\n    \"ANSIRedColor\": make_nscolor(\"0.969 0.463 0.557\"),\n    \"ANSIBrightRedColor\": make_nscolor(\"1 0.58 0.659\"),\n    \"ANSIGreenColor\": make_nscolor(\"0.62 0.808 0.416\"),\n    \"ANSIBrightGreenColor\": make_nscolor(\"0.702 0.886 0.522\"),\n    \"ANSIYellowColor\": make_nscolor(\"0.878 0.686 0.408\"),\n    \"ANSIBrightYellowColor\": make_nscolor(\"0.949 0.796 0.541\"),\n    \"ANSIBlueColor\": make_nscolor(\"0.478 0.635 0.969\"),\n    \"ANSIBrightBlueColor\": make_nscolor(\"0.569 0.725 1\"),\n    \"ANSIMagentaColor\": make_nscolor(\"0.733 0.604 0.969\"),\n    \"ANSIBrightMagentaColor\": make_nscolor(\"0.816 0.706 1\"),\n    \"ANSICyanColor\": make_nscolor(\"0.49 0.812 1\"),\n    \"ANSIBrightCyanColor\": make_nscolor(\"0.608 0.886 1\"),\n    \"ANSIWhiteColor\": make_nscolor(\"0.753 0.792 0.898\"),\n    \"ANSIBrightWhiteColor\": make_nscolor(\"0.945 0.965 1\"),\n}\n\nprefs.setdefault(\"Window Settings\", {})[\"TokyoGlass16_5\"] = profile\nprefs[\"Default Window Settings\"] = \"TokyoGlass16_5\"\nprefs[\"Startup Window Settings\"] = \"TokyoGlass16_5\"\n\nwith open(plist_path, \"wb\") as f:\n    plistlib.dump(prefs, f, fmt=plistlib.FMT_BINARY)\n\nsubprocess.run([\"killall\", \"cfprefsd\"], check=False)\nprint(\"✅ TokyoGlass16_5 installed and set as default!\")\nEOF\n```\n\n### Step 2: Export or Import as a `.terminal` File (Alternative)\n\nIf you want to export the profile as a portable `.terminal` file from an existing Mac:\n\n```bash\nplutil -extract \"Window Settings.TokyoGlass16_5\" xml1 -o ~/Desktop/TokyoGlass16_5.terminal ~/Library/Preferences/com.apple.Terminal.plist\n```\n\nOn any new Mac, double-click `TokyoGlass16_5.terminal` and click **Shell → Use Settings as Default**.\n","color":"#44403c","backlinks":["dev-tools/agy-cli-permissions.md","dev-tools/index.md","dev-tools/tokyo-night-storm.md","index.md","log.md"]},{"id":"dev-tools/tokyo-night-storm.md","title":"VS Code Tokyo Night Glass","subtitle":"Vibrancy Continued + Tokyo Night Storm CSS","type":"concept","group":"Themes","description":"Step-by-step concept guide and reusable AI prompt to replicate the Tokyo Night Storm frosted-glass setup in VS Code on any Mac.","updated":"2026-11-07","tags":["macos","vscode","tokyo-night","glass","ai-prompt"],"headings":[{"level":2,"text":"1. Concept: How VS Code Glass / Vibrancy Works on macOS","slug":"1-concept-how-vs-code-glass-vibrancy-works-on-macos"},{"level":3,"text":"Common Pitfalls & Why It Can Look Weird Out-of-the-Box","slug":"common-pitfalls-why-it-can-look-weird-out-of-the-box"},{"level":2,"text":"2. Copy-Paste AI Prompt (Replicate on Any Mac)","slug":"2-copy-paste-ai-prompt-replicate-on-any-mac"},{"level":2,"text":"3. Step-by-Step Manual Replication","slug":"3-step-by-step-manual-replication"},{"level":3,"text":"Step 1: Install the Extensions","slug":"step-1-install-the-extensions"},{"level":3,"text":"Step 2: Remove the Blurry Neon Glow in Vibrancy's Tokyo Night Storm CSS (Optional but Recommended)","slug":"step-2-remove-the-blurry-neon-glow-in-vibrancy-s-tokyo-night-storm-css-optional-but-recommended"},{"level":3,"text":"Step 3: Apply settings.json","slug":"step-3-apply-settings-json"},{"level":3,"text":"Step 4: Activate Vibrancy in VS Code","slug":"step-4-activate-vibrancy-in-vs-code"}],"sections":[{"level":1,"title":"Overview","slug":"","text":"# VS Code Tokyo Night Storm Glass Setup (`tokyo-night-storm`) This concept explains how the **Tokyo Night Storm** frosted-glass setup works in VS Code on macOS, why certain vibrancy defaults can look off, and how to replicate the exact setup cleanly on any Mac using either a **copy-paste AI prompt** or **step-by-step commands**. Related: [macOS Terminal TokyoGlass Setup](./macos-terminal-tokyo-glass.md) · [Second Brain Index](../index.md) ---"},{"level":2,"title":"1. Concept: How VS Code Glass / Vibrancy Works on macOS","slug":"1-concept-how-vs-code-glass-vibrancy-works-on-macos","text":"Unlike `Terminal.app`, VS Code (an Electron app) uses opaque workbench layers by default. Achieving the **Tokyo Night Storm** glass look requires three layers working together: 1. **Syntax & UI Theme (`enkia.tokyo-night` + `pkief.material-icon-theme`)** - Sets `\"workbench.colorTheme\": \"Tokyo Night Storm\"` and `\"workbench.iconTheme\": \"material-icon-theme\"`. 2. **Native macOS Vibrancy Injection (`illixion.vscode-vibrancy-continued`)** - Patches VS Code's Electron `BrowserWindow` (`main.js` and `mainImpl.js`) with `visualEffectState: \"active\"`, `frame: false`, and `transparent: true`. - Calls Electron's `window.setVibrancy(\"under-window\")` so macOS WindowServer blurs everything behind the VS Code window. - Injects a root `<style>` tag setting `html { background: rgba(R, G, B, opacity) !important; }` using `\"vscode_vibrancy.backgroundOverride\"` (`#181F31` or `#161A28`) and `\"vscode_vibrancy.opacity\"` (`0.42`–`0.60`). 3. **Transparent Surface Layering (`workbench.colorCustomizations` & Terminal DOM Renderer)** - Sets `\"terminal.integrated.gpuAcceleration\": \"off\"` so the integrated terminal uses the DOM renderer instead of an opaque WebGL canvas. - Replaces opaque workbench surfaces (`editorPane.background`, `editorGutter.background`, `panel.background`, `terminal.background`, `tab.activeBackground`) with `#181f3100` (transparent) or translucent tiers (`#181f316b` for sidebar/editor, `#181f31bf` for sticky scroll, `#181f31e6` for floating widgets/menus)."},{"level":3,"title":"Common Pitfalls & Why It Can Look Weird Out-of-the-Box","slug":"common-pitfalls-why-it-can-look-weird-out-of-the-box","text":"- **Neon Glow on Code Tokens**: The built-in `Tokyo Night Storm.css` inside `illixion.vscode-vibrancy-continued` includes a rule adding a blurry neon glow (`text-shadow: 0 0 8px, 0 0 2px #000;`) to `.mtk4, .mtk9.mtk10, .mtk11, ...`. Removing that rule keeps text crisp like `Terminal.app`. - **Double-Tinted Panes**: Because `html` already has the base tint, setting `editor.background` to `#181f316b` while `editorGutter.background` is `#181f3100` can make the editor slightly darker than the line-number gutter. Setting `editor.background` to `#181f3100` (with `\"vscode_vibrancy.disableColorCustomizations\": true`) makes the entire editor and gutter share a single, uniform glass layer. ---"},{"level":2,"title":"2. Copy-Paste AI Prompt (Replicate on Any Mac)","slug":"2-copy-paste-ai-prompt-replicate-on-any-mac","text":"Paste this prompt into `agy` (or any AI coding agent) on a new Mac to install and configure the complete setup automatically: ```text Set up my VS Code on macOS with the Tokyo Night Storm frosted-glass configuration: 1. Install required VS Code extensions via CLI: - enkia.tokyo-night - illixion.vscode-vibrancy-continued - pkief.material-icon-theme 2. Remove the blurry neon text-shadow rule (.mtk4,.mtk9.mtk10... { text-shadow: 0 0 8px, 0 0 2px #000; }) from ~/.vscode/extensions/illixion.vscode-vibrancy-continued-*/themes/Tokyo Night Storm.css so code tokens stay crisp. 3. Update ~/Library/Application Support/Code/User/settings.json with these theme, vibrancy, editor, and terminal settings (preserving any language-specific settings): - \"workbench.colorTheme\": \"Tokyo Night Storm\" - \"workbench.iconTheme\": \"material-icon-theme\" - \"window.titleBarStyle\": \"custom\" - \"window.systemColorTheme\": \"dark\" - \"window.autoDetectColorScheme\": false - \"vscode_vibrancy.theme\": \"Tokyo Night Storm\" - \"vscode_vibrancy.type\": \"under-window\" - \"vscode_vibrancy.opacity\": 0.42 - \"vscode_vibrancy.backgroundOverride\": \"#181F31\" - \"vscode_vibrancy.preventFlash\": true - \"editor.fontSize\": 16 - \"editor.lineHeight\": 24 - \"editor.minimap.enabled\": false - \"editor.cursorBlinking\": \"smooth\" - \"editor.cursorSmoothCaretAnimation\": \"on\" - \"editor.smoothScrolling\": true - \"terminal.integrated.fontSize\": 16 - \"terminal.integrated.lineHeight\": 1.25 - \"terminal.integrated.cursorStyle\": \"line\" - \"terminal.integrated.cursorBlinking\": true - \"terminal.integrated.gpuAcceleration\": \"off\" - \"workbench.colorCustomizations\" configured for #181f31 vibrancy transparency. 4. Clear macOS quarantine on \"/Applications/Visual Studio Code.app\" if needed so Vibrancy Continued can patch main.js, then remind me to press Cmd+Shift+P -> \"Reload Vibrancy\" inside VS Code. ``` ---"},{"level":2,"title":"3. Step-by-Step Manual Replication","slug":"3-step-by-step-manual-replication","text":""},{"level":3,"title":"Step 1: Install the Extensions","slug":"step-1-install-the-extensions","text":"Run in your terminal: ```bash code --install-extension enkia.tokyo-night code --install-extension illixion.vscode-vibrancy-continued code --install-extension pkief.material-icon-theme ```"},{"level":3,"title":"Step 2: Remove the Blurry Neon Glow in Vibrancy's Tokyo Night Storm CSS (Optional but Recommended)","slug":"step-2-remove-the-blurry-neon-glow-in-vibrancy-s-tokyo-night-storm-css-optional-but-recommended","text":"Strip the `text-shadow` glow rule from the extension's theme stylesheet before loading Vibrancy: ```bash python3 - <<'EOF' import glob, re for path in glob.glob(\"/Users/*/.vscode/extensions/illixion.vscode-vibrancy-continued-*/themes/Tokyo Night Storm.css\"): with open(path, \"r\") as f: css = f.read() cleaned = re.sub(r\"\\.mtk4,\\.mtk9\\.mtk10[^{]*\\{[^}]*\\}\\s*\", \"\", css) with open(path, \"w\") as f: f.write(cleaned) print(f\"Cleaned neon text-shadow in: {path}\") EOF ```"},{"level":3,"title":"Step 3: Apply settings.json","slug":"step-3-apply-settings-json","text":"Open `~/Library/Application Support/Code/User/settings.json` (<kbd>⌘</kbd>+<kbd>Shift</kbd>+<kbd>P</kbd> → **Preferences: Open User Settings (JSON)**) and include: ```json { \"editor.fontSize\": 16, \"editor.lineHeight\": 24, \"editor.minimap.enabled\": false, \"editor.stickyScroll.enabled\": true, \"editor.bracketPairColorization.enabled\": true, \"editor.guides.bracketPairs\": true, \"editor.cursorBlinking\": \"smooth\", \"editor.cursorSmoothCaretAnimation\": \"on\", \"editor.smoothScrolling\": true, \"workbench.colorTheme\": \"Tokyo Night Storm\", \"workbench.iconTheme\": \"material-icon-theme\", \"window.titleBarStyle\": \"custom\", \"window.systemColorTheme\": \"dark\", \"window.autoDetectColorScheme\": false, \"vscode_vibrancy.theme\": \"Tokyo Night Storm\", \"vscode_vibrancy.type\": \"under-window\", \"vscode_vibrancy.opacity\": 0.42, \"vscode_vibrancy.backgroundOverride\": \"#181F31\", \"vscode_vibrancy.preventFlash\": true, \"terminal.integrated.fontSize\": 16, \"terminal.integrated.defaultProfile.osx\": \"zsh\", \"terminal.integrated.cursorStyle\": \"line\", \"terminal.integrated.lineHeight\": 1.25, \"terminal.integrated.cursorBlinking\": true, \"terminal.integrated.gpuAcceleration\": \"off\", \"workbench.colorCustomizations\": { \"terminal.background\": \"#00000000\", \"editorPane.background\": \"#181f3100\", \"editorGroupHeader.tabsBackground\": \"#181f3100\", \"editorGroupHeader.noTabsBackground\": \"#181f3100\", \"breadcrumb.background\": \"#181f3100\", \"editorGutter.background\": \"#181f3100\", \"panel.background\": \"#181f3100\", \"tab.activeBackground\": \"#181f3100\", \"tab.unfocusedActiveBackground\": \"#181f3100\", \"sideBar.background\": \"#181f316b\", \"sideBarTitle.background\": \"#181f316b\", \"activityBar.background\": \"#181f316b\", \"editor.background\": \"#181f316b\", \"tab.inactiveBackground\": \"#181f316b\", \"tab.unfocusedInactiveBackground\": \"#181f316b\", \"editorStickyScroll.background\": \"#181f31bf\", \"editorStickyScrollGutter.background\": \"#181f31bf\", \"sideBarStickyScroll.background\": \"#181f31bf\", \"panelStickyScroll.background\": \"#181f31bf\", \"terminalStickyScroll.background\": \"#181f31bf\", \"minimap.background\": \"#181f31bf\", \"inlineChat.background\": \"#181f31e6\", \"editorWidget.background\": \"#181f31e6\", \"editorHoverWidget.background\": \"#181f31e6\", \"editorSuggestWidget.background\": \"#181f31e6\", \"notifications.background\": \"#181f31e6\", \"notificationCenterHeader.background\": \"#181f31e6\", \"menu.background\": \"#181f31e6\", \"quickInput.background\": \"#181f31e6\", \"editor.lineHighlightBorder\": \"#00000000\" } } ```"},{"level":3,"title":"Step 4: Activate Vibrancy in VS Code","slug":"step-4-activate-vibrancy-in-vs-code","text":"1. If macOS blocks VS Code from patching itself (`EROFS: read-only file system`), clear App Translocation quarantine first: ```bash sudo xattr -dr com.apple.quarantine \"/Applications/Visual Studio Code.app\" ``` 2. Inside VS Code, press <kbd>⌘</kbd>+<kbd>Shift</kbd>+<kbd>P</kbd> (or <kbd>F1</kbd>) → run **`Reload Vibrancy`**. 3. Click **Restart** when prompted."}],"body":"\n# VS Code Tokyo Night Storm Glass Setup (`tokyo-night-storm`)\n\nThis concept explains how the **Tokyo Night Storm** frosted-glass setup works in VS Code on macOS, why certain vibrancy defaults can look off, and how to replicate the exact setup cleanly on any Mac using either a **copy-paste AI prompt** or **step-by-step commands**.\n\nRelated: [macOS Terminal TokyoGlass Setup](./macos-terminal-tokyo-glass.md) · [Second Brain Index](../index.md)\n\n---\n\n## 1. Concept: How VS Code Glass / Vibrancy Works on macOS\n\nUnlike `Terminal.app`, VS Code (an Electron app) uses opaque workbench layers by default. Achieving the **Tokyo Night Storm** glass look requires three layers working together:\n\n1. **Syntax & UI Theme (`enkia.tokyo-night` + `pkief.material-icon-theme`)**\n   - Sets `\"workbench.colorTheme\": \"Tokyo Night Storm\"` and `\"workbench.iconTheme\": \"material-icon-theme\"`.\n2. **Native macOS Vibrancy Injection (`illixion.vscode-vibrancy-continued`)**\n   - Patches VS Code's Electron `BrowserWindow` (`main.js` and `mainImpl.js`) with `visualEffectState: \"active\"`, `frame: false`, and `transparent: true`.\n   - Calls Electron's `window.setVibrancy(\"under-window\")` so macOS WindowServer blurs everything behind the VS Code window.\n   - Injects a root `<style>` tag setting `html { background: rgba(R, G, B, opacity) !important; }` using `\"vscode_vibrancy.backgroundOverride\"` (`#181F31` or `#161A28`) and `\"vscode_vibrancy.opacity\"` (`0.42`–`0.60`).\n3. **Transparent Surface Layering (`workbench.colorCustomizations` & Terminal DOM Renderer)**\n   - Sets `\"terminal.integrated.gpuAcceleration\": \"off\"` so the integrated terminal uses the DOM renderer instead of an opaque WebGL canvas.\n   - Replaces opaque workbench surfaces (`editorPane.background`, `editorGutter.background`, `panel.background`, `terminal.background`, `tab.activeBackground`) with `#181f3100` (transparent) or translucent tiers (`#181f316b` for sidebar/editor, `#181f31bf` for sticky scroll, `#181f31e6` for floating widgets/menus).\n\n### Common Pitfalls & Why It Can Look Weird Out-of-the-Box\n\n- **Neon Glow on Code Tokens**: The built-in `Tokyo Night Storm.css` inside `illixion.vscode-vibrancy-continued` includes a rule adding a blurry neon glow (`text-shadow: 0 0 8px, 0 0 2px #000;`) to `.mtk4, .mtk9.mtk10, .mtk11, ...`. Removing that rule keeps text crisp like `Terminal.app`.\n- **Double-Tinted Panes**: Because `html` already has the base tint, setting `editor.background` to `#181f316b` while `editorGutter.background` is `#181f3100` can make the editor slightly darker than the line-number gutter. Setting `editor.background` to `#181f3100` (with `\"vscode_vibrancy.disableColorCustomizations\": true`) makes the entire editor and gutter share a single, uniform glass layer.\n\n---\n\n## 2. Copy-Paste AI Prompt (Replicate on Any Mac)\n\nPaste this prompt into `agy` (or any AI coding agent) on a new Mac to install and configure the complete setup automatically:\n\n```text\nSet up my VS Code on macOS with the Tokyo Night Storm frosted-glass configuration:\n\n1. Install required VS Code extensions via CLI:\n   - enkia.tokyo-night\n   - illixion.vscode-vibrancy-continued\n   - pkief.material-icon-theme\n\n2. Remove the blurry neon text-shadow rule (.mtk4,.mtk9.mtk10... { text-shadow: 0 0 8px, 0 0 2px #000; }) from ~/.vscode/extensions/illixion.vscode-vibrancy-continued-*/themes/Tokyo Night Storm.css so code tokens stay crisp.\n\n3. Update ~/Library/Application Support/Code/User/settings.json with these theme, vibrancy, editor, and terminal settings (preserving any language-specific settings):\n   - \"workbench.colorTheme\": \"Tokyo Night Storm\"\n   - \"workbench.iconTheme\": \"material-icon-theme\"\n   - \"window.titleBarStyle\": \"custom\"\n   - \"window.systemColorTheme\": \"dark\"\n   - \"window.autoDetectColorScheme\": false\n   - \"vscode_vibrancy.theme\": \"Tokyo Night Storm\"\n   - \"vscode_vibrancy.type\": \"under-window\"\n   - \"vscode_vibrancy.opacity\": 0.42\n   - \"vscode_vibrancy.backgroundOverride\": \"#181F31\"\n   - \"vscode_vibrancy.preventFlash\": true\n   - \"editor.fontSize\": 16\n   - \"editor.lineHeight\": 24\n   - \"editor.minimap.enabled\": false\n   - \"editor.cursorBlinking\": \"smooth\"\n   - \"editor.cursorSmoothCaretAnimation\": \"on\"\n   - \"editor.smoothScrolling\": true\n   - \"terminal.integrated.fontSize\": 16\n   - \"terminal.integrated.lineHeight\": 1.25\n   - \"terminal.integrated.cursorStyle\": \"line\"\n   - \"terminal.integrated.cursorBlinking\": true\n   - \"terminal.integrated.gpuAcceleration\": \"off\"\n   - \"workbench.colorCustomizations\" configured for #181f31 vibrancy transparency.\n\n4. Clear macOS quarantine on \"/Applications/Visual Studio Code.app\" if needed so Vibrancy Continued can patch main.js, then remind me to press Cmd+Shift+P -> \"Reload Vibrancy\" inside VS Code.\n```\n\n---\n\n## 3. Step-by-Step Manual Replication\n\n### Step 1: Install the Extensions\n\nRun in your terminal:\n\n```bash\ncode --install-extension enkia.tokyo-night\ncode --install-extension illixion.vscode-vibrancy-continued\ncode --install-extension pkief.material-icon-theme\n```\n\n### Step 2: Remove the Blurry Neon Glow in Vibrancy's Tokyo Night Storm CSS (Optional but Recommended)\n\nStrip the `text-shadow` glow rule from the extension's theme stylesheet before loading Vibrancy:\n\n```bash\npython3 - <<'EOF'\nimport glob, re\n\nfor path in glob.glob(\"/Users/*/.vscode/extensions/illixion.vscode-vibrancy-continued-*/themes/Tokyo Night Storm.css\"):\n    with open(path, \"r\") as f:\n        css = f.read()\n    cleaned = re.sub(r\"\\.mtk4,\\.mtk9\\.mtk10[^{]*\\{[^}]*\\}\\s*\", \"\", css)\n    with open(path, \"w\") as f:\n        f.write(cleaned)\n    print(f\"Cleaned neon text-shadow in: {path}\")\nEOF\n```\n\n### Step 3: Apply `settings.json`\n\nOpen `~/Library/Application Support/Code/User/settings.json` (<kbd>⌘</kbd>+<kbd>Shift</kbd>+<kbd>P</kbd> → **Preferences: Open User Settings (JSON)**) and include:\n\n```json\n{\n  \"editor.fontSize\": 16,\n  \"editor.lineHeight\": 24,\n  \"editor.minimap.enabled\": false,\n  \"editor.stickyScroll.enabled\": true,\n  \"editor.bracketPairColorization.enabled\": true,\n  \"editor.guides.bracketPairs\": true,\n  \"editor.cursorBlinking\": \"smooth\",\n  \"editor.cursorSmoothCaretAnimation\": \"on\",\n  \"editor.smoothScrolling\": true,\n  \"workbench.colorTheme\": \"Tokyo Night Storm\",\n  \"workbench.iconTheme\": \"material-icon-theme\",\n  \"window.titleBarStyle\": \"custom\",\n  \"window.systemColorTheme\": \"dark\",\n  \"window.autoDetectColorScheme\": false,\n  \"vscode_vibrancy.theme\": \"Tokyo Night Storm\",\n  \"vscode_vibrancy.type\": \"under-window\",\n  \"vscode_vibrancy.opacity\": 0.42,\n  \"vscode_vibrancy.backgroundOverride\": \"#181F31\",\n  \"vscode_vibrancy.preventFlash\": true,\n  \"terminal.integrated.fontSize\": 16,\n  \"terminal.integrated.defaultProfile.osx\": \"zsh\",\n  \"terminal.integrated.cursorStyle\": \"line\",\n  \"terminal.integrated.lineHeight\": 1.25,\n  \"terminal.integrated.cursorBlinking\": true,\n  \"terminal.integrated.gpuAcceleration\": \"off\",\n  \"workbench.colorCustomizations\": {\n    \"terminal.background\": \"#00000000\",\n    \"editorPane.background\": \"#181f3100\",\n    \"editorGroupHeader.tabsBackground\": \"#181f3100\",\n    \"editorGroupHeader.noTabsBackground\": \"#181f3100\",\n    \"breadcrumb.background\": \"#181f3100\",\n    \"editorGutter.background\": \"#181f3100\",\n    \"panel.background\": \"#181f3100\",\n    \"tab.activeBackground\": \"#181f3100\",\n    \"tab.unfocusedActiveBackground\": \"#181f3100\",\n    \"sideBar.background\": \"#181f316b\",\n    \"sideBarTitle.background\": \"#181f316b\",\n    \"activityBar.background\": \"#181f316b\",\n    \"editor.background\": \"#181f316b\",\n    \"tab.inactiveBackground\": \"#181f316b\",\n    \"tab.unfocusedInactiveBackground\": \"#181f316b\",\n    \"editorStickyScroll.background\": \"#181f31bf\",\n    \"editorStickyScrollGutter.background\": \"#181f31bf\",\n    \"sideBarStickyScroll.background\": \"#181f31bf\",\n    \"panelStickyScroll.background\": \"#181f31bf\",\n    \"terminalStickyScroll.background\": \"#181f31bf\",\n    \"minimap.background\": \"#181f31bf\",\n    \"inlineChat.background\": \"#181f31e6\",\n    \"editorWidget.background\": \"#181f31e6\",\n    \"editorHoverWidget.background\": \"#181f31e6\",\n    \"editorSuggestWidget.background\": \"#181f31e6\",\n    \"notifications.background\": \"#181f31e6\",\n    \"notificationCenterHeader.background\": \"#181f31e6\",\n    \"menu.background\": \"#181f31e6\",\n    \"quickInput.background\": \"#181f31e6\",\n    \"editor.lineHighlightBorder\": \"#00000000\"\n  }\n}\n```\n\n### Step 4: Activate Vibrancy in VS Code\n\n1. If macOS blocks VS Code from patching itself (`EROFS: read-only file system`), clear App Translocation quarantine first:\n   ```bash\n   sudo xattr -dr com.apple.quarantine \"/Applications/Visual Studio Code.app\"\n   ```\n2. Inside VS Code, press <kbd>⌘</kbd>+<kbd>Shift</kbd>+<kbd>P</kbd> (or <kbd>F1</kbd>) → run **`Reload Vibrancy`**.\n3. Click **Restart** when prompted.\n","color":"#44403c","backlinks":["dev-tools/agy-cli-permissions.md","dev-tools/index.md","dev-tools/macos-terminal-tokyo-glass.md","index.md","log.md"]},{"id":"inbox.md","title":"Quick Capture Inbox","subtitle":"Unstructured scratchpad for raw ideas & links","type":"inbox","group":null,"description":"Scratchpad for quick thoughts, links, and rough ideas.","updated":"2026-11-07","tags":["inbox","workflow"],"headings":[],"sections":[{"level":1,"title":"Overview","slug":"","text":"# Inbox (Scratchpad) Type anything here without worrying about formatting! Whenever you're ready, just tell your AI: **\"Organize my inbox into notes.\"** --- - Write your first thought or paste a link here..."}],"body":"\n# Inbox (Scratchpad)\n\nType anything here without worrying about formatting!\nWhenever you're ready, just tell your AI: **\"Organize my inbox into notes.\"**\n\n---\n\n- Write your first thought or paste a link here...\n","color":"#78716c","backlinks":["AGENTS.md","README.md","index.md","log.md","notes/how-to-use-this.md"]},{"id":"index.md","title":"My Second Brain","subtitle":"OKF Knowledge Index","type":"index","group":null,"description":"Simple Second Brain powered by Google Open Knowledge Format (OKF), Developer Docs, and an Interactive Mind Map.","updated":"","tags":[],"headings":[{"level":2,"text":"Quick Capture","slug":"quick-capture"},{"level":2,"text":"Dev Tools","slug":"dev-tools"},{"level":2,"text":"Notes","slug":"notes"}],"sections":[{"level":1,"title":"Overview","slug":"","text":"# My Second Brain Welcome! Your Second Brain is organized as a clean **Google Open Knowledge Format (OKF)** tree that powers both your AI assistant and your interactive **Mind Map + Developer Docs**."},{"level":2,"title":"Quick Capture","slug":"quick-capture","text":"- [Inbox (Scratchpad)](./inbox.md) - Dump messy thoughts, links, or rough ideas here."},{"level":2,"title":"Dev Tools","slug":"dev-tools","text":"- [Dev Tools Index](./dev-tools/index.md) - Concept guides, configurations, and copy-paste prompts for replicating local development environments on any Mac. - [macOS Terminal TokyoGlass](./dev-tools/macos-terminal-tokyo-glass.md) - Concept breakdown, step-by-step script, and AI prompt to replicate the `TokyoGlass16_5` frosted-glass macOS Terminal profile. - [VS Code Tokyo Night Glass](./dev-tools/tokyo-night-storm.md) - Concept breakdown, step-by-step setup, and AI prompt to replicate the Tokyo Night Storm frosted-glass theme in VS Code. - [AGY CLI Auto-Approval Setup](./dev-tools/agy-cli-permissions.md) - Turn off manual command approval pauses in the `agy` CLI via allowlists or `settings.json`."},{"level":2,"title":"Notes","slug":"notes","text":"- [How to Use This Second Brain](./notes/how-to-use-this.md) - 1-minute guide to adding notes and exploring your Mind Map. - [What is Google OKF?](./notes/open-knowledge-format.md) - Why this tree structure makes AI agents fast and accurate."}],"body":"\n# My Second Brain\n\nWelcome! Your Second Brain is organized as a clean **Google Open Knowledge Format (OKF)** tree that powers both your AI assistant and your interactive **Mind Map + Developer Docs**.\n\n## Quick Capture\n\n- [Inbox (Scratchpad)](./inbox.md) - Dump messy thoughts, links, or rough ideas here.\n\n## Dev Tools\n\n- [Dev Tools Index](./dev-tools/index.md) - Concept guides, configurations, and copy-paste prompts for replicating local development environments on any Mac.\n- [macOS Terminal TokyoGlass](./dev-tools/macos-terminal-tokyo-glass.md) - Concept breakdown, step-by-step script, and AI prompt to replicate the `TokyoGlass16_5` frosted-glass macOS Terminal profile.\n- [VS Code Tokyo Night Glass](./dev-tools/tokyo-night-storm.md) - Concept breakdown, step-by-step setup, and AI prompt to replicate the Tokyo Night Storm frosted-glass theme in VS Code.\n- [AGY CLI Auto-Approval Setup](./dev-tools/agy-cli-permissions.md) - Turn off manual command approval pauses in the `agy` CLI via allowlists or `settings.json`.\n\n## Notes\n\n- [How to Use This Second Brain](./notes/how-to-use-this.md) - 1-minute guide to adding notes and exploring your Mind Map.\n- [What is Google OKF?](./notes/open-knowledge-format.md) - Why this tree structure makes AI agents fast and accurate.\n","color":"#1c1917","backlinks":["AGENTS.md","README.md","dev-tools/macos-terminal-tokyo-glass.md","dev-tools/tokyo-night-storm.md","log.md","notes/how-to-use-this.md","notes/open-knowledge-format.md"]},{"id":"log.md","title":"Change Log (log.md)","subtitle":"LOG · log.md","type":"log","group":null,"description":"LOG · log.md","updated":"","tags":[],"headings":[{" t/section search engine in [`scripts/export-graph.mjs`](./scripts/export-graph.mjs). - **[ui & syntax]** Added `subtitle` frontmatter, 2-line Title + Subheading Mind Map cards, rich floating hover tooltips, Tokyo Night Storm syntax highlighting with line numbers, and [`dev-tools/agy-cli-permissions.md`](./dev-tools/agy-cli-permissions.md). - **[themes & typography]** Grouped Tokyo Night setups ([`dev-tools/macos-terminal-tokyo-glass.md`](./dev-tools/macos-terminal-tokyo-glass.md) and [`dev-tools/tokyo-night-storm.md`](./dev-tools/tokyo-night-storm.md)) under a collapsible `Themes` subgroup in `Dev Tools`, increased default typography scale, and added branch-coded architectural Mind Map palettes. - **[ux-layout]** Streamlined panel toggles to VS Code-style sidebar layout icons (`btn-toggle-sidebar` and `btn-toggle-viz`), eliminated redundant floating edge expand tabs, and fixed icon alignment in [`scripts/export-graph.mjs`](./scripts/export-graph.mjs). - **[mindmap-scale]** Removed heading section nodes from Mind Map trees (`docToTreeNode`) to focus exclusively on high-level Concepts, Pages, and Collections for horizontal scalability. - **[typography]** Set Vercel Geist as the default typography standard, replaced serif/mono options with industry-standard doc fonts (Geist, Inter, and Plus Jakarta Sans), and synchronized Canvas Mind Map rendering. - **[ux-refinements]** Sorted tags alphabetically (A-Z), removed font selector controls to standardize on Geist, enlarged topbar search button with vibrant query `<mark>` highlighting, and refined Mind Map color schemes across Paper, Light, and Dark modes. - **[spotlight-canvas]** Expanded Spotlight search modal to a spacious 760px command palette with backdrop blur and enter cues, and eliminated stark white card backgrounds on the Mind Map canvas in favor of natural harmonized linen/slate surface tones. - **[topbar-center]** Centered the search bar in the header with a highlighted focus border, active accent iconography, and enhanced hover micro-interactions in [`scripts/export-graph.mjs`](./scripts/export-graph.mjs)."}],"body":"# Change Log (`log.md`)\n\n*(Maintained automatically by AI — you never need to edit this file manually.)*\n\n## 2026-11-08\n\n- **[slide-over]** Clicking a node, sidebar item, or search result in full-screen Graph / Mind Map now opens the note in a slide-over panel (Esc / Close / Split view) instead of leaving full-screen; the address bar now tracks the active view (`?view=`) in [`scripts/export-graph.mjs`](./scripts/export-graph.mjs).\n- **[graph-url]** Added dedicated shareable `/graph/` and `/mindmap/` pages plus `?view=` deep links in [`scripts/export-graph.mjs`](./scripts/export-graph.mjs); fixed README live links and removed the unchosen license section.\n- **[readme & pages]** Created comprehensive architecture [`README.md`](./README.md), added automated GitHub Pages CI/CD workflow ([`.github/workflows/deploy.yml`](./.github/workflows/deploy.yml)), and configured repository for public GitHub Pages deployment.\n\n## 2026-11-07\n\n- **[simplify]** Simplified workspace to a flat layout: [`index.md`](./index.md), [`inbox.md`](./inbox.md), and a single `notes/` folder ([`notes/how-to-use-this.md`](./notes/how-to-use-this.md)).\n- **[add]** Added `dev-tools/` concept notes ([`dev-tools/macos-terminal-tokyo-glass.md`](./dev-tools/macos-terminal-tokyo-glass.md) and [`dev-tools/tokyo-night-storm.md`](./dev-tools/tokyo-night-storm.md)) with step-by-step guides and reusable AI prompts.\n- **[mindmap]** Removed Foam VS Code extension clutter, added [`notes/open-knowledge-format.md`](./notes/open-knowledge-format.md), and switched viewer to a collapsible **OKF Mind Map + Developer Docs** portal.\n- **[tags & search]** Added OKF `tags` metadata across all notes, collapsible tree sidebar UI, tag filtering, and a `Cmd+K` Spotlight full-text/section search engine in [`scripts/export-graph.mjs`](./scripts/export-graph.mjs).\n- **[ui & syntax]** Added `subtitle` frontmatter, 2-line Title + Subheading Mind Map cards, rich floating hover tooltips, Tokyo Night Storm syntax highlighting with line numbers, and [`dev-tools/agy-cli-permissions.md`](./dev-tools/agy-cli-permissions.md).\n- **[themes & typography]** Grouped Tokyo Night setups ([`dev-tools/macos-terminal-tokyo-glass.md`](./dev-tools/macos-terminal-tokyo-glass.md) and [`dev-tools/tokyo-night-storm.md`](./dev-tools/tokyo-night-storm.md)) under a collapsible `Themes` subgroup in `Dev Tools`, increased default typography scale, and added branch-coded architectural Mind Map palettes.\n- **[ux-layout]** Streamlined panel toggles to VS Code-style sidebar layout icons (`btn-toggle-sidebar` and `btn-toggle-viz`), eliminated redundant floating edge expand tabs, and fixed icon alignment in [`scripts/export-graph.mjs`](./scripts/export-graph.mjs).\n- **[mindmap-scale]** Removed heading section nodes from Mind Map trees (`docToTreeNode`) to focus exclusively on high-level Concepts, Pages, and Collections for horizontal scalability.\n- **[typography]** Set Vercel Geist as the default typography standard, replaced serif/mono options with industry-standard doc fonts (Geist, Inter, and Plus Jakarta Sans), and synchronized Canvas Mind Map rendering.\n- **[ux-refinements]** Sorted tags alphabetically (A-Z), removed font selector controls to standardize on Geist, enlarged topbar search button with vibrant query `<mark>` highlighting, and refined Mind Map color schemes across Paper, Light, and Dark modes.\n- **[spotlight-canvas]** Expanded Spotlight search modal to a spacious 760px command palette with backdrop blur and enter cues, and eliminated stark white card backgrounds on the Mind Map canvas in favor of natural harmonized linen/slate surface tones.\n- **[topbar-center]** Centered the search bar in the header with a highlighted focus border, active accent iconography, and enhanced hover micro-interactions in [`scripts/export-graph.mjs`](./scripts/export-graph.mjs).\n","color":"#78716c","backlinks":["AGENTS.md","README.md","notes/open-knowledge-format.md"]},{"id":"notes/how-to-use-this.md","title":"Second Brain Quickstart","subtitle":"How to capture notes, search, and explore the Mind Map","type":"note","group":null,"description":"A 1-minute plain-English guide to using your Second Brain with AI, Developer Docs, and the interactive Mind Map.","updated":"2026-11-07","tags":["guide","workflow","mind-map"],"headings":[{"level":2,"text":"1. Let the AI Do the Work (Easiest)","slug":"1-let-the-ai-do-the-work-easiest"},{"level":2,"text":"2. Browse Your Developer Docs & Mind Map","slug":"2-browse-your-developer-docs-mind-map"},{"level":2,"text":"3. Write Notes Yourself","slug":"3-write-notes-yourself"}],"sections":[{"level":1,"title":"Overview","slug":"","text":"# How to Use This Second Brain You don't need any complicated VS Code extensions or rules. Everything here is plain Markdown organized as a clean tree."},{"level":2,"title":"1. Let the AI Do the Work (Easiest)","slug":"1-let-the-ai-do-the-work-easiest","text":"Just ask me in chat: - *\"Add a note about [topic]\"* - *\"Summarize this article/code into a note\"* - *\"Organize my [Inbox](../inbox.md) into clean notes\"* I automatically create the note in `notes/`, add the [Google OKF](./open-knowledge-format.md) header, link it inside [`index.md`](../index.md), and update your Mind Map."},{"level":2,"title":"2. Browse Your Developer Docs & Mind Map","slug":"2-browse-your-developer-docs-mind-map","text":"Run this command anytime (or ask me to open it): ```bash /usr/local/bin/node scripts/export-graph.mjs && open /tmp/okf-foam-graph.html ``` - **Left Sidebar:** Search and jump to any note like real developer documentation. - **Center Docs Pane:** Read your notes with clickable links between pages. - **Interactive Mind Map:** Expand or collapse (`+` / `-`) branches from `My Second Brain` → `Sections` → `Notes` → `Headings inside each note`."},{"level":2,"title":"3. Write Notes Yourself","slug":"3-write-notes-yourself","text":"If you want to write by hand, just type in [`inbox.md`](../inbox.md) or create a `.md` file inside `notes/`."}],"body":"\n# How to Use This Second Brain\n\nYou don't need any complicated VS Code extensions or rules. Everything here is plain Markdown organized as a clean tree.\n\n## 1. Let the AI Do the Work (Easiest)\n\nJust ask me in chat:\n- *\"Add a note about [topic]\"*\n- *\"Summarize this article/code into a note\"*\n- *\"Organize my [Inbox](../inbox.md) into clean notes\"*\n\nI automatically create the note in `notes/`, add the [Google OKF](./open-knowledge-format.md) header, link it inside [`index.md`](../index.md), and update your Mind Map.\n\n## 2. Browse Your Developer Docs & Mind Map\n\nRun this command anytime (or ask me to open it):\n```bash\n/usr/local/bin/node scripts/export-graph.mjs && open /tmp/okf-foam-graph.html\n```\n- **Left Sidebar:** Search and jump to any note like real developer documentation.\n- **Center Docs Pane:** Read your notes with clickable links between pages.\n- **Interactive Mind Map:** Expand or collapse (`+` / `-`) branches from `My Second Brain` → `Sections` → `Notes` → `Headings inside each note`.\n\n## 3. Write Notes Yourself\n\nIf you want to write by hand, just type in [`inbox.md`](../inbox.md) or create a `.md` file inside `notes/`.\n","color":"#44403c","backlinks":["index.md","log.md","notes/open-knowledge-format.md"]},{"id":"notes/open-knowledge-format.md","title":"Google Open Knowledge Format","subtitle":"Progressive disclosure tree for AI agents (OKF v0.2)","type":"concept","group":null,"description":"How Google's Open Knowledge Format structures Markdown files as a progressive tree for AI agents and Mind Maps.","updated":"2026-11-07","tags":["okf","ai-agents","mind-map"],"headings":[{"level":2,"text":"Progressive Disclosure Tree","slug":"progressive-disclosure-tree"},{"level":2,"text":"Why It Scales","slug":"why-it-scales"}],"sections":[{"level":1,"title":"Overview","slug":"","text":"# What is Google OKF? **Google's Open Knowledge Format (OKF v0.2)** is a simple standard for organizing Markdown files so AI agents never get lost."},{"level":2,"title":"Progressive Disclosure Tree","slug":"progressive-disclosure-tree","text":"Instead of a messy spiderweb of links, OKF organizes knowledge like a **Mind Map tree**: - **Root ([`index.md`](../index.md)):** The table of contents listing your topics and notes with one-sentence summaries. - **Typed Notes (`notes/*.md`):** Each note has a small YAML header (`type`, `title`, `description`, `updated`) and clean `##` headings. - **Change Log ([`log.md`](../log.md)):** Automatic history maintained by your AI agent."},{"level":2,"title":"Why It Scales","slug":"why-it-scales","text":"- **For AI Agents:** The AI reads [`index.md`](../index.md) first and drills down only into the branch it needs, saving tokens and avoiding confusion. - **For Humans:** The /exact same tree renders as a collapsible **Mind Map** and clean **Developer Docs** (see [How to Use This Second Brain](./how-to-use-this.md))."}],"body":"\n# What is Google OKF?\n\n**Google's Open Knowledge Format (OKF v0.2)** is a simple standard for organizing Markdown files so AI agents never get lost.\n\n## Progressive Disclosure Tree\n\nInstead of a messy spiderweb of links, OKF organizes knowledge like a **Mind Map tree**:\n- **Root ([`index.md`](../index.md)):** The table of contents listing your topics and notes with one-sentence summaries.\n- **Typed Notes (`notes/*.md`):** Each note has a small YAML header (`type`, `title`, `description`, `updated`) and clean `##` headings.\n- **Change Log ([`log.md`](../log.md)):** Automatic history maintained by your AI agent.\n\n## Why It Scales\n\n- **For AI Agents:** The AI reads [`index.md`](../index.md) first and drills down only into the branch it needs, saving tokens and avoiding confusion.\n- **For Humans:** The /exact same tree renders as a collapsible **Mind Map** and clean **Developer Docs** (see [How to Use This Second Brain](./how-to-use-this.md)).\n","color":"#44403c","backlinks":["index.md","log.md","notes/how-to-use-this.md"]}],"links":[{"source":"AGENTS.md","target":"index.md"},{"source":"AGENTS.md","target":"inbox.md"},{"source":"AGENTS.md","target":"log.md"},{"source":"README.md","target":"inbox.md"},{"source":"README.md","target":"AGENTS.md"},{"source":"README.md","target":"index.md"},{"source":"README.md","target":"log.md"},{"source":"dev-tools/agy-cli-permissions.md","target":"dev-tools/index.md"},{"source":"dev-tools/agy-cli-permissions.md","target":"dev-tools/macos-terminal-tokyo-glass.md"},{"source":"dev-tools/agy-cli-permissions.md","target":"dev-tools/tokyo-night-storm.md"},{"source":"dev-tools/index.md","target":"dev-tools/macos-terminal-tokyo-glass.md"},{"source":"dev-tools/index.md","target":"dev-tools/tokyo-night-storm.md"},{"source":"dev-tools/index.md","target":"dev-tools/agy-cli-permissions.md"},{"source":"dev-tools/macos-terminal-tokyo-glass.md","target":"dev-tools/tokyo-night-storm.md"},{"source":"dev-tools/macos-terminal-tokyo-glass.md","target":"index.md"},{"source":"dev-tools/tokyo-night-storm.md","target":"dev-tools/macos-terminal-tokyo-glass.md"},{"source":"dev-tools/tokyo-night-storm.md","target":"index.md"},{"source":"index.md","target":"inbox.md"},{"source":"index.md","target":"dev-tools/index.md"},{"source":"index.md","target":"dev-tools/macos-terminal-tokyo-glass.md"},{"source":"index.md","target":"dev-tools/tokyo-night-storm.md"},{"source":"index.md","target":"dev-tools/agy-cli-permissions.md"},{"source":"index.md","target":"notes/how-to-use-this.md"},{"source":"index.md","target":"notes/open-knowledge-format.md"},{"source":"log.md","target":"README.md"},{"source":"log.md","target":"index.md"},{"source":"log.md","target":"inbox.md"},{"source":"log.md","target":"notes/how-to-use-this.md"},{"source":"log.md","target":"dev-tools/macos-terminal-tokyo-glass.md"},{"source":"log.md","target":"dev-tools/tokyo-night-storm.md"},{"source":"log.md","target"
