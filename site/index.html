<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Second Brain — Developer Docs, Mind Map & Search</title>
<style>
  :root {
    --bg-primary: #16161e;
    --bg-secondary: #1a1b26;
    --bg-tertiary: #24283b;
    --bg-code: #13141c;
    --border: #292e42;
    --border-subtle: #1f2335;
    --text-primary: #c0caf5;
    --text-bright: #f7f8fa;
    --text-secondary: #9aa5ce;
    --text-muted: #565f89;
    --accent: #7aa2f7;
    --accent-subtle: rgba(122, 162, 247, 0.15);
    --tag-bg: rgba(187, 154, 247, 0.14);
    --tag-text: #bb9af7;
    --tag-border: rgba(187, 154, 247, 0.32);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Top Header */
  header {
    height: 54px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    flex-shrink: 0;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    font-size: 15px;
    color: var(--text-bright);
    cursor: pointer;
  }
  .brand-badge {
    font-size: 11px;
    background: var(--accent-subtle);
    color: var(--accent);
    border: 1px solid rgba(122, 162, 247, 0.35);
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 500;
  }
  .header-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .btn {
    background: var(--bg-tertiary);
    color: var(--text-secondary);
    border: 1px solid var(--border);
    padding: 6px 11px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: 0.15s;
  }
  .btn:hover {
    color: var(--text-bright);
    border-color: #414868;
  }
  .btn.active {
    border-color: var(--accent);
    background: var(--accent-subtle);
    color: var(--accent);
  }

  .workspace {
    flex: 1;
    display: flex;
    overflow: hidden;
    min-height: 0;
  }

  /* Left Navigation Sidebar */
  aside.sidebar {
    width: 290px;
    background: var(--bg-secondary);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .search-trigger-wrap {
    padding: 12px 12px 8px;
  }
  .search-trigger {
    width: 100%;
    background: var(--bg-primary);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 8px 11px;
    border-radius: 8px;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    transition: 0.15s;
  }
  .search-trigger:hover {
    border-color: var(--accent);
    color: var(--text-bright);
  }
  .search-kbd {
    font-size: 11px;
    font-family: ui-monospace, SFMono-Regular, monospace;
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    padding: 1px 6px;
    border-radius: 4px;
    color: var(--text-secondary);
  }

  .sidebar-tags {
    padding: 4px 12px 10px;
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }
  .tag-chip {
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 999px;
    background: var(--bg-tertiary);
    color: var(--text-secondary);
    border: 1px solid transparent;
    cursor: pointer;
    transition: 0.15s;
    user-select: none;
  }
  .tag-chip:hover {
    color: var(--text-bright);
    border-color: var(--border);
  }
  .tag-chip.active {
    background: var(--tag-bg);
    color: var(--tag-text);
    border-color: var(--tag-border);
    font-weight: 500;
  }

  .nav-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px 10px 24px;
  }
  .nav-folder { margin-bottom: 8px; }
  .nav-folder-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 8px;
    border-radius: 6px;
    cursor: pointer;
    user-select: none;
    color: var(--text-bright);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .nav-folder-header:hover { background: rgba(255, 255, 255, 0.04); }
  .folder-left { display: flex; align-items: center; gap: 7px; }
  .folder-chevron {
    font-size: 10px;
    color: var(--text-muted);
    transition: transform 0.15s ease;
    display: inline-block;
    width: 12px;
    text-align: center;
  }
  .nav-folder.collapsed .folder-chevron { transform: rotate(-90deg); }
  .folder-count {
    font-size: 10.5px;
    color: var(--text-secondary);
    background: var(--bg-tertiary);
    padding: 1px 6px;
    border-radius: 999px;
    font-weight: 500;
  }
  .nav-folder-items {
    margin-top: 3px;
    margin-left: 13px;
    padding-left: 10px;
    border-left: 1px solid var(--border);
  }
  .nav-folder.collapsed .nav-folder-items { display: none; }
  .nav-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 7px 10px;
    border-radius: 6px;
    cursor: pointer;
    user-select: none;
    margin-bottom: 3px;
    position: relative;
    transition: 0.12s;
  }
  .nav-item-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .nav-item-sub {
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .nav-item:hover { background: rgba(255, 255, 255, 0.04); }
  .nav-item:hover .nav-item-title { color: var(--text-bright); }
  .nav-item.active {
    background: var(--accent-subtle);
  }
  .nav-item.active .nav-item-title {
    color: var(--accent);
    font-weight: 600;
  }
  .nav-item.active .nav-item-sub {
    color: rgba(122, 162, 247, 0.8);
  }
  .nav-item.active::before {
    content: "";
    position: absolute;
    left: -11px;
    top: 6px;
    bottom: 6px;
    width: 2px;
    background: var(--accent);
    border-radius: 2px;
  }
  .nav-subitems {
    margin: 2px 0 6px 12px;
    padding-left: 10px;
    border-left: 1px solid var(--border);
  }
  .nav-subitem {
    font-size: 11.5px;
    color: var(--text-muted);
    padding: 4px 8px;
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .nav-subitem:hover {
    color: var(--accent);
    background: rgba(122, 162, 247, 0.08);
  }
  .nav-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* Center Document Reader */
  main.doc-pane {
    flex: 1;
    overflow-y: auto;
    padding: 36px 48px 64px;
    min-width: 0;
    scroll-behavior: smooth;
  }
  .doc-layout {
    display: flex;
    gap: 36px;
    max-width: 1040px;
    margin: 0 auto;
    align-items: flex-start;
  }
  .doc-inner {
    flex: 1;
    min-width: 0;
    max-width: 760px;
  }
  .doc-toc {
    width: 210px;
    position: sticky;
    top: 0;
    flex-shrink: 0;
    border-left: 1px solid var(--border);
    padding-left: 16px;
    display: none;
  }
  @media (min-width: 1280px) {
    .doc-toc.visible { display: block; }
  }
  .toc-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }
  .toc-link {
    display: block;
    font-size: 12.5px;
    color: var(--text-secondary);
    text-decoration: none;
    padding: 4px 0;
    line-height: 1.35;
    cursor: pointer;
  }
  .toc-link:hover { color: var(--accent); }
  .toc-link.toc-h3 { padding-left: 12px; font-size: 12px; }

  /* Document Hero Banner */
  .doc-hero {
    margin-bottom: 26px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .doc-meta-bar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .type-pill {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
  }
  .doc-tag-pill {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--tag-bg);
    color: var(--tag-text);
    border: 1px solid var(--tag-border);
    cursor: pointer;
  }
  .doc-tag-pill:hover { background: rgba(187, 154, 247, 0.25); }
  .doc-path {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--text-muted);
  }
  .doc-hero-title {
    font-size: 30px;
    font-weight: 700;
    color: var(--text-bright);
    line-height: 1.25;
    margin-bottom: 6px;
  }
  .doc-hero-subtitle {
    font-size: 16px;
    font-weight: 500;
    color: var(--accent);
    margin-bottom: 12px;
  }
  .doc-desc {
    background: rgba(26, 27, 38, 0.85);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    padding: 10px 14px;
    border-radius: 0 8px 8px 0;
    color: var(--text-secondary);
    font-size: 13.5px;
    line-height: 1.55;
  }

  /* Rich Developer Docs Markdown Styling */
  .md-body {
    line-height: 1.72;
    font-size: 15px;
    color: var(--text-primary);
  }
  .md-body h1 { display: none; } /* Rendered in Hero Header */
  .md-body h2 {
    font-size: 20px;
    font-weight: 600;
    color: var(--text-bright);
    margin: 30px 0 12px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
    scroll-margin-top: 20px;
  }
  .md-body h3 {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-bright);
    margin: 22px 0 10px;
    scroll-margin-top: 20px;
  }
  .md-body p { margin-bottom: 14px; }
  .md-body strong { color: var(--text-bright); font-weight: 600; }
  .md-body ul, .md-body ol { margin: 0 0 16px 24px; }
  .md-body li { margin-bottom: 6px; }
  .md-body li > ul, .md-body li > ol { margin-top: 6px; margin-bottom: 8px; }
  .md-body code {
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
    background: var(--bg-tertiary);
    color: #7dcfff;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .md-body kbd {
    display: inline-block;
    padding: 2px 6px;
    font-size: 11.5px;
    font-family: ui-monospace, SFMono-Regular, monospace;
    line-height: 1.2;
    color: var(--text-bright);
    background-color: var(--bg-tertiary);
    border: 1px solid #414868;
    border-bottom-width: 2px;
    border-radius: 4px;
  }

  /* Tokyo Night Storm Code Blocks & Syntax Highlighting */
  .code-block-wrap {
    position: relative;
    background: var(--bg-code);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 18px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
  }
  .code-block-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 14px;
    background: #1a1b26;
    border-bottom: 1px solid var(--border);
    font-size: 11.5px;
    font-family: ui-monospace, SFMono-Regular, monospace;
    color: var(--text-secondary);
  }
  .code-window-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .window-dots {
    display: flex;
    gap: 6px;
  }
  .w-dot { width: 10px; height: 10px; border-radius: 50%; }
  .lang-badge {
    text-transform: uppercase;
    font-weight: 600;
    font-size: 10.5px;
    letter-spacing: 0.06em;
    color: #7aa2f7;
    background: rgba(122, 162, 247, 0.12);
    padding: 2px 7px;
    border-radius: 4px;
  }
  .copy-btn {
    background: var(--bg-tertiary);
    color: var(--text-primary);
    border: 1px solid #414868;
    border-radius: 5px;
    padding: 3px 10px;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    transition: 0.15s;
  }
  .copy-btn:hover { border-color: var(--accent); color: var(--text-bright); background: var(--accent-subtle); }
  .code-table {
    width: 100%;
    border-collapse: collapse;
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px;
    line-height: 1.6;
  }
  .code-ln {
    width: 40px;
    text-align: right;
    padding: 0 12px 0 10px;
    color: #3b4261;
    user-select: none;
    vertical-align: top;
    border-right: 1px solid #1f2335;
  }
  .code-line {
    padding: 0 16px;
    white-space: pre;
    color: #c0caf5;
  }
  .code-scroll {
    padding: 12px 0;
    overflow-x: auto;
  }

  /* Tokyo Night Storm Syntax Token Colors */
  .tok-com { color: #565f89; font-style: italic; }
  .tok-str { color: #9ece6a; }
  .tok-key { color: #7dcfff; }
  .tok-kw  { color: #bb9af7; font-weight: 500; }
  .tok-cmd { color: #7aa2f7; font-weight: 500; }
  .tok-num { color: #ff9e64; }
  .tok-var { color: #e0af68; }

  .md-body hr { border: none; border-top: 1px solid var(--border); margin: 26px 0; }
  .md-body table.md-table { width: 100%; border-collapse: collapse; margin-bottom: 18px; font-size: 14px; }
  .md-body table.md-table th, .md-body table.md-table td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
  .md-body table.md-table th { background: var(--bg-secondary); color: var(--text-bright); font-weight: 600; }
  .md-body table.md-table tr:nth-child(even) td { background: rgba(26, 27, 38, 0.5); }
  .color-swatch {
    display: inline-block;
    width: 11px;
    height: 11px;
    border-radius: 3px;
    border: 1px solid rgba(255,255,255,0.25);
    vertical-align: middle;
    margin-right: 5px;
  }
  .md-body a.internal-link {
    color: var(--accent);
    text-decoration: none;
    background: var(--accent-subtle);
    padding: 1px 6px;
    border-radius: 4px;
    font-weight: 500;
    transition: 0.15s;
  }
  .md-body a.internal-link:hover {
    background: rgba(122, 162, 247, 0.28);
    text-decoration: underline;
  }
  .md-body a.external-link { color: var(--accent); }

  .backlinks-box {
    margin-top: 44px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }
  .backlinks-title {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-secondary);
    margin-bottom: 10px;
  }
  .backlink-cards { display: flex; flex-wrap: wrap; gap: 8px; }
  .backlink-card {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: 0.15s;
  }
  .backlink-card:hover { border-color: var(--accent); color: var(--accent); }

  /* Right Visualizer Panel */
  aside.viz-pane {
    width: 560px;
    background: radial-gradient(circle at center, #1a1b26 0%, #101016 100%);
    border-left: 1px solid var(--border);
    position: relative;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow: hidden;
  }
  aside.viz-pane.expanded { flex: 1; width: auto; border-left: none; }
  aside.viz-pane.hidden { display: none; }
  .viz-toolbar {
    position: absolute;
    top: 14px;
    left: 14px;
    right: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
    z-index: 5;
    gap: 8px;
  }
  .viz-hint {
    background: rgba(26, 27, 38, 0.92);
    border: 1px solid var(--border);
    padding: 6px 11px;
    border-radius: 6px;
    font-size: 11.5px;
    color: var(--text-secondary);
    backdrop-filter: blur(8px);
  }
  .viz-controls { display: flex; gap: 5px; pointer-events: auto; flex-wrap: wrap; }
  canvas#viz-canvas { width: 100%; height: 100%; display: block; cursor: grab; }
  canvas#viz-canvas:active { cursor: grabbing; }

  /* Rich Floating Concept Tooltip */
  .node-tooltip {
    position: absolute;
    pointer-events: none;
    display: none;
    width: 300px;
    background: rgba(22, 22, 30, 0.96);
    border: 1px solid #414868;
    border-radius: 10px;
    padding: 12px 14px;
    z-index: 30;
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(10px);
  }
  .nt-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 2px 6px;
    border-radius: 4px;
    margin-bottom: 6px;
    background: rgba(122, 162, 247, 0.15);
  }
  .nt-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-bright);
    margin-bottom: 2px;
  }
  .nt-sub {
    font-size: 12px;
    font-weight: 500;
    color: #7dcfff;
    margin-bottom: 8px;
  }
  .nt-desc {
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.45;
    margin-bottom: 8px;
  }
  .nt-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .nt-tag {
    font-size: 10.5px;
    background: var(--tag-bg);
    color: var(--tag-text);
    padding: 1px 6px;
    border-radius: 999px;
  }

  /* Cmd+K Spotlight Search Modal */
  .search-modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(10, 11, 16, 0.76);
    backdrop-filter: blur(6px);
    z-index: 100;
    display: none;
    align-items: flex-start;
    justify-content: center;
    padding-top: 10vh;
  }
  .search-modal-backdrop.open { display: flex; }
  .search-modal {
    width: 660px;
    max-width: 92vw;
    max-height: 76vh;
    background: var(--bg-secondary);
    border: 1px solid #414868;
    border-radius: 12px;
    box-shadow: 0 22px 60px rgba(0, 0, 0, 0.65);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .search-modal-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }
  .search-modal-header input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text-bright);
    font-size: 16px;
    outline: none;
  }
  .search-modal-results { flex: 1; overflow-y: auto; padding: 10px; }
  .search-result-item {
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 4px;
    border: 1px solid transparent;
  }
  .search-result-item:hover, .search-result-item.selected {
    background: var(--accent-subtle);
    border-color: rgba(122, 162, 247, 0.35);
  }
  .sr-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .sr-breadcrumb { font-size: 13.5px; font-weight: 600; color: var(--text-bright); }
  .sr-breadcrumb span.sr-sec { color: var(--accent); font-weight: 500; }
  .sr-snippet { font-size: 12.5px; color: var(--text-secondary); line-height: 1.45; }
  .sr-snippet mark, .sr-breadcrumb mark {
    background: rgba(224, 175, 104, 0.3);
    color: #e0af68;
    padding: 0 3px;
    border-radius: 3px;
  }
  .search-modal-footer {
    padding: 8px 16px;
    border-top: 1px solid var(--border);
    background: var(--bg-primary);
    font-size: 11.5px;
    color: var(--text-muted);
    display: flex;
    justify-content: space-between;
  }
</style>
</head>
<body>

<header>
  <div class="brand" onclick="openDoc('index.md')">
    <span>🧠 Second Brain</span>
    <span class="brand-badge">OKF v0.2 Developer Docs</span>
  </div>
  <div class="header-actions">
    <button class="btn" onclick="openSearchModal()">🔍 Search <span class="search-kbd">⌘K</span></button>

const data = {"nodes":[{"id":"AGENTS.md","title":"AI Agent Guidelines","subtitle":"Automatic OKF indexing, tagging, and Mind Map rules","type":"guideline","description":"Instructions for AI agents to handle all OKF formatting, indexing, and Mind Map rebuilds automatically.","updated":"2026-11-07","tags":["okf","ai-agents","workflow"],"headings":[{"level":2,"text":"1. Folder Structure (Keep It Flat)","slug":"1-folder-structure-keep-it-flat"},{"level":2,"text":"2. OKF Frontmatter (Handled by AI)","slug":"2-okf-frontmatter-handled-by-ai"},{"level":2,"text":"3. Maintenance Checklist on Every Write","slug":"3-maintenance-checklist-on-every-write"}],"sections":[{"level":1,"title":"Overview","slug":"","text":"# AI Agent Guidelines (`AGENTS.md`) This is a **simple, low-friction Second Brain** built on **Google's Open Knowledge Format (OKF v0.2)** with a **Developer Docs + Interactive Mind Map** viewer. **Core rule:** Keep things effortless for the human. The AI handles all OKF metadata, indexing, logging, and Mind Map regeneration automatically."},{"level":2,"title":"1. Folder Structure (Keep It Flat)","slug":"1-folder-structure-keep-it-flat","text":"- [`index.md`](./index.md) — Root table of contents (`okf_version: \"0.2\"`). - [`inbox.md`](./inbox.md) — User's quick scratchpad (`type: inbox`). - `notes/` — Single folder for all notes (`type: note`, `type: concept`, `type: reference`, etc.). Do not create extra subfolders unless the user asks for them. - [`log.md`](./log.md) — Reserved OKF changelog updated automatically by the AI."},{"level":2,"title":"2. OKF Frontmatter (Handled by AI)","slug":"2-okf-frontmatter-handled-by-ai","text":"Every note in `notes/` starts with simple YAML frontmatter: ```yaml --- type: note title: \"Note Title\" description: \"One-sentence summary.\" updated: YYYY-MM-DD --- ```"},{"level":2,"title":"3. Maintenance Checklist on Every Write","slug":"3-maintenance-checklist-on-every-write","text":"Whenever you create or update a note: 1. Ensure valid YAML frontmatter (`type`, `title`, `description`, `updated`). 2. Add or update the link in [`index.md`](./index.md) under `## Notes`. 3. Append a 1-line entry in [`log.md`](./log.md). 4. Run `/usr/local/bin/node scripts/validate-okf.mjs` and `/usr/local/bin/node scripts/export-graph.mjs` to verify OKF compliance and update the Mind Map portal."}],"body":"\n# AI Agent Guidelines (`AGENTS.md`)\n\nThis is a **simple, low-friction Second Brain** built on **Google's Open Knowledge Format (OKF v0.2)** with a **Developer Docs + Interactive Mind Map** viewer.\n**Core rule:** Keep things effortless for the human. The AI handles all OKF metadata, indexing, logging, and Mind Map regeneration automatically.\n\n## 1. Folder Structure (Keep It Flat)\n\n- [`index.md`](./index.md) — Root table of contents (`okf_version: \"0.2\"`).\n- [`inbox.md`](./inbox.md) — User's quick scratchpad (`type: inbox`).\n- `notes/` — Single folder for all notes (`type: note`, `type: concept`, `type: reference`, etc.). Do not create extra subfolders unless the user asks for them.\n- [`log.md`](./log.md) — Reserved OKF changelog updated automatically by the AI.\n\n## 2. OKF Frontmatter (Handled by AI)\n\nEvery note in `notes/` starts with simple YAML frontmatter:\n```yaml\n---\ntype: note\ntitle: \"Note Title\"\ndescription: \"One-sentence summary.\"\nupdated: YYYY-MM-DD\n---\n```\n\n## 3. Maintenance Checklist on Every Write\n\nWhenever you create or update a note:\n1. Ensure valid YAML frontmatter (`type`, `title`, `description`, `updated`).\n2. Add or update the link in [`index.md`](./index.md) under `## Notes`.\n3. Append a 1-line entry in [`log.md`](./log.md).\n4. Run `/usr/local/bin/node scripts/validate-okf.mjs` and `/usr/local/bin/node scripts/export-graph.mjs` to verify OKF compliance and update the Mind Map portal.\n","color":"#7DCFFF","backlinks":[]},{"id":"dev-tools/agy-cli-permissions.md","title":"AGY CLI Auto-Approval Setup","subtitle":"Turn off manual command approval pauses","type":"concept","description":"How to configure ~/.gemini/antigravity-cli/settings.json and command allowlists so the agy CLI runs without manual approval pauses.","updated":"2026-11-07","tags":["agy","cli","workflow","permissions"],"headings":[{"level":2,"text":"Option 1: Interactive Prefix Allowlist","slug":"option-1-interactive-prefix-allowlist"},{"level":2,"text":"Option 2: Global Wildcard in settings.json","slug":"option-2-global-wildcard-in-settings-json"},{"level":2,"text":"Option 3: One-Line Terminal Command to Apply It","slug":"option-3-one-line-terminal-command-to-apply-it"},{"level":2,"text":"Related Notes","slug":"related-notes"}],"sections":[{"level":1,"title":"Overview","slug":"","text":"# AGY CLI Auto-Approval Setup Eliminate manual command approval pauses in the `agy` terminal CLI using either interactive prefix allowlisting or wildcard rules in `settings.json`."},{"level":2,"title":"Option 1: Interactive Prefix Allowlist","slug":"option-1-interactive-prefix-allowlist","text":"During a prompt, when `agy` asks for permission to run a command, select the **\"Always allow...\"** option so that command prefix is permanently added to your allowlist."},{"level":2,"title":"Option 2: Global Wildcard in settings.json","slug":"option-2-global-wildcard-in-settings-json","text":"Open `~/.gemini/antigravity-cli/settings.json` and add wildcard rules under `\"permissions\".\"allow\"` so you aren't prompted for each new command: ```json { \"permissions\": { \"allow\": [ \"command(*)\" ] } } ```"},{"level":2,"title":"Option 3: One-Line Terminal Command to Apply It","slug":"option-3-one-line-terminal-command-to-apply-it","text":"Run this command in your own terminal to merge `\"command(*)\"` into `~/.gemini/antigravity-cli/settings.json`: ```bash python3 - <<'EOF' import json, pathlib p = pathlib.Path.home() / \".gemini/antigravity-cli/settings.json\" p.parent.mkdir(parents=True, exist_ok=True) data = json.loads(p.read_text()) if p.exists() else {} allow = data.setdefault(\"permissions\", {}).setdefault(\"allow\", []) if \"command(*)\" not in allow: allow.append(\"command(*)\") p.write_text(json.dumps(data, indent=2) + \"\\n\") print(\"Updated\", p) EOF ```"},{"level":2,"title":"Related Notes","slug":"related-notes","text":"- [Dev Tools Index](./index.md) - [macOS Terminal TokyoGlass](./macos-terminal-tokyo-glass.md) - [VS Code Tokyo Night Glass](./tokyo-night-storm.md)"}],"body":"\n# AGY CLI Auto-Approval Setup\n\nEliminate manual command approval pauses in the `agy` terminal CLI using either interactive prefix allowlisting or wildcard rules in `settings.json`.\n\n## Option 1: Interactive Prefix Allowlist\n\nDuring a prompt, when `agy` asks for permission to run a command, select the **\"Always allow...\"** option so that command prefix is permanently added to your allowlist.\n\n## Option 2: Global Wildcard in `settings.json`\n\nOpen `~/.gemini/antigravity-cli/settings.json` and add wildcard rules under `\"permissions\".\"allow\"` so you aren't prompted for each new command:\n\n```json\n{\n  \"permissions\": {\n    \"allow\": [\n      \"command(*)\"\n    ]\n  }\n}\n```\n\n## Option 3: One-Line Terminal Command to Apply It\n\nRun this command in your own terminal to merge `\"command(*)\"` into `~/.gemini/antigravity-cli/settings.json`:\n\n```bash\npython3 - <<'EOF'\nimport json, pathlib\np = pathlib.Path.home() / \".gemini/antigravity-cli/settings.json\"\np.parent.mkdir(parents=True, exist_ok=True)\ndata = json.loads(p.read_text()) if p.exists() else {}\nallow = data.setdefault(\"permissions\", {}).setdefault(\"allow\", [])\nif \"command(*)\" not in allow:\n    allow.append(\"command(*)\")\np.write_text(json.dumps(data, indent=2) + \"\\n\")\nprint(\"Updated\", p)\nEOF\n```\n\n## Related Notes\n\n- [Dev Tools Index](./index.md)\n- [macOS Terminal TokyoGlass](./macos-terminal-tokyo-glass.md)\n- [VS Code Tokyo Night Glass](./tokyo-night-storm.md)\n","color":"#9ECE6A","backlinks":["dev-tools/index.md","index.md","log.md"]},{"id":"dev-tools/index.md","title":"Dev Tools","subtitle":"OKF Knowledge Index","type":"index","description":"OKF Knowledge Index","updated":"","tags":[],"headings":[{"level":2,"text":"Concepts","slug":"concepts"}],"sections":[{"level":1,"title":"Overview","slug":"","text":"# Dev Tools Concept guides, configurations, and copy-paste prompts for replicating local development environments on any Mac."},{"level":2,"title":"Concepts","slug":"concepts","text":"- [macOS Terminal TokyoGlass](./macos-terminal-tokyo-glass.md) - Concept breakdown, step-by-step script, and AI prompt to replicate the `TokyoGlass16_5` frosted-glass macOS Terminal profile. - [VS Code Tokyo Night Glass](./tokyo-night-storm.md) - Concept breakdown, step-by-step setup, and AI prompt to replicate the Tokyo Night Storm frosted-glass theme in VS Code. - [AGY CLI Auto-Approval Setup](./agy-cli-permissions.md) - Turn off manual command approval pauses in the `agy` CLI via allowlists or `settings.json`."}],"body":"# Dev Tools\n\nConcept guides, configurations, and copy-paste prompts for replicating local development environments on any Mac.\n\n## Concepts\n\n- [macOS Terminal TokyoGlass](./macos-terminal-tokyo-glass.md) - Concept breakdown, step-by-step script, and AI prompt to replicate the `TokyoGlass16_5` frosted-glass macOS Terminal profile.\n- [VS Code Tokyo Night Glass](./tokyo-night-storm.md) - Concept breakdown, step-by-step setup, and AI prompt to replicate the Tokyo Night Storm frosted-glass theme in VS Code.\n- [AGY CLI Auto-Approval Setup](./agy-cli-permissions.md) - Turn off manual command approval pauses in the `agy` CLI via allowlists or `settings.json`.\n","color":"#F0F6FC","backlinks":["dev-tools/agy-cli-permissions.md","index.md"]},{"id":"dev-tools/macos-terminal-tokyo-glass.md","title":"macOS Terminal TokyoGlass","subtitle":"Frosted-glass Terminal.app profile (TokyoGlass16_5)","type":"concept","description":"Step-by-step concept guide and reusable AI prompt to replicate the custom TokyoGlass16_5 frosted-glass macOS Terminal profile on any Mac.","updated":"2026-11-07","tags":["macos","terminal","tokyo-night","glass","ai-prompt"],"headings":[{"level":2,"text":"1. Concept: How the Frosted Glass Terminal Works","slug":"1-concept-how-the-frosted-glass-terminal-works"},{"level":2,"text":"2. Copy-Paste AI Prompt (Replicate on Any Mac)","slug":"2-copy-paste-ai-prompt-replicate-on-any-mac"},{"level":2,"text":"3. Step-by-Step Manual / Scripted Replication","slug":"3-step-by-step-manual-scripted-replication"},{"level":3,"text":"Step 1: Run the Self-Contained Installer Script","slug":"step-1-run-the-self-contained-installer-script"},{"level":3,"text":"Step 2: Export or Import as a .terminal File (Alternative)","slug":"step-2-export-or-import-as-a-terminal-file-alternative"}],"sections":[{"level":1,"title":"Overview","slug":"","text":"# macOS Terminal TokyoGlass Setup (`TokyoGlass16_5`) This concept documents how the **`TokyoGlass16_5`** macOS `Terminal.app` profile works under the hood, along with a **copy-paste AI prompt** and **step-by-step instructions** to replicate the exact frosted Tokyo Night glass terminal on any Mac. Related: [VS Code Tokyo Night Storm Glass Setup](./tokyo-night-storm.md) · [Second Brain Index](../index.md) ---"},{"level":2,"title":"1. Concept: How the Frosted Glass Terminal Works","slug":"1-concept-how-the-frosted-glass-terminal-works","text":"macOS `Terminal.app` stores custom profiles in `~/Library/Preferences/com.apple.Terminal.plist` under the `\"Window Settings\"` dictionary. Each color and font property is serialized as a binary `NSKeyedArchiver` (`NSColor` / `NSFont`) blob. The **`TokyoGlass16_5`** aesthetic is built from four pillars: 1. **Frosted Dark Navy Glass Backdrop** - **Background RGB**: `0.086, 0.102, 0.157` (`#161A28`) - **Background Opacity (Alpha)**: `0.60` (60% opacity / 40% translucency) - **Active Window Blur (`BackgroundBlur`)**: `0.65` (65% Gaussian blur via macOS WindowServer) - **Inactive Window Blur (`BackgroundBlurInactive`)**: `0.0` (`BackgroundSettingsForInactiveWindows: false`) 2. **Typography & Geometry** - **Font**: `SFMonoTerminal-Regular` (`16pt`, antialiased) - **Line Height (`FontHeightSpacing`)**: `1.12` - **Character Width (`FontWidthSpacing`)**: `1.01` - **Window Grid**: `120` columns × `30` rows 3. **Cursor, Text & Selection** - **Normal Text (`TextColor`)**: `#D8E0F1` (`0.847, 0.878, 0.945`) - **Bold Text (`TextBoldColor`)**: `#F1F6FF` (`0.945, 0.965, 1.000`) - **Cursor**: Blinking vertical bar (`CursorType: 2`, `CursorBlink: true`) in Sky Cyan `#7DCFFF` (`0.490, 0.812, 1.000`) - **Selection (`SelectionColor`)**: `#374E79` at `0.75` alpha (`0.215, 0.305, 0.475, 0.75`) - **Input & Bell**: `useOptionAsMetaKey: true`, `Bell: false`, `VisualBell: false`, `ShowWindowSettingsNameInTitle: false` 4. **16-Color Tokyo Night ANSI Palette** | ANSI Slot | Hex | Normalized `NSRGB` (`R G B`) | | :--- | :--- | :--- | | **Black** (`ANSIBlackColor`) | `#252A3C` | `0.145 0.165 0.235` | | **Bright Black** (`ANSIBrightBlackColor`) | `#565F7E` | `0.337 0.373 0.494` | | **Red** (`ANSIRedColor`) | `#F7768E` | `0.969 0.463 0.557` | | **Bright Red** (`ANSIBrightRedColor`) | `#FF94A8` | `1.000 0.580 0.659` | | **Green** (`ANSIGreenColor`) | `#9ECE6A` | `0.620 0.808 0.416` | | **Bright Green** (`ANSIBrightGreenColor`) | `#B3E285` | `0.702 0.886 0.522` | | **Yellow** (`ANSIYellowColor`) | `#E0AF68` | `0.878 0.686 0.408` | | **Bright Yellow** (`ANSIBrightYellowColor`) | `#F2CB8A` | `0.949 0.796 0.541` | | **Blue** (`ANSIBlueColor`) | `#7AA2F7` | `0.478 0.635 0.969` | | **Bright Blue** (`ANSIBrightBlueColor`) | `#91B9FF` | `0.569 0.725 1.000` | | **Magenta** (`ANSIMagentaColor`) | `#BB9AF7` | `0.733 0.604 0.969` | | **Bright Magenta** (`ANSIBrightMagentaColor`) | `#D0B4FF` | `0.816 0.706 1.000` | | **Cyan** (`ANSICyanColor`) | `#7DCFFF` | `0.490 0.812 1.000` | | **Bright Cyan** (`ANSIBrightCyanColor`) | `#9BE2FF` | `0.608 0.886 1.000` | | **White** (`ANSIWhiteColor`) | `#C0CAF5` | `0.753 0.792 0.898` | | **Bright White** (`ANSIBrightWhiteColor`) | `#F1F6FF` | `0.945 0.965 1.000` | ---"},{"level":2,"title":"2. Copy-Paste AI Prompt (Replicate on Any Mac)","slug":"2-copy-paste-ai-prompt-replicate-on-any-mac","text":"Paste the block below into `agy` (or any terminal AI agent) on a new Mac to automatically create and activate the `TokyoGlass16_5` profile: ```text Configure my macOS Terminal.app with a custom profile named \"TokyoGlass16_5\" and set it as both the Default and Startup Window Settings in ~/Library/Preferences/com.apple.Terminal.plist. Use these exact specifications: 1. Glass & Window: - BackgroundColor: NSRGB \"0.086 0.102 0.157 0.6\" (#161A28 at 60% opacity) - BackgroundBlur: 0.65 - BackgroundBlurInactive: 0.0 - BackgroundSettingsForInactiveWindows: false - columnCount: 120, rowCount: 30 - ShowWindowSettingsNameInTitle: false - Bell: false, VisualBell: false - useOptionAsMetaKey: true - DynamicANSIForegroundColors: false 2. Font: - Font: SFMonoTerminal-Regular, size 16.0 - FontAntialias: true - FontHeightSpacing: 1.12 - FontWidthSpacing: 1.01 3. Text, Cursor & Selection: - TextColor: NSRGB \"0.847 0.878 0.945\" (#D8E0F1) - TextBoldColor: NSRGB \"0.945 0.965 1\" (#F1F6FF) - CursorColor: NSRGB \"0.49 0.812 1\" (#7DCFFF) - CursorType: 2 (Vertical Bar), CursorBlink: true - SelectionColor: NSRGB \"0.215 0.305 0.475 0.75\" (#374E79 @ 75%) 4. ANSI Palette (NSKeyedArchiver NSColor blobs with NSColorSpace=1): - ANSIBlackColor: \"0.145 0.165 0.235\" - ANSIBrightBlackColor: \"0.337 0.373 0.494\" - ANSIRedColor: \"0.969 0.463 0.557\" - ANSIBrightRedColor: \"1 0.58 0.659\" - ANSIGreenColor: \"0.62 0.808 0.416\" - ANSIBrightGreenColor: \"0.702 0.886 0.522\" - ANSIYellowColor: \"0.878 0.686 0.408\" - ANSIBrightYellowColor: \"0.949 0.796 0.541\" - ANSIBlueColor: \"0.478 0.635 0.969\" - ANSIBrightBlueColor: \"0.569 0.725 1\" - ANSIMagentaColor: \"0.733 0.604 0.969\" - ANSIBrightMagentaColor: \"0.816 0.706 1\" - ANSICyanColor: \"0.49 0.812 1\" - ANSIBrightCyanColor: \"0.608 0.886 1\" - ANSIWhiteColor: \"0.753 0.792 0.898\" - ANSIBrightWhiteColor: \"0.945 0.965 1\" Write a Python script using plistlib to encode the NSKeyedArchiver NSColor/NSFont objects, inject \"TokyoGlass16_5\" into ~/Library/Preferences/com.apple.Terminal.plist, set \"Default Window Settings\" and \"Startup Window Settings\" to \"TokyoGlass16_5\", and reload cfprefsd. ``` ---"},{"level":2,"title":"3. Step-by-Step Manual / Scripted Replication","slug":"3-step-by-step-manual-scripted-replication","text":""},{"level":3,"title":"Step 1: Run the Self-Contained Installer Script","slug":"step-1-run-the-self-contained-installer-script","text":"On any Mac, run the following Python script in Terminal to generate and activate `TokyoGlass16_5`: ```bash python3 - <<'EOF' import os, plistlib, subprocess plist_path = os.path.expanduser(\"~/Library/Preferences/com.apple.Terminal.plist\") with open(plist_path, \"rb\") as f: prefs = plistlib.load(f) def make_nscolor(nsrgb_str): archive = { \"$version\": 100000, \"$archiver\": \"NSKeyedArchiver\", \"$top\": {\"root\": plistlib.UID(1)}, \"$objects\": [ \"$null\", { \"NSRGB\": nsrgb_str.encode(\"ascii\") + b\"\\x00\", \"NSColorSpace\": 1, \"$class\": plistlib.UID(2), }, {\"$classname\": \"NSColor\", \"$classes\": [\"NSColor\", \"NSObject\"]}, ], } return plistlib.dumps(archive, fmt=plistlib.FMT_BINARY) def make_nsfont(name, size): archive = { \"$version\": 100000, \"$archiver\": \"NSKeyedArchiver\", \"$top\": {\"root\": plistlib.UID(1)}, \"$objects\": [ \"$null\", { \"NSSize\": float(size), \"NSfFlags\": 16, \"NSName\": plistlib.UID(2), \"$class\": plistlib.UID(3), }, name, {\"$classname\": \"NSFont\", \"$classes\": [\"NSFont\", \"NSObject\"]}, ], } return plistlib.dumps(archive, fmt=plistlib.FMT_BINARY) profile = { \"name\": \"TokyoGlass16_5\", \"type\": \"Window Settings\", \"ProfileCurrentVersion\": 2.09, \"columnCount\": 120, \"rowCount\": 30, \"BackgroundBlur\": 0.65, \"BackgroundBlurInactive\": 0.0, \"BackgroundSettingsForInactiveWindows\": False, \"BackgroundColor\": make_nscolor(\"0.086 0.102 0.157 0.6\"), \"TextColor\": make_nscolor(\"0.847 0.878 0.945\"), \"TextBoldColor\": make_nscolor(\"0.945 0.965 1\"), \"CursorColor\": make_nscolor(\"0.49 0.812 1\"), \"CursorType\": 2, \"CursorBlink\": True, \"SelectionColor\": make_nscolor(\"0.215 0.305 0.475 0.75\"), \"Font\": make_nsfont(\"SFMonoTerminal-Regular\", 16.0), \"FontAntialias\": True, \"FontHeightSpacing\": 1.12, \"FontWidthSpacing\": 1.01, \"Bell\": False, \"VisualBell\": False, \"ShowWindowSettingsNameInTitle\": False, \"DynamicANSIForegroundColors\": False, \"useOptionAsMetaKey\": True, \"ANSIBlackColor\": make_nscolor(\"0.145 0.165 0.235\"), \"ANSIBrightBlackColor\": make_nscolor(\"0.337 0.373 0.494\"), \"ANSIRedColor\": make_nscolor(\"0.969 0.463 0.557\"), \"ANSIBrightRedColor\": make_nscolor(\"1 0.58 0.659\"), \"ANSIGreenColor\": make_nscolor(\"0.62 0.808 0.416\"), \"ANSIBrightGreenColor\": make_nscolor(\"0.702 0.886 0.522\"), \"ANSIYellowColor\": make_nscolor(\"0.878 0.686 0.408\"), \"ANSIBrightYellowColor\": make_nscolor(\"0.949 0.796 0.541\"), \"ANSIBlueColor\": make_nscolor(\"0.478 0.635 0.969\"), \"ANSIBrightBlueColor\": make_nscolor(\"0.569 0.725 1\"), \"ANSIMagentaColor\": make_nscolor(\"0.733 0.604 0.969\"), \"ANSIBrightMagentaColor\": make_nscolor(\"0.816 0.706 1\"), \"ANSICyanColor\": make_nscolor(\"0.49 0.812 1\"), \"ANSIBrightCyanColor\": make_nscolor(\"0.608 0.886 1\"), \"ANSIWhiteColor\": make_nscolor(\"0.753 0.792 0.898\"), \"ANSIBrightWhiteColor\": make_nscolor(\"0.945 0.965 1\"), } prefs.setdefault(\"Window Settings\", {})[\"TokyoGlass16_5\"] = profile prefs[\"Default Window Settings\"] = \"TokyoGlass16_5\" prefs[\"Startup Window Settings\"] = \"TokyoGlass16_5\" with open(plist_path, \"wb\") as f: plistlib.dump(prefs, f, fmt=plistlib.FMT_BINARY) subprocess.run([\"killall\", \"cfprefsd\"], check=False) print(\"✅ TokyoGlass16_5 installed and set as default!\") EOF ```"},{"level":3,"title":"Step 2: Export or Import as a .terminal File (Alternative)","slug":"step-2-export-or-import-as-a-terminal-file-alternative","text":"If you want to export the profile as a portable `.terminal` file from an existing Mac: ```bash plutil -extract \"Window Settings.TokyoGlass16_5\" xml1 -o ~/Desktop/TokyoGlass16_5.terminal ~/Library/Preferences/com.apple.Terminal.plist ``` On any new Mac, double-click `TokyoGlass16_5.terminal` and click **Shell → Use Settings as Default**."}],"body":"\n# macOS Terminal TokyoGlass Setup (`TokyoGlass16_5`)\n\nThis concept documents how the **`TokyoGlass16_5`** macOS `Terminal.app` profile works under the hood, along with a **copy-paste AI prompt** and **step-by-step instructions** to replicate the exact frosted Tokyo Night glass terminal on any Mac.\n\nRelated: [VS Code Tokyo Night Storm Glass Setup](./tokyo-night-storm.md) · [Second Brain Index](../index.md)\n\n---\n\n## 1. Concept: How the Frosted Glass Terminal Works\n\nmacOS `Terminal.app` stores custom profiles in `~/Library/Preferences/com.apple.Terminal.plist` under the `\"Window Settings\"` dictionary. Each color and font property is serialized as a binary `NSKeyedArchiver` (`NSColor` / `NSFont`) blob.\n\nThe **`TokyoGlass16_5`** aesthetic is built from four pillars:\n\n1. **Frosted Dark Navy Glass Backdrop**\n   - **Background RGB**: `0.086, 0.102, 0.157` (`#161A28`)\n   - **Background Opacity (Alpha)**: `0.60` (60% opacity / 40% translucency)\n   - **Active Window Blur (`BackgroundBlur`)**: `0.65` (65% Gaussian blur via macOS WindowServer)\n   - **Inactive Window Blur (`BackgroundBlurInactive`)**: `0.0` (`BackgroundSettingsForInactiveWindows: false`)\n2. **Typography & Geometry**\n   - **Font**: `SFMonoTerminal-Regular` (`16pt`, antialiased)\n   - **Line Height (`FontHeightSpacing`)**: `1.12`\n   - **Character Width (`FontWidthSpacing`)**: `1.01`\n   - **Window Grid**: `120` columns × `30` rows\n3. **Cursor, Text & Selection**\n   - **Normal Text (`TextColor`)**: `#D8E0F1` (`0.847, 0.878, 0.945`)\n   - **Bold Text (`TextBoldColor`)**: `#F1F6FF` (`0.945, 0.965, 1.000`)\n   - **Cursor**: Blinking vertical bar (`CursorType: 2`, `CursorBlink: true`) in Sky Cyan `#7DCFFF` (`0.490, 0.812, 1.000`)\n   - **Selection (`SelectionColor`)**: `#374E79` at `0.75` alpha (`0.215, 0.305, 0.475, 0.75`)\n   - **Input & Bell**: `useOptionAsMetaKey: true`, `Bell: false`, `VisualBell: false`, `ShowWindowSettingsNameInTitle: false`\n4. **16-Color Tokyo Night ANSI Palette**\n\n| ANSI Slot | Hex | Normalized `NSRGB` (`R G B`) |\n| :--- | :--- | :--- |\n| **Black** (`ANSIBlackColor`) | `#252A3C` | `0.145 0.165 0.235` |\n| **Bright Black** (`ANSIBrightBlackColor`) | `#565F7E` | `0.337 0.373 0.494` |\n| **Red** (`ANSIRedColor`) | `#F7768E` | `0.969 0.463 0.557` |\n| **Bright Red** (`ANSIBrightRedColor`) | `#FF94A8` | `1.000 0.580 0.659` |\n| **Green** (`ANSIGreenColor`) | `#9ECE6A` | `0.620 0.808 0.416` |\n| **Bright Green** (`ANSIBrightGreenColor`) | `#B3E285` | `0.702 0.886 0.522` |\n| **Yellow** (`ANSIYellowColor`) | `#E0AF68` | `0.878 0.686 0.408` |\n| **Bright Yellow** (`ANSIBrightYellowColor`) | `#F2CB8A` | `0.949 0.796 0.541` |\n| **Blue** (`ANSIBlueColor`) | `#7AA2F7` | `0.478 0.635 0.969` |\n| **Bright Blue** (`ANSIBrightBlueColor`) | `#91B9FF` | `0.569 0.725 1.000` |\n| **Magenta** (`ANSIMagentaColor`) | `#BB9AF7` | `0.733 0.604 0.969` |\n| **Bright Magenta** (`ANSIBrightMagentaColor`) | `#D0B4FF` | `0.816 0.706 1.000` |\n| **Cyan** (`ANSICyanColor`) | `#7DCFFF` | `0.490 0.812 1.000` |\n| **Bright Cyan** (`ANSIBrightCyanColor`) | `#9BE2FF` | `0.608 0.886 1.000` |\n| **White** (`ANSIWhiteColor`) | `#C0CAF5` | `0.753 0.792 0.898` |\n| **Bright White** (`ANSIBrightWhiteColor`) | `#F1F6FF` | `0.945 0.965 1.000` |\n\n---\n\n## 2. Copy-Paste AI Prompt (Replicate on Any Mac)\n\nPaste the block below into `agy` (or any terminal AI agent) on a new Mac to automatically create and activate the `TokyoGlass16_5` profile:\n\n```text\nConfigure my macOS Terminal.app with a custom profile named \"TokyoGlass16_5\" and set it as both the Default and Startup Window Settings in ~/Library/Preferences/com.apple.Terminal.plist.\n\nUse these exact specifications:\n1. Glass & Window:\n   - BackgroundColor: NSRGB \"0.086 0.102 0.157 0.6\" (#161A28 at 60% opacity)\n   - BackgroundBlur: 0.65\n   - BackgroundBlurInactive: 0.0\n   - BackgroundSettingsForInactiveWindows: false\n   - columnCount: 120, rowCount: 30\n   - ShowWindowSettingsNameInTitle: false\n   - Bell: false, VisualBell: false\n   - useOptionAsMetaKey: true\n   - DynamicANSIForegroundColors: false\n2. Font:\n   - Font: SFMonoTerminal-Regular, size 16.0\n   - FontAntialias: true\n   - FontHeightSpacing: 1.12\n   - FontWidthSpacing: 1.01\n3. Text, Cursor & Selection:\n   - TextColor: NSRGB \"0.847 0.878 0.945\" (#D8E0F1)\n   - TextBoldColor: NSRGB \"0.945 0.965 1\" (#F1F6FF)\n   - CursorColor: NSRGB \"0.49 0.812 1\" (#7DCFFF)\n   - CursorType: 2 (Vertical Bar), CursorBlink: true\n   - SelectionColor: NSRGB \"0.215 0.305 0.475 0.75\" (#374E79 @ 75%)\n4. ANSI Palette (NSKeyedArchiver NSColor blobs with NSColorSpace=1):\n   - ANSIBlackColor: \"0.145 0.165 0.235\"\n   - ANSIBrightBlackColor: \"0.337 0.373 0.494\"\n   - ANSIRedColor: \"0.969 0.463 0.557\"\n   - ANSIBrightRedColor: \"1 0.58 0.659\"\n   - ANSIGreenColor: \"0.62 0.808 0.416\"\n   - ANSIBrightGreenColor: \"0.702 0.886 0.522\"\n   - ANSIYellowColor: \"0.878 0.686 0.408\"\n   - ANSIBrightYellowColor: \"0.949 0.796 0.541\"\n   - ANSIBlueColor: \"0.478 0.635 0.969\"\n   - ANSIBrightBlueColor: \"0.569 0.725 1\"\n   - ANSIMagentaColor: \"0.733 0.604 0.969\"\n   - ANSIBrightMagentaColor: \"0.816 0.706 1\"\n   - ANSICyanColor: \"0.49 0.812 1\"\n   - ANSIBrightCyanColor: \"0.608 0.886 1\"\n   - ANSIWhiteColor: \"0.753 0.792 0.898\"\n   - ANSIBrightWhiteColor: \"0.945 0.965 1\"\n\nWrite a Python script using plistlib to encode the NSKeyedArchiver NSColor/NSFont objects, inject \"TokyoGlass16_5\" into ~/Library/Preferences/com.apple.Terminal.plist, set \"Default Window Settings\" and \"Startup Window Settings\" to \"TokyoGlass16_5\", and reload cfprefsd.\n```\n\n---\n\n## 3. Step-by-Step Manual / Scripted Replication\n\n### Step 1: Run the Self-Contained Installer Script\n\nOn any Mac, run the following Python script in Terminal to generate and activate `TokyoGlass16_5`:\n\n```bash\npython3 - <<'EOF'\nimport os, plistlib, subprocess\n\nplist_path = os.path.expanduser(\"~/Library/Preferences/com.apple.Terminal.plist\")\nwith open(plist_path, \"rb\") as f:\n    prefs = plistlib.load(f)\n\ndef make_nscolor(nsrgb_str):\n    archive = {\n        \"$version\": 100000,\n        \"$archiver\": \"NSKeyedArchiver\",\n        \"$top\": {\"root\": plistlib.UID(1)},\n        \"$objects\": [\n            \"$null\",\n            {\n                \"NSRGB\": nsrgb_str.encode(\"ascii\") + b\"\\x00\",\n                \"NSColorSpace\": 1,\n                \"$class\": plistlib.UID(2),\n            },\n            {\"$classname\": \"NSColor\", \"$classes\": [\"NSColor\", \"NSObject\"]},\n        ],\n    }\n    return plistlib.dumps(archive, fmt=plistlib.FMT_BINARY)\n\ndef make_nsfont(name, size):\n    archive = {\n        \"$version\": 100000,\n        \"$archiver\": \"NSKeyedArchiver\",\n        \"$top\": {\"root\": plistlib.UID(1)},\n        \"$objects\": [\n            \"$null\",\n            {\n                \"NSSize\": float(size),\n                \"NSfFlags\": 16,\n                \"NSName\": plistlib.UID(2),\n                \"$class\": plistlib.UID(3),\n            },\n            name,\n            {\"$classname\": \"NSFont\", \"$classes\": [\"NSFont\", \"NSObject\"]},\n        ],\n    }\n    return plistlib.dumps(archive, fmt=plistlib.FMT_BINARY)\n\nprofile = {\n    \"name\": \"TokyoGlass16_5\",\n    \"type\": \"Window Settings\",\n    \"ProfileCurrentVersion\": 2.09,\n    \"columnCount\": 120,\n    \"rowCount\": 30,\n    \"BackgroundBlur\": 0.65,\n    \"BackgroundBlurInactive\": 0.0,\n    \"BackgroundSettingsForInactiveWindows\": False,\n    \"BackgroundColor\": make_nscolor(\"0.086 0.102 0.157 0.6\"),\n    \"TextColor\": make_nscolor(\"0.847 0.878 0.945\"),\n    \"TextBoldColor\": make_nscolor(\"0.945 0.965 1\"),\n    \"CursorColor\": make_nscolor(\"0.49 0.812 1\"),\n    \"CursorType\": 2,\n    \"CursorBlink\": True,\n    \"SelectionColor\": make_nscolor(\"0.215 0.305 0.475 0.75\"),\n    \"Font\": make_nsfont(\"SFMonoTerminal-Regular\", 16.0),\n    \"FontAntialias\": True,\n    \"FontHeightSpacing\": 1.12,\n    \"FontWidthSpacing\": 1.01,\n    \"Bell\": False,\n    \"VisualBell\": False,\n    \"ShowWindowSettingsNameInTitle\": False,\n    \"DynamicANSIForegroundColors\": False,\n    \"useOptionAsMetaKey\": True,\n    \"ANSIBlackColor\": make_nscolor(\"0.145 0.165 0.235\"),\n    \"ANSIBrightBlackColor\": make_nscolor(\"0.337 0.373 0.494\"),\n    \"ANSIRedColor\": make_nscolor(\"0.969 0.463 0.557\"),\n    \"ANSIBrightRedColor\": make_nscolor(\"1 0.58 0.659\"),\n    \"ANSIGreenColor\": make_nscolor(\"0.62 0.808 0.416\"),\n    \"ANSIBrightGreenColor\": make_nscolor(\"0.702 0.886 0.522\"),\n    \"ANSIYellowColor\": make_nscolor(\"0.878 0.686 0.408\"),\n    \"ANSIBrightYellowColor\": make_nscolor(\"0.949 0.796 0.541\"),\n    \"ANSIBlueColor\": make_nscolor(\"0.478 0.635 0.969\"),\n    \"ANSIBrightBlueColor\": make_nscolor(\"0.569 0.725 1\"),\n    \"ANSIMagentaColor\": make_nscolor(\"0.733 0.604 0.969\"),\n    \"ANSIBrightMagentaColor\": make_nscolor(\"0.816 0.706 1\"),\n    \"ANSICyanColor\": make_nscolor(\"0.49 0.812 1\"),\n    \"ANSIBrightCyanColor\": make_nscolor(\"0.608 0.886 1\"),\n    \"ANSIWhiteColor\": make_nscolor(\"0.753 0.792 0.898\"),\n    \"ANSIBrightWhiteColor\": make_nscolor(\"0.945 0.965 1\"),\n}\n\nprefs.setdefault(\"Window Settings\", {})[\"TokyoGlass16_5\"] = profile\nprefs[\"Default Window Settings\"] = \"TokyoGlass16_5\"\nprefs[\"Startup Window Settings\"] = \"TokyoGlass16_5\"\n\nwith open(plist_path, \"wb\") as f:\n    plistlib.dump(prefs, f, fmt=plistlib.FMT_BINARY)\n\nsubprocess.run([\"killall\", \"cfprefsd\"], check=False)\nprint(\"✅ TokyoGlass16_5 installed and set as default!\")\nEOF\n```\n\n### Step 2: Export or Import as a `.terminal` File (Alternative)\n\nIf you want to export the profile as a portable `.terminal` file from an existing Mac:\n\n```bash\nplutil -extract \"Window Settings.TokyoGlass16_5\" xml1 -o ~/Desktop/TokyoGlass16_5.terminal ~/Library/Preferences/com.apple.Terminal.plist\n```\n\nOn any new Mac, double-click `TokyoGlass16_5.terminal` and click **Shell → Use Settings as Default**.\n","color":"#9ECE6A","backlinks":["dev-tools/agy-cli-permissions.md","dev-tools/index.md","dev-tools/tokyo-night-storm.md","index.md","log.md"]},{"id":"dev-tools/tokyo-night-storm.md","title":"VS Code Tokyo Night Glass","subtitle":"Vibrancy Continued + Tokyo Night Storm CSS","type":"concept","description":"Step-by-step concept guide and reusable AI prompt to replicate the Tokyo Night Storm frosted-glass setup in VS Code on any Mac.","updated":"2026-11-07","tags":["macos","vscode","tokyo-night","glass","ai-prompt"],"headings":[{"level":2,"text":"1. Concept: How VS Code Glass / Vibrancy Works on macOS","slug":"1-concept-how-vs-code-glass-vibrancy-works-on-macos"},{"level":3,"text":"Common Pitfalls & Why It Can Look Weird Out-of-the-Box","slug":"common-pitfalls-why-it-can-look-weird-out-of-the-box"},{"level":2,"text":"2. Copy-Paste AI Prompt (Replicate on Any Mac)","slug":"2-copy-paste-ai-prompt-replicate-on-any-mac"},{"level":2,"text":"3. Step-by-Step Manual Replication","slug":"3-step-by-step-manual-replication"},{"level":3,"text":"Step 1: Install the Extensions","slug":"step-1-install-the-extensions"},{"level":3,"text":"Step 2: Remove the Blurry Neon Glow in Vibrancy's Tokyo Night Storm CSS (Optional but Recommended)","slug":"step-2-remove-the-blurry-neon-glow-in-vibrancy-s-tokyo-night-storm-css-optional-but-recommended"},{"level":3,"text":"Step 3: Apply settings.json","slug":"step-3-apply-settings-json"},{"level":3,"text":"Step 4: Activate Vibrancy in VS Code","slug":"step-4-activate-vibrancy-in-vs-code"}],"sections":[{"level":1,"title":"Overview","slug":"","text":"# VS Code Tokyo Night Storm Glass Setup (`tokyo-night-storm`) This concept explains how the **Tokyo Night Storm** frosted-glass setup works in VS Code on macOS, why certain vibrancy defaults can look off, and how to replicate the exact setup cleanly on any Mac using either a **copy-paste AI prompt** or **step-by-step commands**. Related: [macOS Terminal TokyoGlass Setup](./macos-terminal-tokyo-glass.md) · [Second Brain Index](../index.md) ---"},{"level":2,"title":"1. Concept: How VS Code Glass / Vibrancy Works on macOS","slug":"1-concept-how-vs-code-glass-vibrancy-works-on-macos","text":"Unlike `Terminal.app`, VS Code (an Electron app) uses opaque workbench layers by default. Achieving the **Tokyo Night Storm** glass look requires three layers working together: 1. **Syntax & UI Theme (`enkia.tokyo-night` + `pkief.material-icon-theme`)** - Sets `\"workbench.colorTheme\": \"Tokyo Night Storm\"` and `\"workbench.iconTheme\": \"material-icon-theme\"`. 2. **Native macOS Vibrancy Injection (`illixion.vscode-vibrancy-continued`)** - Patches VS Code's Electron `BrowserWindow` (`main.js` and `mainImpl.js`) with `visualEffectState: \"active\"`, `frame: false`, and `transparent: true`. - Calls Electron's `window.setVibrancy(\"under-window\")` so macOS WindowServer blurs everything behind the VS Code window. - Injects a root `<style>` tag setting `html { background: rgba(R, G, B, opacity) !important; }` using `\"vscode_vibrancy.backgroundOverride\"` (`#181F31` or `#161A28`) and `\"vscode_vibrancy.opacity\"` (`0.42`–`0.60`). 3. **Transparent Surface Layering (`workbench.colorCustomizations` & Terminal DOM Renderer)** - Sets `\"terminal.integrated.gpuAcceleration\": \"off\"` so the integrated terminal uses the DOM renderer instead of an opaque WebGL canvas. - Replaces opaque workbench surfaces (`editorPane.background`, `editorGutter.background`, `panel.background`, `terminal.background`, `tab.activeBackground`) with `#181f3100` (transparent) or translucent tiers (`#181f316b` for sidebar/editor, `#181f31bf` for sticky scroll, `#181f31e6` for floating widgets/menus)."},{"level":3,"title":"Common Pitfalls & Why It Can Look Weird Out-of-the-Box","slug":"common-pitfalls-why-it-can-look-weird-out-of-the-box","text":"- **Neon Glow on Code Tokens**: The built-in `Tokyo Night Storm.css` inside `illixion.vscode-vibrancy-continued` includes a rule adding a blurry neon glow (`text-shadow: 0 0 8px, 0 0 2px #000;`) to `.mtk4, .mtk9.mtk10, .mtk11, ...`. Removing that rule keeps text crisp like `Terminal.app`. - **Double-Tinted Panes**: Because `html` already has the base tint, setting `editor.background` to `#181f316b` while `editorGutter.background` is `#181f3100` can make the editor slightly darker than the line-number gutter. Setting `editor.background` to `#181f3100` (with `\"vscode_vibrancy.disableColorCustomizations\": true`) makes the entire editor and gutter share a single, uniform glass layer. ---"},{"level":2,"title":"2. Copy-Paste AI Prompt (Replicate on Any Mac)","slug":"2-copy-paste-ai-prompt-replicate-on-any-mac","text":"Paste this prompt into `agy` (or any AI coding agent) on a new Mac to install and configure the complete setup automatically: ```text Set up my VS Code on macOS with the Tokyo Night Storm frosted-glass configuration: 1. Install required VS Code extensions via CLI: - enkia.tokyo-night - illixion.vscode-vibrancy-continued - pkief.material-icon-theme 2. Remove the blurry neon text-shadow rule (.mtk4,.mtk9.mtk10... { text-shadow: 0 0 8px, 0 0 2px #000; }) from ~/.vscode/extensions/illixion.vscode-vibrancy-continued-*/themes/Tokyo Night Storm.css so code tokens stay crisp. 3. Update ~/Library/Application Support/Code/User/settings.json with these theme, vibrancy, editor, and terminal settings (preserving any language-specific settings): - \"workbench.colorTheme\": \"Tokyo Night Storm\" - \"workbench.iconTheme\": \"material-icon-theme\" - \"window.titleBarStyle\": \"custom\" - \"window.systemColorTheme\": \"dark\" - \"window.autoDetectColorScheme\": false - \"vscode_vibrancy.theme\": \"Tokyo Night Storm\" - \"vscode_vibrancy.type\": \"under-window\" - \"vscode_vibrancy.opacity\": 0.42 - \"vscode_vibrancy.backgroundOverride\": \"#181F31\" - \"vscode_vibrancy.preventFlash\": true - \"editor.fontSize\": 16 - \"editor.lineHeight\": 24 - \"editor.minimap.enabled\": false - \"editor.cursorBlinking\": \"smooth\" - \"editor.cursorSmoothCaretAnimation\": \"on\" - \"editor.smoothScrolling\": true - \"terminal.integrated.fontSize\": 16 - \"terminal.integrated.lineHeight\": 1.25 - \"terminal.integrated.cursorStyle\": \"line\" - \"terminal.integrated.cursorBlinking\": true - \"terminal.integrated.gpuAcceleration\": \"off\" - \"workbench.colorCustomizations\" configured for #181f31 vibrancy transparency. 4. Clear macOS quarantine on \"/Applications/Visual Studio Code.app\" if needed so Vibrancy Continued can patch main.js, then remind me to press Cmd+Shift+P -> \"Reload Vibrancy\" inside VS Code. ``` ---"},{"level":2,"title":"3. Step-by-Step Manual Replication","slug":"3-step-by-step-manual-replication","text":""},{"level":3,"title":"Step 1: Install the Extensions","slug":"step-1-install-the-extensions","text":"Run in your terminal: ```bash code --install-extension enkia.tokyo-night code --install-extension illixion.vscode-vibrancy-continued code --install-extension pkief.material-icon-theme ```"},{"level":3,"title":"Step 2: Remove the Blurry Neon Glow in Vibrancy's Tokyo Night Storm CSS (Optional but Recommended)","slug":"step-2-remove-the-blurry-neon-glow-in-vibrancy-s-tokyo-night-storm-css-optional-but-recommended","text":"Strip the `text-shadow` glow rule from the extension's theme stylesheet before loading Vibrancy: ```bash python3 - <<'EOF' import glob, re for path in glob.glob(\"/Users/*/.vscode/extensions/illixion.vscode-vibrancy-continued-*/themes/Tokyo Night Storm.css\"): with open(path, \"r\") as f: css = f.read() cleaned = re.sub(r\"\\.mtk4,\\.mtk9\\.mtk10[^{]*\\{[^}]*\\}\\s*\", \"\", css) with open(path, \"w\") as f: f.write(cleaned) print(f\"Cleaned neon text-shadow in: {path}\") EOF ```"},{"level":3,"title":"Step 3: Apply settings.json","slug":"step-3-apply-settings-json","text":"Open `~/Library/Application Support/Code/User/settings.json` (<kbd>⌘</kbd>+<kbd>Shift</kbd>+<kbd>P</kbd> → **Preferences: Open User Settings (JSON)**) and include: ```json { \"editor.fontSize\": 16, \"editor.lineHeight\": 24, \"editor.minimap.enabled\": false, \"editor.stickyScroll.enabled\": true, \"editor.bracketPairColorization.enabled\": true, \"editor.guides.bracketPairs\": true, \"editor.cursorBlinking\": \"smooth\", \"editor.cursorSmoothCaretAnimation\": \"on\", \"editor.smoothScrolling\": true, \"workbench.colorTheme\": \"Tokyo Night Storm\", \"workbench.iconTheme\": \"material-icon-theme\", \"window.titleBarStyle\": \"custom\", \"window.systemColorTheme\": \"dark\", \"window.autoDetectColorScheme\": false, \"vscode_vibrancy.theme\": \"Tokyo Night Storm\", \"vscode_vibrancy.type\": \"under-window\", \"vscode_vibrancy.opacity\": 0.42, \"vscode_vibrancy.backgroundOverride\": \"#181F31\", \"vscode_vibrancy.preventFlash\": true, \"terminal.integrated.fontSize\": 16, \"terminal.integrated.defaultProfile.osx\": \"zsh\", \"terminal.integrated.cursorStyle\": \"line\", \"terminal.integrated.lineHeight\": 1.25, \"terminal.integrated.cursorBlinking\": true, \"terminal.integrated.gpuAcceleration\": \"off\", \"workbench.colorCustomizations\": { \"terminal.background\": \"#00000000\", \"editorPane.background\": \"#181f3100\", \"editorGroupHeader.tabsBackground\": \"#181f3100\", \"editorGroupHeader.noTabsBackground\": \"#181f3100\", \"breadcrumb.background\": \"#181f3100\", \"editorGutter.background\": \"#181f3100\", \"panel.background\": \"#181f3100\", \"tab.activeBackground\": \"#181f3100\", \"tab.unfocusedActiveBackground\": \"#181f3100\", \"sideBar.background\": \"#181f316b\", \"sideBarTitle.background\": \"#181f316b\", \"activityBar.background\": \"#181f316b\", \"editor.background\": \"#181f316b\", \"tab.inactiveBackground\": \"#181f316b\", \"tab.unfocusedInactiveBackground\": \"#181f316b\", \"editorStickyScroll.background\": \"#181f31bf\", \"editorStickyScrollGutter.background\": \"#181f31bf\", \"sideBarStickyScroll.background\": \"#181f31bf\", \"panelStickyScroll.background\": \"#181f31bf\", \"terminalStickyScroll.background\": \"#181f31bf\", \"minimap.background\": \"#181f31bf\", \"inlineChat.background\": \"#181f31e6\", \"editorWidget.background\": \"#181f31e6\", \"editorHoverWidget.background\": \"#181f31e6\", \"editorSuggestWidget.background\": \"#181f31e6\", \"notifications.background\": \"#181f31e6\", \"notificationCenterHeader.background\": \"#181f31e6\", \"menu.background\": \"#181f31e6\", \"quickInput.background\": \"#181f31e6\", \"editor.lineHighlightBorder\": \"#00000000\" } } ```"},{"level":3,"title":"Step 4: Activate Vibrancy in VS Code","slug":"step-4-activate-vibrancy-in-vs-code","text":"1. If macOS blocks VS Code from patching itself (`EROFS: read-only file system`), clear App Translocation quarantine first: ```bash sudo xattr -dr com.apple.quarantine \"/Applications/Visual Studio Code.app\" ``` 2. Inside VS Code, press <kbd>⌘</kbd>+<kbd>Shift</kbd>+<kbd>P</kbd> (or <kbd>F1</kbd>) → run **`Reload Vibrancy`**. 3. Click **Restart** when prompted."}],"body":"\n# VS Code Tokyo Night Storm Glass Setup (`tokyo-night-storm`)\n\nThis concept explains how the **Tokyo Night Storm** frosted-glass setup works in VS Code on macOS, why certain vibrancy defaults can look off, and how to replicate the exact setup cleanly on any Mac using either a **copy-paste AI prompt** or **step-by-step commands**.\n\nRelated: [macOS Terminal TokyoGlass Setup](./macos-terminal-tokyo-glass.md) · [Second Brain Index](../index.md)\n\n---\n\n## 1. Concept: How VS Code Glass / Vibrancy Works on macOS\n\nUnlike `Terminal.app`, VS Code (an Electron app) uses opaque workbench layers by default. Achieving the **Tokyo Night Storm** glass look requires three layers working together:\n\n1. **Syntax & UI Theme (`enkia.tokyo-night` + `pkief.material-icon-theme`)**\n   - Sets `\"workbench.colorTheme\": \"Tokyo Night Storm\"` and `\"workbench.iconTheme\": \"material-icon-theme\"`.\n2. **Native macOS Vibrancy Injection (`illixion.vscode-vibrancy-continued`)**\n   - Patches VS Code's Electron `BrowserWindow` (`main.js` and `mainImpl.js`) with `visualEffectState: \"active\"`, `frame: false`, and `transparent: true`.\n   - Calls Electron's `window.setVibrancy(\"under-window\")` so macOS WindowServer blurs everything behind the VS Code window.\n   - Injects a root `<style>` tag setting `html { background: rgba(R, G, B, opacity) !important; }` using `\"vscode_vibrancy.backgroundOverride\"` (`#181F31` or `#161A28`) and `\"vscode_vibrancy.opacity\"` (`0.42`–`0.60`).\n3. **Transparent Surface Layering (`workbench.colorCustomizations` & Terminal DOM Renderer)**\n   - Sets `\"terminal.integrated.gpuAcceleration\": \"off\"` so the integrated terminal uses the DOM renderer instead of an opaque WebGL canvas.\n   - Replaces opaque workbench surfaces (`editorPane.background`, `editorGutter.background`, `panel.background`, `terminal.background`, `tab.activeBackground`) with `#181f3100` (transparent) or translucent tiers (`#181f316b` for sidebar/editor, `#181f31bf` for sticky scroll, `#181f31e6` for floating widgets/menus).\n\n### Common Pitfalls & Why It Can Look Weird Out-of-the-Box\n\n- **Neon Glow on Code Tokens**: The built-in `Tokyo Night Storm.css` inside `illixion.vscode-vibrancy-continued` includes a rule adding a blurry neon glow (`text-shadow: 0 0 8px, 0 0 2px #000;`) to `.mtk4, .mtk9.mtk10, .mtk11, ...`. Removing that rule keeps text crisp like `Terminal.app`.\n- **Double-Tinted Panes**: Because `html` already has the base tint, setting `editor.background` to `#181f316b` while `editorGutter.background` is `#181f3100` can make the editor slightly darker than the line-number gutter. Setting `editor.background` to `#181f3100` (with `\"vscode_vibrancy.disableColorCustomizations\": true`) makes the entire editor and gutter share a single, uniform glass layer.\n\n---\n\n## 2. Copy-Paste AI Prompt (Replicate on Any Mac)\n\nPaste this prompt into `agy` (or any AI coding agent) on a new Mac to install and configure the complete setup automatically:\n\n```text\nSet up my VS Code on macOS with the Tokyo Night Storm frosted-glass configuration:\n\n1. Install required VS Code extensions via CLI:\n   - enkia.tokyo-night\n   - illixion.vscode-vibrancy-continued\n   - pkief.material-icon-theme\n\n2. Remove the blurry neon text-shadow rule (.mtk4,.mtk9.mtk10... { text-shadow: 0 0 8px, 0 0 2px #000; }) from ~/.vscode/extensions/illixion.vscode-vibrancy-continued-*/themes/Tokyo Night Storm.css so code tokens stay crisp.\n\n3. Update ~/Library/Application Support/Code/User/settings.json with these theme, vibrancy, editor, and terminal settings (preserving any language-specific settings):\n   - \"workbench.colorTheme\": \"Tokyo Night Storm\"\n   - \"workbench.iconTheme\": \"material-icon-theme\"\n   - \"window.titleBarStyle\": \"custom\"\n   - \"window.systemColorTheme\": \"dark\"\n   - \"window.autoDetectColorScheme\": false\n   - \"vscode_vibrancy.theme\": \"Tokyo Night Storm\"\n   - \"vscode_vibrancy.type\": \"under-window\"\n   - \"vscode_vibrancy.opacity\": 0.42\n   - \"vscode_vibrancy.backgroundOverride\": \"#181F31\"\n   - \"vscode_vibrancy.preventFlash\": true\n   - \"editor.fontSize\": 16\n   - \"editor.lineHeight\": 24\n   - \"editor.minimap.enabled\": false\n   - \"editor.cursorBlinking\": \"smooth\"\n   - \"editor.cursorSmoothCaretAnimation\": \"on\"\n   - \"editor.smoothScrolling\": true\n   - \"terminal.integrated.fontSize\": 16\n   - \"terminal.integrated.lineHeight\": 1.25\n   - \"terminal.integrated.cursorStyle\": \"line\"\n   - \"terminal.integrated.cursorBlinking\": true\n   - \"terminal.integrated.gpuAcceleration\": \"off\"\n   - \"workbench.colorCustomizations\" configured for #181f31 vibrancy transparency.\n\n4. Clear macOS quarantine on \"/Applications/Visual Studio Code.app\" if needed so Vibrancy Continued can patch main.js, then remind me to press Cmd+Shift+P -> \"Reload Vibrancy\" inside VS Code.\n```\n\n---\n\n## 3. Step-by-Step Manual Replication\n\n### Step 1: Install the Extensions\n\nRun in your terminal:\n\n```bash\ncode --install-extension enkia.tokyo-night\ncode --install-extension illixion.vscode-vibrancy-continued\ncode --install-extension pkief.material-icon-theme\n```\n\n### Step 2: Remove the Blurry Neon Glow in Vibrancy's Tokyo Night Storm CSS (Optional but Recommended)\n\nStrip the `text-shadow` glow rule from the extension's theme stylesheet before loading Vibrancy:\n\n```bash\npython3 - <<'EOF'\nimport glob, re\n\nfor path in glob.glob(\"/Users/*/.vscode/extensions/illixion.vscode-vibrancy-continued-*/themes/Tokyo Night Storm.css\"):\n    with open(path, \"r\") as f:\n        css = f.read()\n    cleaned = re.sub(r\"\\.mtk4,\\.mtk9\\.mtk10[^{]*\\{[^}]*\\}\\s*\", \"\", css)\n    with open(path, \"w\") as f:\n        f.write(cleaned)\n    print(f\"Cleaned neon text-shadow in: {path}\")\nEOF\n```\n\n### Step 3: Apply `settings.json`\n\nOpen `~/Library/Application Support/Code/User/settings.json` (<kbd>⌘</kbd>+<kbd>Shift</kbd>+<kbd>P</kbd> → **Preferences: Open User Settings (JSON)**) and include:\n\n```json\n{\n  \"editor.fontSize\": 16,\n  \"editor.lineHeight\": 24,\n  \"editor.minimap.enabled\": false,\n  \"editor.stickyScroll.enabled\": true,\n  \"editor.bracketPairColorization.enabled\": true,\n  \"editor.guides.bracketPairs\": true,\n  \"editor.cursorBlinking\": \"smooth\",\n  \"editor.cursorSmoothCaretAnimation\": \"on\",\n  \"editor.smoothScrolling\": true,\n  \"workbench.colorTheme\": \"Tokyo Night Storm\",\n  \"workbench.iconTheme\": \"material-icon-theme\",\n  \"window.titleBarStyle\": \"custom\",\n  \"window.systemColorTheme\": \"dark\",\n  \"window.autoDetectColorScheme\": false,\n  \"vscode_vibrancy.theme\": \"Tokyo Night Storm\",\n  \"vscode_vibrancy.type\": \"under-window\",\n  \"vscode_vibrancy.opacity\": 0.42,\n  \"vscode_vibrancy.backgroundOverride\": \"#181F31\",\n  \"vscode_vibrancy.preventFlash\": true,\n  \"terminal.integrated.fontSize\": 16,\n  \"terminal.integrated.defaultProfile.osx\": \"zsh\",\n  \"terminal.integrated.cursorStyle\": \"line\",\n  \"terminal.integrated.lineHeight\": 1.25,\n  \"terminal.integrated.cursorBlinking\": true,\n  \"terminal.integrated.gpuAcceleration\": \"off\",\n  \"workbench.colorCustomizations\": {\n    \"terminal.background\": \"#00000000\",\n    \"editorPane.background\": \"#181f3100\",\n    \"editorGroupHeader.tabsBackground\": \"#181f3100\",\n    \"editorGroupHeader.noTabsBackground\": \"#181f3100\",\n    \"breadcrumb.background\": \"#181f3100\",\n    \"editorGutter.background\": \"#181f3100\",\n    \"panel.background\": \"#181f3100\",\n    \"tab.activeBackground\": \"#181f3100\",\n    \"tab.unfocusedActiveBackground\": \"#181f3100\",\n    \"sideBar.background\": \"#181f316b\",\n    \"sideBarTitle.background\": \"#181f316b\",\n    \"activityBar.background\": \"#181f316b\",\n    \"editor.background\": \"#181f316b\",\n    \"tab.inactiveBackground\": \"#181f316b\",\n    \"tab.unfocusedInactiveBackground\": \"#181f316b\",\n    \"editorStickyScroll.background\": \"#181f31bf\",\n    \"editorStickyScrollGutter.background\": \"#181f31bf\",\n    \"sideBarStickyScroll.background\": \"#181f31bf\",\n    \"panelStickyScroll.background\": \"#181f31bf\",\n    \"terminalStickyScroll.background\": \"#181f31bf\",\n    \"minimap.background\": \"#181f31bf\",\n    \"inlineChat.background\": \"#181f31e6\",\n    \"editorWidget.background\": \"#181f31e6\",\n    \"editorHoverWidget.background\": \"#181f31e6\",\n    \"editorSuggestWidget.background\": \"#181f31e6\",\n    \"notifications.background\": \"#181f31e6\",\n    \"notificationCenterHeader.background\": \"#181f31e6\",\n    \"menu.background\": \"#181f31e6\",\n    \"quickInput.background\": \"#181f31e6\",\n    \"editor.lineHighlightBorder\": \"#00000000\"\n  }\n}\n```\n\n### Step 4: Activate Vibrancy in VS Code\n\n1. If macOS blocks VS Code from patching itself (`EROFS: read-only file system`), clear App Translocation quarantine first:\n   ```bash\n   sudo xattr -dr com.apple.quarantine \"/Applications/Visual Studio Code.app\"\n   ```\n2. Inside VS Code, press <kbd>⌘</kbd>+<kbd>Shift</kbd>+<kbd>P</kbd> (or <kbd>F1</kbd>) → run **`Reload Vibrancy`**.\n3. Click **Restart** when prompted.\n","color":"#9ECE6A","backlinks":["dev-tools/agy-cli-permissions.md","dev-tools/index.md","dev-tools/macos-terminal-tokyo-glass.md","index.md","log.md"]},{"id":"inbox.md","title":"Quick Capture Inbox","subtitle":"Unstructured scratchpad for raw ideas & links","type":"inbox","description":"Scratchpad for quick thoughts, links, and rough ideas.","updated":"2026-11-07","tags":["inbox","workflow"],"headings":[],"sections":[{"level":1,"title":"Overview","slug":"","text":"# Inbox (Scratchpad) Type anything here without worrying about formatting! Whenever you're ready, just tell your AI: **\"Organize my inbox into notes.\"** --- - Write your first thought or paste a link here..."}],"body":"\n# Inbox (Scratchpad)\n\nType anything here without worrying about formatting!\nWhenever you're ready, just tell your AI: **\"Organize my inbox into notes.\"**\n\n---\n\n- Write your first thought or paste a link here...\n","color":"#FF9E64","backlinks":["AGENTS.md","index.md","log.md","notes/how-to-use-this.md"]},{"id":"index.md","title":"My Second Brain","subtitle":"OKF Knowledge Index","type":"index","description":"Simple Second Brain powered by Google Open Knowledge Format (OKF), Developer Docs, and an Interactive Mind Map.","updated":"","tags":[],"headings":[{"level":2,"text":"Quick Capture","slug":"quick-capture"},{"level":2,"text":"Dev Tools","slug":"dev-tools"},{ ","title":"Second Brain Quickstart","subtitle":"How to capture notes, search, and explore the Mind Map","type":"note","description":"A 1-minute plain-English guide to using your Second Brain with AI, Developer Docs, and the interactive Mind Map.","updated":"2026-11-07","tags":["guide","workflow","mind-map"],"headings":[{"level":2,"text":"1. Let the AI Do the Work (Easiest)","slug":"1-let-the-ai-do-the-work-easiest"},{"level":2,"text":"2. Browse Your Developer Docs & Mind Map","slug":"2-browse-your-developer-docs-mind-map"},{"level":2,"text":"3. Write Notes Yourself","slug":"3-write-notes-yourself"}],"sections":[{"level":1,"title":"Overview","slug":"","text":"# How to Use This Second Brain You don't need any complicated VS Code extensions or rules. Everything here is plain Markdown organized as a clean tree."},{"level":2,"title":"1. Let the AI Do the Work (Easiest)","slug":"1-let-the-ai-do-the-work-easiest","text":"Just ask me in chat: - *\"Add a note about [topic]\"* - *\"Summarize this article/code into a note\"* - *\"Organize my [Inbox](../inbox.md) into clean notes\"* I automatically create the note in `notes/`, add the [Google OKF](./open-knowledge-format.md) header, link it inside [`index.md`](../index.md), and update your Mind Map."},{"level":2,"title":"2. Browse Your Developer Docs & Mind Map","slug":"2-browse-your-developer-docs-mind-map","text":"Run this command anytime (or ask me to open it): ```bash /usr/local/bin/node scripts/export-graph.mjs && open /tmp/okf-foam-graph.html ``` - **Left Sidebar:** Search and jump to any note like real developer documentation. - **Center Docs Pane:** Read your notes with clickable links between pages. - **Interactive Mind Map:** Expand or collapse (`+` / `-`) branches from `My Second Brain` → `Sections` → `Notes` → `Headings inside each note`."},{"level":2,"title":"3. Write Notes Yourself","slug":"3-write-notes-yourself","text":"If you want to write by hand, just type in [`inbox.md`](../inbox.md) or create a `.md` file inside `notes/`."}],"body":"\n# How to Use This Second Brain\n\nYou don't need any complicated VS Code extensions or rules. Everything here is plain Markdown organized as a clean tree.\n\n## 1. Let the AI Do the Work (Easiest)\n\nJust ask me in chat:\n- *\"Add a note about [topic]\"*\n- *\"Summarize this article/code into a note\"*\n- *\"Organize my [Inbox](../inbox.md) into clean notes\"*\n\nI automatically create the note in `notes/`, add the [Google OKF](./open-knowledge-format.md) header, link it inside [`index.md`](../index.md), and update your Mind Map.\n\n## 2. Browse Your Developer Docs & Mind Map\n\nRun this command anytime (or ask me to open it):\n```bash\n/usr/local/bin/node scripts/export-graph.mjs && open /tmp/okf-foam-graph.html\n```\n- **Left Sidebar:** Search and jump to any note like real developer documentation.\n- **Center Docs Pane:** Read your notes with clickable links between pages.\n- **Interactive Mind Map:** Expand or collapse (`+` / `-`) branches from `My Second Brain` → `Sections` → `Notes` → `Headings inside each note`.\n\n## 3. Write Notes Yourself\n\nIf you want to write by hand, just type in [`inbox.md`](../inbox.md) or create a `.md` file inside `notes/`.\n","color":"#7AA2F7","backlinks":["index.md","log.md","notes/open-knowledge-format.md"]},{"id":"notes/open-knowledge-format.md","title":"Google Open Knowledge Format","subtitle":"Progressive disclosure tree for AI agents (OKF v0.2)","type":"concept","description":"How Google's Open Knowledge Format structures Markdown files as a progressive tree for AI agents and Mind Maps.","updated":"2026-11-07","tags":["okf","ai-agents","mind-map"],"headings":[{"level":2,"text":"Progressive Disclosure Tree","slug":"progressive-disclosure-tree"},{"level":2,"text":"Why It Scales","slug":"why-it-scales"}],"sections":[{"level":1,"title":"Overview","slug":"","text":"# What is Google OKF? **Google's Open Knowledge Format (OKF v0.2)** is a simple standard for organizing Markdown files so AI agents never get lost."},{"level":2,"title":"Progressive Disclosure Tree","slug":"progressive-disclosure-tree","text":"Instead of a messy spiderweb of links, OKF organizes knowledge like a **Mind Map tree**: - **Root ([`index.md`](../index.md)):** The table of contents listing your topics and notes with one-sentence summaries. - **Typed Notes (`notes/*.md`):** Each note has a small YAML header (`type`, `title`, `description`, `updated`) and clean `##` headings. - **Change Log ([`log.md`](../log.md)):** Automatic history maintained by your AI agent."},{"level":2,"title":"Why It Scales","slug":"why-it-scales","text":"- **For AI Agents:** The AI reads [`index.md`](../index.md) first and drills down only into the branch it needs, saving tokens and avoiding confusion. - **For Humans:** The exact same tree renders as a collapsible **Mind Map** and clean **Developer Docs** (see [How to Use This Second Brain](./how-to-use-this.md))."}],"body":"\n# What is Google OKF?\n\n**Google's Open Knowledge Format (OKF v0.2)** is a simple standard for organizing Markdown files so AI agents never get lost.\n\n## Progressive Disclosure Tree\n\nInstead of a messy spiderweb of links, OKF organizes knowledge like a **Mind Map tree**:\n- **Root ([`index.md`](../index.md)):** The table of contents listing your topics and notes with one-sentence summaries.\n- **Typed Notes (`notes/*.md`):** Each note has a small YAML header (`type`, `title`, `description`, `updated`) and clean `##` headings.\n- **Change Log ([`log.md`](../log.md)):** Automatic history maintained by your AI agent.\n\n## Why It Scales\n\n- **For AI Agents:** The AI reads [`index.md`](../index.md) first and drills down only into the branch it needs, saving tokens and avoiding confusion.\n- **For Humans:** The exact same tree renders as a collapsible **Mind Map** and clean **Developer Docs** (see [How to Use This Second Brain](./how-to-use-this.md)).\n","color":"#9ECE6A","backlinks":["index.md","log.md","notes/how-to-use-this.md"]}],"links":[{
