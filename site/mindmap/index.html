s\n\nfunction computeTreeLayout(root) {\n  visibleNodes = [];\n  visibleLinks = [];\n  let leafIndex = 0;\n\n  function measure(node, depth) {\n    node.depth = depth;\n    // Calculate node dimensions based on text length\n    const titleW = ctx.measureText(node.label).width;\n    const subW = ctx.measureText(node.subtitle || '').width;\n    node.w = Math.min(246, Math.max(154, Math.max(titleW, subW) + 38));\n    node.h = node.sublabel === 'section' ? 34 : 52;\n    node.x = depth * LEVEL_X_GAP;\n\n    const hasKids = node.children && node.children.length > 0;\n    if (!hasKids || node.collapsed) {\n      // Leaf node or folded branch gets sequential leaf Y slot\n      node.y = leafIndex * LEAF_Y_GAP;\n      leafIndex++;\n    } else {\n      // Recurse children and position parent vertically centered between first and last child\n      for (const child of node.children) {\n        measure(child, depth + 1);\n        visibleLinks.push({ source: node, target: child });\n      }\n      node.y = (node.children[0].y + node.children[node.children.length - 1].y) / 2;\n    }\n    visibleNodes.push(node);\n  }\n\n  measure(root, 0);\n  const rootY = root.y;\n  for (const n of visibleNodes) n.y -= rootY; // Normalize tree relative to root\n}\n```\n\n#### Cubic Bezier Connector Math:\nLinks between parent nodes and child cards are rendered with cubic Bezier curves matching the branch's architectural color palette:\n```javascript\nconst startX = s.x + s.w + (s.children?.length ? 22 : 0);\nconst startY = s.y;\nconst endX = t.x;\nconst endY = t.y;\nconst midX = (startX + endX) / 2;\n\nctx.beginPath();\nctx.moveTo(startX, startY);\nctx.bezierCurveTo(midX, startY, midX, endY, endX, endY);\nctx.strokeStyle = isHighlighted ? accent.bar : accent.edge;\nctx.lineWidth = isHighlighted ? 2.1 : 1.4;\nctx.stroke();\n```\n\n---\n\n### 7.4 Force-Directed Semantic Graph Physics Engine (`stepForceGraph`)\nThe full-screen semantic graph calculates real-time physics using an n-body force simulation:\n\n```javascript\nfunction stepForceGraph() {\n  // 1. Coulomb Repulsion (All node pairs repel each other inversely by distance squared)\n  for (let i = 0; i < graphNodes.length; i++) {\n    for (let j = i + 1; j < graphNodes.length; j++) {\n      const a = graphNodes[i], b = graphNodes[j];\n      let dx = b.gx - a.gx, dy = b.gy - a.gy;\n      let distSq = dx * dx + dy * dy + 1;\n      let dist = Math.sqrt(distSq);\n      let f = 11500 / distSq; // Repulsion constant = 11,500\n      a.vx -= (dx / dist) * f; a.vy -= (dy / dist) * f;\n      b.vx += (dx / dist) * f; b.vy += (dy / dist) * f;\n    }\n  }\n\n  // 2. Hooke's Law Spring Attraction (Connected nodes pull toward rest distance 165px)\n  for (const l of data.links) {\n    const a = nodeById.get(l.source), b = nodeById.get(l.target);\n    if (!a || !b) continue;\n    let dx = b.gx - a.gx, dy = b.gy - a.gy;\n    let dist = Math.sqrt(dx * dx + dy * dy) || 1;\n    let f = (dist - 165) * 0.045; // Spring constant = 0.045\n    a.vx += (dx / dist) * f; a.vy += (dy / dist) * f;\n    b.vx -= (dx / dist) * f; b.vy -= (dy / dist) * f;\n  }\n\n  // 3. Central Gravitational Pull and Velocity Damping\n  for (const n of graphNodes) {\n    if (n === draggingGraphNode) continue;\n    // index.md experiences stronger center gravity to anchor the visualization\n    const pull = n.id === 'index.md' ? 0.08 : 0.012;\n    n.vx += (0 - n.gx) * pull;\n    n.vy += (0 - n.gy) * pull;\n    n.vx *= 0.78; // Velocity damping factor (78% retained per frame)\n    n.vy *= 0.78;\n    n.gx += n.vx;\n    n.gy += n.vy;\n  }\n}\n```\n\n---\n\n### 7.5 Search Engine & Offline Fallback Architecture\nThe search palette (`Cmd+K` / `Ctrl+K`) operates in two distinct modes:\n\n1. **CDN Mode (`MiniSearch`):** When the CDN script loads successfully, an in-memory index is constructed across `docTitle`, `sectionTitle`, `text`, and `tagsStr` with fuzzy matching (`fuzzy: 0.2`), prefix matching (`prefix: true`), and title weighting (`boost: { docTitle: 3, sectionTitle: 2 }`).\n2. **Offline Fallback Mode:** If the user is offline or air-gapped, `runSpotlightSearch()` executes a native multi-field substring search across all node titles, subtitles, descriptions, `#tags`, and section paragraphs. Matching substrings are safely highlighted using `<mark>` tags via `highlightText(text, query)`.\n\n---\n\n### 7.6 Code Highlighting & 12-Token Semantic Tokenizer\nWhen `highlight.js` CDN is unreachable, the portal uses `highlightLineTokens(rawLine, lang)` to tokenize code blocks into 12 semantic CSS classes:\n- `tok-com`: Comments (`# ...` in Bash/Python/YAML, `// ...` in JS/TS).\n- `tok-str`: Quoted string literals (`\"...\"`, `'...'`).\n- `tok-key`: Object keys and YAML properties (`\"key\":` or `key:`).\n- `tok-kw`: Reserved keywords (`export`, `const`, `function`, `return`, `import`).\n- `tok-fn`: Invoked function names (`myFunction(...)`).\n- `tok-builtin`: System built-ins (`process`, `console`, `Math`, `JSON`).\n- `tok-bool`: Boolean literals (`true`, `false`, `null`).\n- `tok-cmd`: Terminal command binaries (`npm`, `git`, `node`, `open`, `mkdir`).\n- `tok-flag`: CLI flags (`-v`, `--recursive`, `-p`).\n- `tok-num`: Numeric literals (`0`, `123`, `0.78`).\n- `tok-var`: Variable expansions (`$VAR`, `${VAR}`).\n- `tok-op`: Operators and punctuation (`=`, `=>`, `:`, `;`).\n\n---\n\n## 8. Step-by-Step \"How an AI Agent Can Rebuild This Entire System From Scratch\" Blueprint\n\nIf an autonomous AI coding agent is initialized inside an **empty directory** with only `ARCHITECTURE.md` and `AGENTS.md`, it can deterministically reconstruct the entire working Second Brain repository by executing the four phases below.\n\n### Phase 1: OKF Directory & Frontmatter Scaffolding\n1. **Initialize Git Repository:**\n   ```bash\n   git init\n   ```\n2. **Create Reserved Root Files:**\n   - Create [`index.md`](./index.md):\n     ```yaml\n     ---\n     okf_version: \"0.2\"\n     title: \"Second Brain\"\n     description: \"AI-native personal knowledge base and static documentation portal.\"\n     ---\n\n     # Second Brain\n\n     A developer knowledge engine built on Google's Open Knowledge Format.\n\n     ## Topics\n\n     - [Onboarding](./onboarding/index.md) - Guides and checklists for new contributors.\n     - [Runbooks](./runbooks/index.md) - Operational playbooks and deployment procedures.\n     - [Decisions](./decisions/index.md) - Architecture Decision Records (ADRs).\n     - [Reference](./reference/index.md) - Technical specifications and glossaries.\n     - [Dev Tools](./dev-tools/index.md) - Local CLI setups and environment configs.\n     ```\n   - Create [`inbox.md`](./inbox.md):\n     ```yaml\n     ---\n     type: inbox\n     title: \"Quick Capture\"\n     subtitle: \"Scratchpad & raw ideas\"\n     description: \"Unstructured thoughts awaiting review and promotion.\"\n     tags: [inbox]\n     updated: YYYY-MM-DD\n     ---\n\n     # Quick Capture\n     ```\n   - Create [`log.md`](./log.md):\n     ```markdown\n     # Change Log (`log.md`)\n\n     *(Maintained automatically by AI — you never need to edit this file manually.)*\n\n     ## YYYY-MM-DD\n\n     - **[init]** Initialized repository structure and core documentation.\n     ```\n3. **Scaffold Topic Folders:**\n   - For each topic (`onboarding`, `runbooks`, `decisions`, `reference`, `dev-tools`), create `<topic>/index.md` containing **NO YAML frontmatter**, a top-level `# Heading`, a one-line description, and a `## Notes` section.\n   - Populate content notes (`<topic>/<slug>.md`) with valid YAML frontmatter declaring `type`, `title`, `subtitle`, `description`, `tags`, and `updated: YYYY-MM-DD`.\n\n---\n\n### Phase 2: Implement the Validator (`scripts/validate-okf.mjs`)\n1. Create directory `scripts/`.\n2. Write `scripts/validate-okf.mjs` using only `node:fs` and `node:path`:\n   - Set up `IGNORED_DIRS = new Set(['.git', '.github', '.vscode', '.foam', 'node_modules', 'scripts', 'site', 'dist', 'assets', 'videos'])`.\n   - Implement `parseFrontmatter(content)`: detect `^---\\r?\\n`, locate next `\\n---`, parse key-value lines into a plain object.\n   - Implement `walkMarkdownFiles(dir)`: recursively scan for `.md` files outside `IGNORED_DIRS`.\n   - Implement `validateLinks(filePath, content)`: strip fenced code blocks and inline code spans; extract Markdown links; skip external URLs (`http`, `mailto`) and anchor tags (`#`); resolve relative paths; verify `fs.existsSync(resolvedPath)`.\n   - Verify root `index.md` has `okf_version` and no `type`.\n   - Verify subfolder `index.md` files have no frontmatter.\n   - Verify `log.md` has no `type`.\n   - Verify all content notes have `type`, `title`, and `description`.\n   - Exit with `process.exit(1)` if `errors > 0`.\n3. Test validator execution:\n   ```bash\n   node scripts/validate-okf.mjs\n   ```\n\n---\n\n### Phase 3: Implement the Static Compiler (`scripts/export-graph.mjs`)\n1. Write `scripts/export-graph.mjs` using only `node:fs` and `node:path`:\n   - Parse all `.md` files into node objects with YAML metadata, headings, and section-level text paragraphs.\n   - Set `GRAPH_EXCLUDED = new Set(['log.md'])`. Exclude `log.md` from directed edges and incoming backlinks.\n   - Construct `links` array from relative links between notes.\n   - Build `mindMapByFolder` and `mindMapByTag` tree objects with `collapsed: true` on all branch nodes.\n   - Bundle all parsed objects into `bundleData`.\n2. Embed the UI Application Shell:\n   - Construct the HTML string containing:\n     - Topbar with Search trigger, view switcher (`Split | Mind Map | Graph | Docs`), and theme toggle.\n     - Collapsible left navigation sidebar (`aside#sidebar`).\n     - Split content area (`div#content-split`) containing Markdown doc reader (`main#doc-pane`), interactive drag-splitter (`div#resizer-viz`), and Visualizer canvas pane (`div#viz-pane`).\n     - Slide-over reader panel styles (`.content-split.peek main.doc-pane`).\n     - Canvas rendering engine with `computeTreeLayout()` and `stepForceGraph()`.\n     - Inlined JSON bundle: `const data = ${JSON.stringify(bundleData)};`.\n     - Search modal with `MiniSearch` and built-in substring fallback.\n     - Theme engine managing `data-theme=\"paper|light|dark\"`.\n3. Emit Distribution Files:\n   - Ensure `site/`, `site/graph/`, and `site/mindmap/` directories exist.\n   - Write `site/index.html` with default view `'split'`.\n   - Write `site/graph/index.html` with default view `'graph'`.\n   - Write `site/mindmap/index.html` with default view `'mindmap'`.\n   - Write `/tmp/okf-foam-graph.html` for instant macOS preview.\n4. Test compiler execution:\n   ```bash\n   node scripts/export-graph.mjs\n   ```\n\n---\n\n### Phase 4: Configure CI/CD Deployment (`.github/workflows/deploy.yml`)\nCreate `.github/workflows/deploy.yml` with automated deployment permissions:\n```yaml\nname: Deploy Second Brain to GitHub Pages\n\non:\n  push:\n    branches:\n      - main\n  workflow_dispatch:\n\npermissions:\n  contents: read\n  pages: write\n  id-token: write\n\nconcurrency:\n  group: \"pages\"\n  cancel-in-progress: false\n\njobs:\n  build-and-deploy:\n    environment:\n      name: github-pages\n      url: ${{ steps.deployment.outputs.page_url }}\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout repository\n        uses: actions/checkout@v4\n\n      - name: Setup Node.js\n        uses: actions/setup-node@v4\n        with:\n          node-version: 20\n\n      - name: Validate OKF & Build Site\n        run: |\n          node scripts/validate-okf.mjs\n          node scripts/export-graph.mjs\n\n      - name: Setup Pages\n        uses: actions/configure-pages@v5\n\n      - name: Upload Pages artifact\n        uses: actions/upload-pages-artifact@v3\n        with:\n          path: site/\n\n      - name: Deploy to GitHub Pages\n        id: deployment\n        uses: actions/deploy-pages@v4\n```\n\n---\n\n## 9. Operational Verification\n\nTo confirm that the Second Brain system is operating at 100% compliance:\n\n```bash\n# Run both validation and compilation in sequence:\nnode scripts/validate-okf.mjs && node scripts/export-graph.mjs\n```\n\n**Passing Criteria:**\n- `validate-okf.mjs` outputs `0 errors` and `0 warnings`.\n- `export-graph.mjs` emits all static HTML bundles in under 50ms.\n- All internal Markdown relative links resolve to real files on disk.\n","color":"#57534e","backlinks":["AGENTS.md","index.md"],"inGraph":true},{"id":"decisions/adr-001-okf-markdown-knowledge-base.md","title":"ADR-001: OKF Markdown as Our Knowledge Base","subtitle":"Accepted · plain Markdown + OKF + generated site","type":"decision","group":null,"description":"Why team knowledge lives in plain Markdown organized with Google's Open Knowledge Format, published as a static docs site.","updated":"2026-11-08","tags":["adr","okf","ai-agents"],"headings":[{"level":2,"text":"Context","slug":"context"},{"level":2,"text":"Options considered","slug":"options-considered"},{"level":2,"text":"Decision","slug":"decision"},{"level":2,"text":"Consequences","slug":"consequences"}],"sections":[{"level":1,"title":"Overview","slug":"","text":"# ADR-001: OKF Markdown as Our Knowledge Base **Status:** Accepted"},{"level":2,"title":"Context","slug":"context","text":"Knowledge was spread across personal notes, chat threads, and people's memory. New teammates could not find it, and AI agents could not use it at all. We wanted one place that: - people can browse and search like documentation, - AI agents can read without loading everything into context, - is versioned and reviewed like code."},{"level":2,"title":"Options considered","slug":"options-considered","text":"| Option | Why not | |---|---| | Wiki or Notion | Hard for agents to read; edits are not reviewed like code | | Obsidian vault only | Great for one person; no shared, published site | | MkDocs / Docusaurus only | Great site; no graph or mind map, and no rules for agents | | **Markdown + OKF + generated site** | Chosen |"},{"level":2,"title":"Decision","slug":"decision","text":"Keep all knowledge as Markdown files in Git, organized with the [Open Knowledge Format](../reference/open-knowledge-format.md): - a root `index.md`, one folder per topic, each with its own `index.md`, - YAML frontmatter on every note (`type`, `title`, `description`, `updated`), - [AGENTS.md](../AGENTS.md) rules so AI agents maintain the structure, - a generated site (docs, graph, mind map, search) deployed on every push."},{"level":2,"title":"Consequences","slug":"consequences","text":"- **Good:** one source of truth for people and agents; changes are reviewed in pull requests; no vendor lock-in. - **Cost:** every note needs frontmatter and an index entry. The [validator](../onboarding/contributor-checklist.md) catches mistakes, and agents do most of this work. - **Follow-up:** deploys are documented in the [deploy runbook](../runbooks/deploy-docs-site.md)."}],"body":"\n# ADR-001: OKF Markdown as Our Knowledge Base\n\n**Status:** Accepted\n\n## Context\n\nKnowledge was spread across personal notes, chat threads, and people's memory. New teammates could not find it, and AI agents could not use it at all. We wanted one place that:\n\n- people can browse and search like documentation,\n- AI agents can read without loading everything into context,\n- is versioned and reviewed like code.\n\n## Options considered\n\n| Option | Why not |\n|---|---|\n| Wiki or Notion | Hard for agents to read; edits are not reviewed like code |\n| Obsidian vault only | Great for one person; no shared, published site |\n| MkDocs / Docusaurus only | Great site; no graph or mind map, and no rules for agents |\n| **Markdown + OKF + generated site** | Chosen |\n\n## Decision\n\nKeep all knowledge as Markdown files in Git, organized with the [Open Knowledge Format](../reference/open-knowledge-format.md):\n\n- a root `index.md`, one folder per topic, each with its own `index.md`,\n- YAML frontmatter on every note (`type`, `title`, `description`, `updated`),\n- [AGENTS.md](../AGENTS.md) rules so AI agents maintain the structure,\n- a generated site (docs, graph, mind map, search) deployed on every push.\n\n## Consequences\n\n- **Good:** one source of truth for people and agents; changes are reviewed in pull requests; no vendor lock-in.\n- **Cost:** every note needs frontmatter and an index entry. The [validator](../onboarding/contributor-checklist.md) catches mistakes, and agents do most of this work.\n- **Follow-up:** deploys are documented in the [deploy runbook](../runbooks/deploy-docs-site.md).\n","color":"#57534e","backlinks":["AGENTS.md","ARCHITECTURE.md","decisions/index.md","reference/glossary.md","reference/open-knowledge-format.md","runbooks/deploy-docs-site.md"],"inGraph":true},{"id":"decisions/index.md","title":"Decisions","subtitle":"OKF Knowledge Index","type":"index","group":null,"description":"OKF Knowledge Index","updated":"","tags":[],"headings":[],"sections":[{"level":1,"title":"Overview","slug":"","text":"# Decisions Architecture Decision Records (ADRs): short notes that capture a choice, the options considered, and why. Write one whenever a decision would otherwise live only in someone's head or a chat thread. - [ADR-001: OKF Markdown as Our Knowledge Base](./adr-001-okf-markdown-knowledge-base.md) - Why team knowledge lives in plain Markdown organized with Google's Open Knowledge Format."}],"body":"# Decisions\n\nArchitecture Decision Records (ADRs): short notes that capture a choice, the options considered, and why. Write one whenever a decision would otherwise live only in someone's head or a chat thread.\n\n- [ADR-001: OKF Markdown as Our Knowledge Base](./adr-001-okf-markdown-knowledge-base.md) - Why team knowledge lives in plain Markdown organized with Google's Open Knowledge Format.\n","color":"#1c1917","backlinks":["AGENTS.md","index.md"],"inGraph":true},{"id":"dev-tools/index.md","title":"Dev Tools","subtitle":"OKF Knowledge Index","type":"index","group":null,"description":"OKF Knowledge Index","updated":"","tags":[],"headings":[{"level":2,"text":"Concepts","slug":"concepts"}],"sections":[{"level":1,"title":"Overview","slug":"","text":"# Dev Tools Concept guides, configurations, and copy-paste prompts for replicating local development environments on any Mac."},{"level":2,"title":"Concepts","slug":"concepts","text":"- [macOS Terminal TokyoGlass](./macos-terminal-tokyo-glass.md) - Concept breakdown, step-by-step script, and AI prompt to replicate the `TokyoGlass16_5` frosted-glass macOS Terminal profile. - [VS Code Tokyo Night Glass](./tokyo-night-storm.md) - Concept breakdown, step-by-step setup, and AI prompt to replicate the Tokyo Night Storm frosted-glass theme in VS Code."}],"body":"# Dev Tools\n\nConcept guides, configurations, and copy-paste prompts for replicating local development environments on any Mac.\n\n## Concepts\n\n- [macOS Terminal TokyoGlass](./macos-terminal-tokyo-glass.md) - Concept breakdown, step-by-step script, and AI prompt to replicate the `TokyoGlass16_5` frosted-glass macOS Terminal profile.\n- [VS Code Tokyo Night Glass](./tokyo-night-storm.md) - Concept breakdown, step-by-step setup, and AI prompt to replicate the Tokyo Night Storm frosted-glass theme in VS Code.\n","color":"#1c1917","backlinks":["AGENTS.md","index.md"],"inGraph":true},{"id":"dev-tools/macos-terminal-tokyo-glass.md","title":"macOS Terminal TokyoGlass","subtitle":"Frosted-glass Terminal.app profile (TokyoGlass16_5)","type":"concept","group":"Themes","description":"Step-by-step concept guide and reusable AI prompt to replicate the custom TokyoGlass16_5 frosted-glass macOS Terminal profile on any Mac.","updated":"2026-11-07","tags":["macos","terminal","tokyo-night","glass","ai-prompt"],"headings":[{"level":2,"text":"1. Concept: How the Frosted Glass Terminal Works","slug":"1-concept-how-the-frosted-glass-terminal-works"},{"level":2,"text":"2. Copy-Paste AI Prompt (Replicate on Any Mac)","slug":"2-copy-paste-ai-prompt-replicate-on-any-mac"},{"level":2,"text":"3. Step-by-Step Manual / Scripted Replication","slug":"3-step-by-step-manual-scripted-replication"},{"level":3,"text":"Step 1: Run the Self-Contained Installer Script","slug":"step-1-run-the-self-contained-installer-script"},{"level":3,"text":"Step 2: Export or Import as a .terminal File (Alternative)","slug":"step-2-export-or-import-as-a-terminal-file-alternative"}],"sections":[{"level":1,"title":"Overview","slug":"","text":"# macOS Terminal TokyoGlass Setup (`TokyoGlass16_5`) This concept documents how the **`TokyoGlass16_5`** macOS `Terminal.app` profile works under the hood, along with a **copy-paste AI prompt** and **step-by-step instructions** to replicate the exact frosted Tokyo Night glass terminal on any Mac. Related: [VS Code Tokyo Night Storm Glass Setup](./tokyo-night-storm.md) · [Second Brain Index](../index.md) ---"},{"level":2,"title":"1. Concept: How the Frosted Glass Terminal Works","slug":"1-concept-how-the-frosted-glass-terminal-works","text":"macOS `Terminal.app` stores custom profiles in `~/Library/Preferences/com.apple.Terminal.plist` under the `\"Window Settings\"` dictionary. Each color and font property is serialized as a binary `NSKeyedArchiver` (`NSColor` / `NSFont`) blob. The **`TokyoGlass16_5`** aesthetic is built from four pillars: 1. **Frosted Dark Navy Glass Backdrop** - **Background RGB**: `0.086, 0.102, 0.157` (`#161A28`) - **Background Opacity (Alpha)**: `0.60` (60% opacity / 40% translucency) - **Active Window Blur (`BackgroundBlur`)**: `0.65` (65% Gaussian blur via macOS WindowServer) - **Inactive Window Blur (`BackgroundBlurInactive`)**: `0.0` (`BackgroundSettingsForInactiveWindows: false`) 2. **Typography & Geometry** - **Font**: `SFMonoTerminal-Regular` (`16pt`, antialiased) - **Line Height (`FontHeightSpacing`)**: `1.12` - **Character Width (`FontWidthSpacing`)**: `1.01` - **Window Grid**: `120` columns × `30` rows 3. **Cursor, Text & Selection** - **Normal Text (`TextColor`)**: `#D8E0F1` (`0.847, 0.878, 0.945`) - **Bold Text (`TextBoldColor`)**: `#F1F6FF` (`0.945, 0.965, 1.000`) - **Cursor**: Blinking vertical bar (`CursorType: 2`, `CursorBlink: true`) in Sky Cyan `#7DCFFF` (`0.490, 0.812, 1.000`) - **Selection (`SelectionColor`)**: `#374E79` at `0.75` alpha (`0.215, 0.305, 0.475, 0.75`) - **Input & Bell**: `useOptionAsMetaKey: true`, `Bell: false`, `VisualBell: false`, `ShowWindowSettingsNameInTitle: false` 4. **16-Color Tokyo Night ANSI Palette** | ANSI Slot | Hex | Normalized `NSRGB` (`R G B`) | | :--- | :--- | :--- | | **Black** (`ANSIBlackColor`) | `#252A3C` | `0.145 0.165 0.235` | | **Bright Black** (`ANSIBrightBlackColor`) | `#565F7E` | `0.337 0.373 0.494` | | **Red** (`ANSIRedColor`) | `#F7768E` | `0.969 0.463 0.557` | | **Bright Red** (`ANSIBrightRedColor`) | `#FF94A8` | `1.000 0.580 0.659` | | **Green** (`ANSIGreenColor`) | `#9ECE6A` | `0.620 0.808 0.416` | | **Bright Green** (`ANSIBrightGreenColor`) | `#B3E285` | `0.702 0.886 0.522` | | **Yellow** (`ANSIYellowColor`) | `#E0AF68` | `0.878 0.686 0.408` | | **Bright Yellow** (`ANSIBrightYellowColor`) | `#F2CB8A` | `0.949 0.796 0.541` | | **Blue** (`ANSIBlueColor`) | `#7AA2F7` | `0.478 0.635 0.969` | | **Bright Blue** (`ANSIBrightBlueColor`) | `#91B9FF` | `0.569 0.725 1.000` | | **Magenta** (`ANSIMagentaColor`) | `#BB9AF7` | `0.733 0.604 0.969` | | **Bright Magenta** (`ANSIBrightMagentaColor`) | `#D0B4FF` | `0.816 0.706 1.000` | | **Cyan** (`ANSICyanColor`) | `#7DCFFF` | `0.490 0.812 1.000` | | **Bright Cyan** (`ANSIBrightCyanColor`) | `#9BE2FF` | `0.608 0.886 1.000` | | **White** (`ANSIWhiteColor`) | `#C0CAF5` | `0.753 0.792 0.898` | | **Bright White** (`ANSIBrightWhiteColor`) | `#F1F6FF` | `0.945 0.965 1.000` | ---"},{"level":2,"title":"2. Copy-Paste AI Prompt (Replicate on Any Mac)","slug":"2-copy-paste-ai-prompt-replicate-on-any-mac","text":"Paste the block below into any terminal AI coding agent on a new Mac to automatically create and activate the `TokyoGlass16_5` profile: ```text Configure my macOS Terminal.app with a custom profile named \"TokyoGlass16_5\" and set it as both the Default and Startup Window Settings in ~/Library/Preferences/com.apple.Terminal.plist. Use these exact specifications: 1. Glass & Window: - BackgroundColor: NSRGB \"0.086 0.102 0.157 0.6\" (#161A28 at 60% opacity) - BackgroundBlur: 0.65 - BackgroundBlurInactive: 0.0 - BackgroundSettingsForInactiveWindows: false - columnCount: 120, rowCount: 30 - ShowWindowSettingsNameInTitle: false - Bell: false, VisualBell: false - useOptionAsMetaKey: true - DynamicANSIForegroundColors: false 2. Font: - Font: SFMonoTerminal-Regular, size 16.0 - FontAntialias: true - FontHeightSpacing: 1.12 - FontWidthSpacing: 1.01 3. Text, Cursor & Selection: - TextColor: NSRGB \"0.847 0.878 0.945\" (#D8E0F1) - TextBoldColor: NSRGB \"0.945 0.965 1\" (#F1F6FF) - CursorColor: NSRGB \"0.49 0.812 1\" (#7DCFFF) - CursorType: 2 (Vertical Bar), CursorBlink: true - SelectionColor: NSRGB \"0.215 0.305 0.475 0.75\" (#374E79 @ 75%) 4. ANSI Palette (NSKeyedArchiver NSColor blobs with NSColorSpace=1): - ANSIBlackColor: \"0.145 0.165 0.235\" - ANSIBrightBlackColor: \"0.337 0.373 0.494\" - ANSIRedColor: \"0.969 0.463 0.557\" - ANSIBrightRedColor: \"1 0.58 0.659\" - ANSIGreenColor: \"0.62 0.808 0.416\" - ANSIBrightGreenColor: \"0.702 0.886 0.522\" - ANSIYellowColor: \"0.878 0.686 0.408\" - ANSIBrightYellowColor: \"0.949 0.796 0.541\" - ANSIBlueColor: \"0.478 0.635 0.969\" - ANSIBrightBlueColor: \"0.569 0.725 1\" - ANSIMagentaColor: \"0.733 0.604 0.969\" - ANSIBrightMagentaColor: \"0.816 0.706 1\" - ANSICyanColor: \"0.49 0.812 1\" - ANSIBrightCyanColor: \"0.608 0.886 1\" - ANSIWhiteColor: \"0.753 0.792 0.898\" - ANSIBrightWhiteColor: \"0.945 0.965 1\" Write a Python script using plistlib to encode the NSKeyedArchiver NSColor/NSFont objects, inject \"TokyoGlass16_5\" into ~/Library/Preferences/com.apple.Terminal.plist, set \"Default Window Settings\" and \"Startup Window Settings\" to \"TokyoGlass16_5\", and reload cfprefsd. ``` ---"},{"level":2,"title":"3. Step-by-Step Manual / Scripted Replication","slug":"3-step-by-step-manual-scripted-replication","text":""},{"level":3,"title":"Step 1: Run the Self-Contained Installer Script","slug":"step-1-run-the-self-contained-installer-script","text":"On any Mac, run the following Python script in Terminal to generate and activate `TokyoGlass16_5`: ```bash python3 - <<'EOF' import os, plistlib, subprocess plist_path = os.path.expanduser(\"~/Library/Preferences/com.apple.Terminal.plist\") with open(plist_path, \"rb\") as f: prefs = plistlib.load(f) def make_nscolor(nsrgb_str): archive = { \"$version\": 100000, \"$archiver\": \"NSKeyedArchiver\", \"$top\": {\"root\": plistlib.UID(1)}, \"$objects\": [ \"$null\", { \"NSRGB\": nsrgb_str.encode(\"ascii\") + b\"\\x00\", \"NSColorSpace\": 1, \"$class\": plistlib.UID(2), }, {\"$classname\": \"NSColor\", \"$classes\": [\"NSColor\", \"NSObject\"]}, ], } return plistlib.dumps(archive, fmt=plistlib.FMT_BINARY) def make_nsfont(name, size): archive = { \"$version\": 100000, \"$archiver\": \"NSKeyedArchiver\", \"$top\": {\"root\": plistlib.UID(1)}, \"$objects\": [ \"$null\", { \"NSSize\": float(size), \"NSfFlags\": 16, \"NSName\": plistlib.UID(2), \"$class\": plistlib.UID(3), }, name, {\"$classname\": \"NSFont\", \"$classes\": [\"NSFont\", \"NSObject\"]}, ], } return plistlib.dumps(archive, fmt=plistlib.FMT_BINARY) profile = { \"name\": \"TokyoGlass16_5\", \"type\": \"Window Settings\", \"ProfileCurrentVersion\": 2.09, \"columnCount\": 120, \"rowCount\": 30, \"BackgroundBlur\": 0.65, \"BackgroundBlurInactive\": 0.0, \"BackgroundSettingsForInactiveWindows\": False, \"BackgroundColor\": make_nscolor(\"0.086 0.102 0.157 0.6\"), \"TextColor\": make_nscolor(\"0.847 0.878 0.945\"), \"TextBoldColor\": make_nscolor(\"0.945 0.965 1\"), \"CursorColor\": make_nscolor(\"0.49 0.812 1\"), \"CursorType\": 2, \"CursorBlink\": True, \"SelectionColor\": make_nscolor(\"0.215 0.305 0.475 0.75\"), \"Font\": make_nsfont(\"SFMonoTerminal-Regular\", 16.0), \"FontAntialias\": True, \"FontHeightSpacing\": 1.12, \"FontWidthSpacing\": 1.01, \"Bell\": False, \"VisualBell\": False, \"ShowWindowSettingsNameInTitle\": False, \"DynamicANSIForegroundColors\": False, \"useOptionAsMetaKey\": True, \"ANSIBlackColor\": make_nscolor(\"0.145 0.165 0.235\"), \"ANSIBrightBlackColor\": make_nscolor(\"0.337 0.373 0.494\"), \"ANSIRedColor\": make_nscolor(\"0.969 0.463 0.557\"), \"ANSIBrightRedColor\": make_nscolor(\"1 0.58 0.659\"), \"ANSIGreenColor\": make_nscolor(\"0.62 0.808 0.416\"), \"ANSIBrightGreenColor\": make_nscolor(\"0.702 0.886 0.522\"), \"ANSIYellowColor\": make_nscolor(\"0.878 0.686 0.408\"), \"ANSIBrightYellowColor\": make_nscolor(\"0.949 0.796 0.541\"), \"ANSIBlueColor\": make_nscolor(\"0.478 0.635 0.969\"), \"ANSIBrightBlueColor\": make_nscolor(\"0.569 0.725 1\"), \"ANSIMagentaColor\": make_nscolor(\"0.733 0.604 0.969\"), \"ANSIBrightMagentaColor\": make_nscolor(\"0.816 0.706 1\"), \"ANSICyanColor\": make_nscolor(\"0.49 0.812 1\"), \"ANSIBrightCyanColor\": make_nscolor(\"0.608 0.886 1\"), \"ANSIWhiteColor\": make_nscolor(\"0.753 0.792 0.898\"), \"ANSIBrightWhiteColor\": make_nscolor(\"0.945 0.965 1\"), } prefs.setdefault(\"Window Settings\", {})[\"TokyoGlass16_5\"] = profile prefs[\"Default Window Settings\"] = \"TokyoGlass16_5\" prefs[\"Startup Window Settings\"] = \"TokyoGlass16_5\" with open(plist_path, \"wb\") as f: plistlib.dump(prefs, f, fmt=plistlib.FMT_BINARY) subprocess.run([\"killall\", \"cfprefsd\"], check=False) print(\"✅ TokyoGlass16_5 installed and set as default!\") EOF ```"},{"level":3,"title":"Step 2: Export or Import as a .terminal File (Alternative)","slug":"step-2-export-or-import-as-a-terminal-file-alternative","text":"If you want to export the profile as a portable `.terminal` file from an existing Mac: ```bash plutil -extract \"Window Settings.TokyoGlass16_5\" xml1 -o ~/Desktop/TokyoGlass16_5.terminal ~/Library/Preferences/com.apple.Terminal.plist ``` On any new Mac, double-click `TokyoGlass16_5.terminal` and click **Shell → Use Settings as Default**."}],"body":"\n# macOS Terminal TokyoGlass Setup (`TokyoGlass16_5`)\n\nThis concept documents how the **`TokyoGlass16_5`** macOS `Terminal.app` profile works under the hood, along with a **copy-paste AI prompt** and **step-by-step instructions** to replicate the exact frosted Tokyo Night glass terminal on any Mac.\n\nRelated: [VS Code Tokyo Night Storm Glass Setup](./tokyo-night-storm.md) · [Second Brain Index](../index.md)\n\n---\n\n## 1. Concept: How the Frosted Glass Terminal Works\n\nmacOS `Terminal.app` stores custom profiles in `~/Library/Preferences/com.apple.Terminal.plist` under the `\"Window Settings\"` dictionary. Each color and font property is serialized as a binary `NSKeyedArchiver` (`NSColor` / `NSFont`) blob.\n\nThe **`TokyoGlass16_5`** aesthetic is built from four pillars:\n\n1. **Frosted Dark Navy Glass Backdrop**\n   - **Background RGB**: `0.086, 0.102, 0.157` (`#161A28`)\n   - **Background Opacity (Alpha)**: `0.60` (60% opacity / 40% translucency)\n   - **Active Window Blur (`BackgroundBlur`)**: `0.65` (65% Gaussian blur via macOS WindowServer)\n   - **Inactive Window Blur (`BackgroundBlurInactive`)**: `0.0` (`BackgroundSettingsForInactiveWindows: false`)\n2. **Typography & Geometry**\n   - **Font**: `SFMonoTerminal-Regular` (`16pt`, antialiased)\n   - **Line Height (`FontHeightSpacing`)**: `1.12`\n   - **Character Width (`FontWidthSpacing`)**: `1.01`\n   - **Window Grid**: `120` columns × `30` rows\n3. **Cursor, Text & Selection**\n   - **Normal Text (`TextColor`)**: `#D8E0F1` (`0.847, 0.878, 0.945`)\n   - **Bold Text (`TextBoldColor`)**: `#F1F6FF` (`0.945, 0.965, 1.000`)\n   - **Cursor**: Blinking vertical bar (`CursorType: 2`, `CursorBlink: true`) in Sky Cyan `#7DCFFF` (`0.490, 0.812, 1.000`)\n   - **Selection (`SelectionColor`)**: `#374E79` at `0.75` alpha (`0.215, 0.305, 0.475, 0.75`)\n   - **Input & Bell**: `useOptionAsMetaKey: true`, `Bell: false`, `VisualBell: false`, `ShowWindowSettingsNameInTitle: false`\n4. **16-Color Tokyo Night ANSI Palette**\n\n| ANSI Slot | Hex | Normalized `NSRGB` (`R G B`) |\n| :--- | :--- | :--- |\n| **Black** (`ANSIBlackColor`) | `#252A3C` | `0.145 0.165 0.235` |\n| **Bright Black** (`ANSIBrightBlackColor`) | `#565F7E` | `0.337 0.373 0.494` |\n| **Red** (`ANSIRedColor`) | `#F7768E` | `0.969 0.463 0.557` |\n| **Bright Red** (`ANSIBrightRedColor`) | `#FF94A8` | `1.000 0.580 0.659` |\n| **Green** (`ANSIGreenColor`) | `#9ECE6A` | `0.620 0.808 0.416` |\n| **Bright Green** (`ANSIBrightGreenColor`) | `#B3E285` | `0.702 0.886 0.522` |\n| **Yellow** (`ANSIYellowColor`) | `#E0AF68` | `0.878 0.686 0.408` |\n| **Bright Yellow** (`ANSIBrightYellowColor`) | `#F2CB8A` | `0.949 0.796 0.541` |\n| **Blue** (`ANSIBlueColor`) | `#7AA2F7` | `0.478 0.635 0.969` |\n| **Bright Blue** (`ANSIBrightBlueColor`) | `#91B9FF` | `0.569 0.725 1.000` |\n| **Magenta** (`ANSIMagentaColor`) | `#BB9AF7` | `0.733 0.604 0.969` |\n| **Bright Magenta** (`ANSIBrightMagentaColor`) | `#D0B4FF` | `0.816 0.706 1.000` |\n| **Cyan** (`ANSICyanColor`) | `#7DCFFF` | `0.490 0.812 1.000` |\n| **Bright Cyan** (`ANSIBrightCyanColor`) | `#9BE2FF` | `0.608 0.886 1.000` |\n| **White** (`ANSIWhiteColor`) | `#C0CAF5` | `0.753 0.792 0.898` |\n| **Bright White** (`ANSIBrightWhiteColor`) | `#F1F6FF` | `0.945 0.965 1.000` |\n\n---\n\n## 2. Copy-Paste AI Prompt (Replicate on Any Mac)\n\nPaste the block below into any terminal AI coding agent on a new Mac to automatically create and activate the `TokyoGlass16_5` profile:\n\n```text\nConfigure my macOS Terminal.app with a custom profile named \"TokyoGlass16_5\" and set it as both the Default and Startup Window Settings in ~/Library/Preferences/com.apple.Terminal.plist.\n\nUse these exact specifications:\n1. Glass & Window:\n   - BackgroundColor: NSRGB \"0.086 0.102 0.157 0.6\" (#161A28 at 60% opacity)\n   - BackgroundBlur: 0.65\n   - BackgroundBlurInactive: 0.0\n   - BackgroundSettingsForInactiveWindows: false\n   - columnCount: 120, rowCount: 30\n   - ShowWindowSettingsNameInTitle: false\n   - Bell: false, VisualBell: false\n   - useOptionAsMetaKey: true\n   - DynamicANSIForegroundColors: false\n2. Font:\n   - Font: SFMonoTerminal-Regular, size 16.0\n   - FontAntialias: true\n   - FontHeightSpacing: 1.12\n   - FontWidthSpacing: 1.01\n3. Text, Cursor & Selection:\n   - TextColor: NSRGB \"0.847 0.878 0.945\" (#D8E0F1)\n   - TextBoldColor: NSRGB \"0.945 0.965 1\" (#F1F6FF)\n   - CursorColor: NSRGB \"0.49 0.812 1\" (#7DCFFF)\n   - CursorType: 2 (Vertical Bar), CursorBlink: true\n   - SelectionColor: NSRGB \"0.215 0.305 0.475 0.75\" (#374E79 @ 75%)\n4. ANSI Palette (NSKeyedArchiver NSColor blobs with NSColorSpace=1):\n   - ANSIBlackColor: \"0.145 0.165 0.235\"\n   - ANSIBrightBlackColor: \"0.337 0.373 0.494\"\n   - ANSIRedColor: \"0.969 0.463 0.557\"\n   - ANSIBrightRedColor: \"1 0.58 0.659\"\n   - ANSIGreenColor: \"0.62 0.808 0.416\"\n   - ANSIBrightGreenColor: \"0.702 0.886 0.522\"\n   - ANSIYellowColor: \"0.878 0.686 0.408\"\n   - ANSIBrightYellowColor: \"0.949 0.796 0.541\"\n   - ANSIBlueColor: \"0.478 0.635 0.969\"\n   - ANSIBrightBlueColor: \"0.569 0.725 1\"\n   - ANSIMagentaColor: \"0.733 0.604 0.969\"\n   - ANSIBrightMagentaColor: \"0.816 0.706 1\"\n   - ANSICyanColor: \"0.49 0.812 1\"\n   - ANSIBrightCyanColor: \"0.608 0.886 1\"\n   - ANSIWhiteColor: \"0.753 0.792 0.898\"\n   - ANSIBrightWhiteColor: \"0.945 0.965 1\"\n\nWrite a Python script using plistlib to encode the NSKeyedArchiver NSColor/NSFont objects, inject \"TokyoGlass16_5\" into ~/Library/Preferences/com.apple.Terminal.plist, set \"Default Window Settings\" and \"Startup Window Settings\" to \"TokyoGlass16_5\", and reload cfprefsd.\n```\n\n---\n\n## 3. Step-by-Step Manual / Scripted Replication\n\n### Step 1: Run the Self-Contained Installer Script\n\nOn any Mac, run the following Python script in Terminal to generate and activate `TokyoGlass16_5`:\n\n```bash\npython3 - <<'EOF'\nimport os, plistlib, subprocess\n\nplist_path = os.path.expanduser(\"~/Library/Preferences/com.apple.Terminal.plist\")\nwith open(plist_path, \"rb\") as f:\n    prefs = plistlib.load(f)\n\ndef make_nscolor(nsrgb_str):\n    archive = {\n        \"$version\": 100000,\n        \"$archiver\": \"NSKeyedArchiver\",\n        \"$top\": {\"root\": plistlib.UID(1)},\n        \"$objects\": [\n            \"$null\",\n            {\n                \"NSRGB\": nsrgb_str.encode(\"ascii\") + b\"\\x00\",\n                \"NSColorSpace\": 1,\n                \"$class\": plistlib.UID(2),\n            },\n            {\"$classname\": \"NSColor\", \"$classes\": [\"NSColor\", \"NSObject\"]},\n        ],\n    }\n    return plistlib.dumps(archive, fmt=plistlib.FMT_BINARY)\n\ndef make_nsfont(name, size):\n    archive = {\n        \"$version\": 100000,\n        \"$archiver\": \"NSKeyedArchiver\",\n        \"$top\": {\"root\": plistlib.UID(1)},\n        \"$objects\": [\n            \"$null\",\n            {\n                \"NSSize\": float(size),\n                \"NSfFlags\": 16,\n                \"NSName\": plistlib.UID(2),\n                \"$class\": plistlib.UID(3),\n            },\n            name,\n            {\"$classname\": \"NSFont\", \"$classes\": [\"NSFont\", \"NSObject\"]},\n        ],\n    }\n    return plistlib.dumps(archive, fmt=plistlib.FMT_BINARY)\n\nprofile = {\n    \"name\": \"TokyoGlass16_5\",\n    \"type\": \"Window Settings\",\n    \"ProfileCurrentVersion\": 2.09,\n    \"columnCount\": 120,\n    \"rowCount\": 30,\n    \"BackgroundBlur\": 0.65,\n    \"BackgroundBlurInactive\": 0.0,\n    \"BackgroundSettingsForInactiveWindows\": False,\n    \"BackgroundColor\": make_nscolor(\"0.086 0.102 0.157 0.6\"),\n    \"TextColor\": make_nscolor(\"0.847 0.878 0.945\"),\n    \"TextBoldColor\": make_nscolor(\"0.945 0.965 1\"),\n    \"CursorColor\": make_nscolor(\"0.49 0.812 1\"),\n    \"CursorType\": 2,\n    \"CursorBlink\": True,\n    \"SelectionColor\": make_nscolor(\"0.215 0.305 0.475 0.75\"),\n    \"Font\": make_nsfont(\"SFMonoTerminal-Regular\", 16.0),\n    \"FontAntialias\": True,\n    \"FontHeightSpacing\": 1.12,\n    \"FontWidthSpacing\": 1.01,\n    \"Bell\": False,\n    \"VisualBell\": False,\n    \"ShowWindowSettingsNameInTitle\": False,\n    \"DynamicANSIForegroundColors\": False,\n    \"useOptionAsMetaKey\": True,\n    \"ANSIBlackColor\": make_nscolor(\"0.145 0.165 0.235\"),\n    \"ANSIBrightBlackColor\": make_nscolor(\"0.337 0.373 0.494\"),\n    \"ANSIRedColor\": make_nscolor(\"0.969 0.463 0.557\"),\n    \"ANSIBrightRedColor\": make_nscolor(\"1 0.58 0.659\"),\n    \"ANSIGreenColor\": make_nscolor(\"0.62 0.808 0.416\"),\n    \"ANSIBrightGreenColor\": make_nscolor(\"0.702 0.886 0.522\"),\n    \"ANSIYellowColor\": make_nscolor(\"0.878 0.686 0.408\"),\n    \"ANSIBrightYellowColor\": make_nscolor(\"0.949 0.796 0.541\"),\n    \"ANSIBlueColor\": make_nscolor(\"0.478 0.635 0.969\"),\n    \"ANSIBrightBlueColor\": make_nscolor(\"0.569 0.725 1\"),\n    \"ANSIMagentaColor\": make_nscolor(\"0.733 0.604 0.969\"),\n    \"ANSIBrightMagentaColor\": make_nscolor(\"0.816 0.706 1\"),\n    \"ANSICyanColor\": make_nscolor(\"0.49 0.812 1\"),\n    \"ANSIBrightCyanColor\": make_nscolor(\"0.608 0.886 1\"),\n    \"ANSIWhiteColor\": make_nscolor(\"0.753 0.792 0.898\"),\n    \"ANSIBrightWhiteColor\": make_nscolor(\"0.945 0.965 1\"),\n}\n\nprefs.setdefault(\"Window Settings\", {})[\"TokyoGlass16_5\"] = profile\nprefs[\"Default Window Settings\"] = \"TokyoGlass16_5\"\nprefs[\"Startup Window Settings\"] = \"TokyoGlass16_5\"\n\nwith open(plist_path, \"wb\") as f:\n    plistlib.dump(prefs, f, fmt=plistlib.FMT_BINARY)\n\nsubprocess.run([\"killall\", \"cfprefsd\"], check=False)\nprint(\"✅ TokyoGlass16_5 installed and set as default!\")\nEOF\n```\n\n### Step 2: Export or Import as a `.terminal` File (Alternative)\n\nIf you want to export the profile as a portable `.terminal` file from an existing Mac:\n\n```bash\nplutil -extract \"Window Settings.TokyoGlass16_5\" xml1 -o ~/Desktop/TokyoGlass16_5.terminal ~/Library/Preferences/com.apple.Terminal.plist\n```\n\nOn any new Mac, double-click `TokyoGlass16_5.terminal` and click **Shell → Use Settings as Default**.\n","color":"#44403c","backlinks":["AGENTS.md","dev-tools/index.md","dev-tools/tokyo-night-storm.md"],"inGraph":true},{"id":"dev-tools/tokyo-night-storm.md","title":"VS Code Tokyo Night Glass","subtitle":"Vibrancy Continued + Tokyo Night Storm CSS","type":"concept","group":"Themes","description":"Step-by-step concept guide and reusable AI prompt to replicate the Tokyo Night Storm frosted-glass setup in VS Code on any Mac.","updated":"2026-11-07","tags":["macos","vscode","tokyo-night","glass","ai-prompt"],"headings":[{"level":2,"text":"1. Concept: How VS Code Glass / Vibrancy Works on macOS","slug":"1-concept-how-vs-code-glass-vibrancy-works-on-macos"},{"level":3,"text":"Common Pitfalls & Why It Can Look Weird Out-of-the-Box","slug":"common-pitfalls-why-it-can-look-weird-out-of-the-box"},{"level":2,"text":"2. Copy-Paste AI Prompt (Replicate on Any Mac)","slug":"2-copy-paste-ai-prompt-replicate-on-any-mac"},{"level":2,"text":"3. Step-by-Step Manual Replication","slug":"3-step-by-step-manual-replication"},{"level":3,"text":"Step 1: Install the Extensions","slug":"step-1-install-the-extensions"},{"level":3,"text":"Step 2: Remove the Blurry Neon Glow in Vibrancy's Tokyo Night Storm CSS (Optional but Recommended)","slug":"step-2-remove-the-blurry-neon-glow-in-vibrancy-s-tokyo-night-storm-css-optional-but-recommended"},{"level":3,"text":"Step 3: Apply settings.json","slug":"step-3-apply-settings-json"},{"level":3,"text":"Step 4: Activate Vibrancy in VS Code","slug":"step-4-activate-vibrancy-in-vs-code"}],"sections":[{"level":1,"title":"Overview","slug":"","text":"# VS Code Tokyo Night Storm Glass Setup (`tokyo-night-storm`) This concept explains how the **Tokyo Night Storm** frosted-glass setup works in VS Code on macOS, why certain vibrancy defaults can look off, and how to replicate the exact setup cleanly on any Mac using either a **copy-paste AI prompt** or **step-by-step commands**. Related: [macOS Terminal TokyoGlass Setup](./macos-terminal-tokyo-glass.md) · [Second Brain Index](../index.md) ---"},{"level":2,"title":"1. Concept: How VS Code Glass / Vibrancy Works on macOS","slug":"1-concept-how-vs-code-glass-vibrancy-works-on-macos","text":"Unlike `Terminal.app`, VS Code (an Electron app) uses opaque workbench layers by default. Achieving the **Tokyo Night Storm** glass look requires three layers working together: 1. **Syntax & UI Theme (`enkia.tokyo-night` + `pkief.material-icon-theme`)** - Sets `\"workbench.colorTheme\": \"Tokyo Night Storm\"` and `\"workbench.iconTheme\": \"material-icon-theme\"`. 2. **Native macOS Vibrancy Injection (`illixion.vscode-vibrancy-continued`)** - Patches VS Code's Electron `BrowserWindow` (`main.js` and `mainImpl.js`) with `visualEffectState: \"active\"`, `frame: false`, and `transparent: true`. - Calls Electron's `window.setVibrancy(\"under-window\")` so macOS WindowServer blurs everything behind the VS Code window. - Injects a root `<style>` tag setting `html { background: rgba(R, G, B, opacity) !important; }` using `\"vscode_vibrancy.backgroundOverride\"` (`#181F31` or `#161A28`) and `\"vscode_vibrancy.opacity\"` (`0.42`–`0.60`). 3. **Transparent Surface Layering (`workbench.colorCustomizations` & Terminal DOM Renderer)** - Sets `\"terminal.integrated.gpuAcceleration\": \"off\"` so the integrated terminal uses the DOM renderer instead of an opaque WebGL canvas. - Replaces opaque workbench surfaces (`editorPane.background`, `editorGutter.background`, `panel.background`, `terminal.background`, `tab.activeBackground`) with `#181f3100` (transparent) or translucent tiers (`#181f316b` for sidebar/editor, `#181f31bf` for sticky scroll, `#181f31e6` for floating widgets/menus)."},{"level":3,"title":"Common Pitfalls & Why It Can Look Weird Out-of-the-Box","slug":"common-pitfalls-why-it-can-look-weird-out-of-the-box","text":"- **Neon Glow on Code Tokens**: The built-in `Tokyo Night Storm.css` inside `illixion.vscode-vibrancy-continued` includes a rule adding a blurry neon glow (`text-shadow: 0 0 8px, 0 0 2px #000;`) to `.mtk4, .mtk9.mtk10, .mtk11, ...`. Removing that rule keeps text crisp like `Terminal.app`. - **Double-Tinted Panes**: Because `html` already has the base tint, setting `editor.background` to `#181f316b` while `editorGutter.background` is `#181f3100` can make the editor slightly darker than the line-number gutter. Setting `editor.background` to `#181f3100` (with `\"vscode_vibrancy.disableColorCustomizations\": true`) makes the entire editor and gutter share a single, uniform glass layer. ---"},{"level":2,"title":"2. Copy-Paste AI Prompt (Replicate on Any Mac)","slug":"2-copy-paste-ai-prompt-replicate-on-any-mac","text":"Paste this prompt into any AI coding agent on a new Mac to install and configure the complete setup automatically: ```text Set up my VS Code on macOS with the Tokyo Night Storm frosted-glass configuration: 1. Install required VS Code extensions via CLI: - enkia.tokyo-night - illixion.vscode-vibrancy-continued - pkief.material-icon-theme 2. Remove the blurry neon text-shadow rule (.mtk4,.mtk9.mtk10... { text-shadow: 0 0 8px, 0 0 2px #000; }) from ~/.vscode/extensions/illixion.vscode-vibrancy-continued-*/themes/Tokyo Night Storm.css so code tokens stay crisp. 3. Update ~/Library/Application Support/Code/User/settings.json with these theme, vibrancy, editor, and terminal settings (preserving any language-specific settings): - \"workbench.colorTheme\": \"Tokyo Night Storm\" - \"workbench.iconTheme\": \"material-icon-theme\" - \"window.titleBarStyle\": \"custom\" - \"window.systemColorTheme\": \"dark\" - \"window.autoDetectColorScheme\": false - \"vscode_vibrancy.theme\": \"Tokyo Night Storm\" - \"vscode_vibrancy.type\": \"under-window\" - \"vscode_vibrancy.opacity\": 0.42 - \"vscode_vibrancy.backgroundOverride\": \"#181F31\" - \"vscode_vibrancy.preventFlash\": true - \"editor.fontSize\": 16 - \"editor.lineHeight\": 24 - \"editor.minimap.enabled\": false - \"editor.cursorBlinking\": \"smooth\" - \"editor.cursorSmoothCaretAnimation\": \"on\" - \"editor.smoothScrolling\": true - \"terminal.integrated.fontSize\": 16 - \"terminal.integrated.lineHeight\": 1.25 - \"terminal.integrated.cursorStyle\": \"line\" - \"terminal.integrated.cursorBlinking\": true - \"terminal.integrated.gpuAcceleration\": \"off\" - \"workbench.colorCustomizations\" configured for #181f31 vibrancy transparency. 4. Clear macOS quarantine on \"/Applications/Visual Studio Code.app\" if needed so Vibrancy Continued can patch main.js, then remind me to press Cmd+Shift+P -> \"Reload Vibrancy\" inside VS Code. ``` ---"},{"level":2,"title":"3. Step-by-Step Manual Replication","slug":"3-step-by-step-manual-replication","text":""},{"level":3,"title":"Step 1: Install the Extensions","slug":"step-1-install-the-extensions","text":"Run in your terminal: ```bash code --install-extension enkia.tokyo-night code --install-extension illixion.vscode-vibrancy-continued code --install-extension pkief.material-icon-theme ```"},{"level":3,"title":"Step 2: Remove the Blurry Neon Glow in Vibrancy's Tokyo Night Storm CSS (Optional but Recommended)","slug":"step-2-remove-the-blurry-neon-glow-in-vibrancy-s-tokyo-night-storm-css-optional-but-recommended","text":"Strip the `text-shadow` glow rule from the extension's theme stylesheet before loading Vibrancy: ```bash python3 - <<'EOF' import glob, re for path in glob.glob(\"/Users/*/.vscode/extensions/illixion.vscode-vibrancy-continued-*/themes/Tokyo Night Storm.css\"): with open(path, \"r\") as f: css = f.read() cleaned = re.sub(r\"\\.mtk4,\\.mtk9\\.mtk10[^{]*\\{[^}]*\\}\\s*\", \"\", css) with open(path, \"w\") as f: f.write(cleaned) print(f\"Cleaned neon text-shadow in: {path}\") EOF ```"},{"level":3,"title":"Step 3: Apply settings.json","slug":"step-3-apply-settings-json","text":"Open `~/Library/Application Support/Code/User/settings.json` (<kbd>⌘</kbd>+<kbd>Shift</kbd>+<kbd>P</kbd> → **Preferences: Open User Settings (JSON)**) and include: ```json { \"editor.fontSize\": 16, \"editor.lineHeight\": 24, \"editor.minimap.enabled\": false, \"editor.stickyScroll.enabled\": true, \"editor.bracketPairColorization.enabled\": true, \"editor.guides.bracketPairs\": true, \"editor.cursorBlinking\": \"smooth\", \"editor.cursorSmoothCaretAnimation\": \"on\", \"editor.smoothScrolling\": true, \"workbench.colorTheme\": \"Tokyo Night Storm\", \"workbench.iconTheme\": \"material-icon-theme\", \"window.titleBarStyle\": \"custom\", \"window.systemColorTheme\": \"dark\", \"window.autoDetectColorScheme\": false, \"vscode_vibrancy.theme\": \"Tokyo Night Storm\", \"vscode_vibrancy.type\": \"under-window\", \"vscode_vibrancy.opacity\": 0.42, \"vscode_vibrancy.backgroundOverride\": \"#181F31\", \"vscode_vibrancy.preventFlash\": true, \"terminal.integrated.fontSize\": 16, \"terminal.integrated.defaultProfile.osx\": \"zsh\", \"terminal.integrated.cursorStyle\": \"line\", \"terminal.integrated.lineHeight\": 1.25, \"terminal.integrated.cursorBlinking\": true, \"terminal.integrated.gpuAcceleration\": \"off\", \"workbench.colorCustomizations\": { \"terminal.background\": \"#00000000\", \"editorPane.background\": \"#181f3100\", \"editorGroupHeader.tabsBackground\": \"#181f3100\", \"editorGroupHeader.noTabsBackground\": \"#181f3100\", \"breadcrumb.background\": \"#181f3100\", \"editorGutter.background\": \"#181f3100\", \"panel.background\": \"#181f3100\", \"tab.activeBackground\": \"#181f3100\", \"tab.unfocusedActiveBackground\": \"#181f3100\", \"sideBar.background\": \"#181f316b\", \"sideBarTitle.background\": \"#181f316b\", \"activityBar.background\": \"#181f316b\", \"editor.background\": \"#181f316b\", \"tab.inactiveBackground\": \"#181f316b\", \"tab.unfocusedInactiveBackground\": \"#181f316b\", \"editorStickyScroll.background\": \"#181f31bf\", \"editorStickyScrollGutter.background\": \"#181f31bf\", \"sideBarStickyScroll.background\": \"#181f31bf\", \"panelStickyScroll.background\": \"#181f31bf\", \"terminalStickyScroll.background\": \"#181f31bf\", \"minimap.background\": \"#181f31bf\", \"inlineChat.background\": \"#181f31e6\", \"editorWidget.background\": \"#181f31e6\", \"editorHoverWidget.background\": \"#181f31e6\", \"editorSuggestWidget.background\": \"#181f31e6\", \"notifications.background\": \"#181f31e6\", \"notificationCenterHeader.background\": \"#181f31e6\", \"menu.background\": \"#181f31e6\", \"quickInput.background\": \"#181f31e6\", \"editor.lineHighlightBorder\": \"#00000000\" } } ```"},{"level":3,"title":"Step 4: Activate Vibrancy in VS Code","slug":"step-4-activate-vibrancy-in-vs-code","text":"1. If macOS blocks VS Code from patching itself (`EROFS: read-only file system`), clear App Translocation quarantine first: ```bash sudo xattr -dr com.apple.quarantine \"/Applications/Visual Studio Code.app\" ``` 2. Inside VS Code, press <kbd>⌘</kbd>+<kbd>Shift</kbd>+<kbd>P</kbd> (or <kbd>F1</kbd>) → run **`Reload Vibrancy`**. 3. Click **Restart** when prompted."}],"body":"\n# VS Code Tokyo Night Storm Glass Setup (`tokyo-night-storm`)\n\nThis concept explains how the **Tokyo Night Storm** frosted-glass setup works in VS Code on macOS, why certain vibrancy defaults can look off, and how to replicate the exact setup cleanly on any Mac using either a **copy-paste AI prompt** or **step-by-step commands**.\n\nRelated: [macOS Terminal TokyoGlass Setup](./macos-terminal-tokyo-glass.md) · [Second Brain Index](../index.md)\n\n---\n\n## 1. Concept: How VS Code Glass / Vibrancy Works on macOS\n\nUnlike `Terminal.app`, VS Code (an Electron app) uses opaque workbench layers by default. Achieving the **Tokyo Night Storm** glass look requires three layers working together:\n\n1. **Syntax & UI Theme (`enkia.tokyo-night` + `pkief.material-icon-theme`)**\n   - Sets `\"workbench.colorTheme\": \"Tokyo Night Storm\"` and `\"workbench.iconTheme\": \"material-icon-theme\"`.\n2. **Native macOS Vibrancy Injection (`illixion.vscode-vibrancy-continued`)**\n   - Patches VS Code's Electron `BrowserWindow` (`main.js` and `mainImpl.js`) with `visualEffectState: \"active\"`, `frame: false`, and `transparent: true`.\n   - Calls Electron's `window.setVibrancy(\"under-window\")` so macOS WindowServer blurs everything behind the VS Code window.\n   - Injects a root `<style>` tag setting `html { background: rgba(R, G, B, opacity) !important; }` using `\"vscode_vibrancy.backgroundOverride\"` (`#181F31` or `#161A28`) and `\"vscode_vibrancy.opacity\"` (`0.42`–`0.60`).\n3. **Transparent Surface Layering (`workbench.colorCustomizations` & Terminal DOM Renderer)**\n   - Sets `\"terminal.integrated.gpuAcceleration\": \"off\"` so the integrated terminal uses the DOM renderer instead of an opaque WebGL canvas.\n   - Replaces opaque workbench surfaces (`editorPane.background`, `editorGutter.background`, `panel.background`, `terminal.background`, `tab.activeBackground`) with `#181f3100` (transparent) or translucent tiers (`#181f316b` for sidebar/editor, `#181f31bf` for sticky scroll, `#181f31e6` for floating widgets/menus).\n\n### Common Pitfalls & Why It Can Look Weird Out-of-the-Box\n\n- **Neon Glow on Code Tokens**: The built-in `Tokyo Night Storm.css` inside `illixion.vscode-vibrancy-continued` includes a rule adding a blurry neon glow (`text-shadow: 0 0 8px, 0 0 2px #000;`) to `.mtk4, .mtk9.mtk10, .mtk11, ...`. Removing that rule keeps text crisp like `Terminal.app`.\n- **Double-Tinted Panes**: Because `html` already has the base tint, setting `editor.background` to `#181f316b` while `editorGutter.background` is `#181f3100` can make the editor slightly darker than the line-number gutter. Setting `editor.background` to `#181f3100` (with `\"vscode_vibrancy.disableColorCustomizations\": true`) makes the entire editor and gutter share a single, uniform glass layer.\n\n---\n\n## 2. Copy-Paste AI Prompt (Replicate on Any Mac)\n\nPaste this prompt into any AI coding agent on a new Mac to install and configure the complete setup automatically:\n\n```text\nSet up my VS Code on macOS with the Tokyo Night Storm frosted-glass configuration:\n\n1. Install required VS Code extensions via CLI:\n   - enkia.tokyo-night\n   - illixion.vscode-vibrancy-continued\n   - pkief.material-icon-theme\n\n2. Remove the blurry neon text-shadow rule (.mtk4,.mtk9.mtk10... { text-shadow: 0 0 8px, 0 0 2px #000; }) from ~/.vscode/extensions/illixion.vscode-vibrancy-continued-*/themes/Tokyo Night Storm.css so code tokens stay crisp.\n\n3. Update ~/Library/Application Support/Code/User/settings.json with these theme, vibrancy, editor, and terminal settings (preserving any language-specific settings):\n   - \"workbench.colorTheme\": \"Tokyo Night Storm\"\n   - \"workbench.iconTheme\": \"material-icon-theme\"\n   - \"window.titleBarStyle\": \"custom\"\n   - \"window.systemColorTheme\": \"dark\"\n   - \"window.autoDetectColorScheme\": false\n   - \"vscode_vibrancy.theme\": \"Tokyo Night Storm\"\n   - \"vscode_vibrancy.type\": \"under-window\"\n   - \"vscode_vibrancy.opacity\": 0.42\n   - \"vscode_vibrancy.backgroundOverride\": \"#181F31\"\n   - \"vscode_vibrancy.preventFlash\": true\n   - \"editor.fontSize\": 16\n   - \"editor.lineHeight\": 24\n   - \"editor.minimap.enabled\": false\n   - \"editor.cursorBlinking\": \"smooth\"\n   - \"editor.cursorSmoothCaretAnimation\": \"on\"\n   - \"editor.smoothScrolling\": true\n   - \"terminal.integrated.fontSize\": 16\n   - \"terminal.integrated.lineHeight\": 1.25\n   - \"terminal.integrated.cursorStyle\": \"line\"\n   - \"terminal.integrated.cursorBlinking\": true\n   - \"terminal.integrated.gpuAcceleration\": \"off\"\n   - \"workbench.colorCustomizations\" configured for #181f31 vibrancy transparency.\n\n4. Clear macOS quarantine on \"/Applications/Visual Studio Code.app\" if needed so Vibrancy Continued can patch main.js, then remind me to press Cmd+Shift+P -> \"Reload Vibrancy\" inside VS Code.\n```\n\n---\n\n## 3. Step-by-Step Manual Replication\n\n### Step 1: Install the Extensions\n\nRun in your terminal:\n\n```bash\ncode --install-extension enkia.tokyo-night\ncode --install-extension illixion.vscode-vibrancy-continued\ncode --install-extension pkief.material-icon-theme\n```\n\n### Step 2: Remove the Blurry Neon Glow in Vibrancy's Tokyo Night Storm CSS (Optional but Recommended)\n\nStrip the `text-shadow` glow rule from the extension's theme stylesheet before loading Vibrancy:\n\n```bash\npython3 - <<'EOF'\nimport glob, re\n\nfor path in glob.glob(\"/Users/*/.vscode/extensions/illixion.vscode-vibrancy-continued-*/themes/Tokyo Night Storm.css\"):\n    with open(path, \"r\") as f:\n        css = f.read()\n    cleaned = re.sub(r\"\\.mtk4,\\.mtk9\\.mtk10[^{]*\\{[^}]*\\}\\s*\", \"\", css)\n    with open(path, \"w\") as f:\n        f.write(cleaned)\n    print(f\"Cleaned neon text-shadow in: {path}\")\nEOF\n```\n\n### Step 3: Apply `settings.json`\n\nOpen `~/Library/Application Support/Code/User/settings.json` (<kbd>⌘</kbd>+<kbd>Shift</kbd>+<kbd>P</kbd> → **Preferences: Open User Settings (JSON)**) and include:\n\n```json\n{\n  \"editor.fontSize\": 16,\n  \"editor.lineHeight\": 24,\n  \"editor.minimap.enabled\": false,\n  \"editor.stickyScroll.enabled\": true,\n  \"editor.bracketPairColorization.enabled\": true,\n  \"editor.guides.bracketPairs\": true,\n  \"editor.cursorBlinking\": \"smooth\",\n  \"editor.cursorSmoothCaretAnimation\": \"on\",\n  \"editor.smoothScrolling\": true,\n  \"workbench.colorTheme\": \"Tokyo Night Storm\",\n  \"workbench.iconTheme\": \"material-icon-theme\",\n  \"window.titleBarStyle\": \"custom\",\n  \"window.systemColorTheme\": \"dark\",\n  \"window.autoDetectColorScheme\": false,\n  \"vscode_vibrancy.theme\": \"Tokyo Night Storm\",\n  \"vscode_vibrancy.type\": \"under-window\",\n  \"vscode_vibrancy.opacity\": 0.42,\n  \"vscode_vibrancy.backgroundOverride\": \"#181F31\",\n  \"vscode_vibrancy.preventFlash\": true,\n  \"terminal.integrated.fontSize\": 16,\n  \"terminal.integrated.defaultProfile.osx\": \"zsh\",\n  \"terminal.integrated.cursorStyle\": \"line\",\n  \"terminal.integrated.lineHeight\": 1.25,\n  \"terminal.integrated.cursorBlinking\": true,\n  \"terminal.integrated.gpuAcceleration\": \"off\",\n  \"workbench.colorCustomizations\": {\n    \"terminal.background\": \"#00000000\",\n    \"editorPane.background\": \"#181f3100\",\n    \"editorGroupHeader.tabsBackground\": \"#181f3100\",\n    \"editorGroupHeader.noTabsBackground\": \"#181f3100\",\n    \"breadcrumb.background\": \"#181f3100\",\n    \"editorGutter.background\": \"#181f3100\",\n    \"panel.background\": \"#181f3100\",\n    \"tab.activeBackground\": \"#181f3100\",\n    \"tab.unfocusedActiveBackground\": \"#181f3100\",\n    \"sideBar.background\": \"#181f316b\",\n    \"sideBarTitle.background\": \"#181f316b\",\n    \"activityBar.background\": \"#181f316b\",\n    \"editor.background\": \"#181f316b\",\n    \"tab.inactiveBackground\": \"#181f316b\",\n    \"tab.unfocusedInactiveBackground\": \"#181f316b\",\n    \"editorStickyScroll.background\": \"#181f31bf\",\n    \"editorStickyScrollGutter.background\": \"#181f31bf\",\n    \"sideBarStickyScroll.background\": \"#181f31bf\",\n    \"panelStickyScroll.background\": \"#181f31bf\",\n    \"terminalStickyScroll.background\": \"#181f31bf\",\n    \"minimap.background\": \"#181f31bf\",\n    \"inlineChat.background\": \"#181f31e6\",\n    \"editorWidget.background\": \"#181f31e6\",\n    \"editorHoverWidget.background\": \"#181f31e6\",\n    \"editorSuggestWidget.background\": \"#181f31e6\",\n    \"notifications.background\": \"#181f31e6\",\n    \"notificationCenterHeader.background\": \"#181f31e6\",\n    \"menu.background\": \"#181f31e6\",\n    \"quickInput.background\": \"#181f31e6\",\n    \"editor.lineHighlightBorder\": \"#00000000\"\n  }\n}\n```\n\n### Step 4: Activate Vibrancy in VS Code\n\n1. If macOS blocks VS Code from patching itself (`EROFS: read-only file system`), clear App Translocation quarantine first:\n   ```bash\n   sudo xattr -dr com.apple.quarantine \"/Applications/Visual Studio Code.app\"\n   ```\n2. Inside VS Code, press <kbd>⌘</kbd>+<kbd>Shift</kbd>+<kbd>P</kbd> (or <kbd>F1</kbd>) → run **`Reload Vibrancy`**.\n3. Click **Restart** when prompted.\n","color":"#44403c","backlinks":["AGENTS.md","dev-tools/index.md","dev-tools/macos-terminal-tokyo-glass.md"],"inGraph":true},{"id":"inbox.md","title":"Quick Capture Inbox","subtitle":"Unstructured scratchpad for raw ideas & links","type":"inbox","group":null,"description":"Scratchpad for quick thoughts, links, and rough ideas.","updated":"2026-11-07","tags":["inbox","workflow"],"headings":[],"sections":[{"level":1,"title":"Overview","slug":"","text":"# Inbox (Scratchpad) Type anything here without worrying about formatting! Whenever you're ready, just tell your AI: **\"Organize my inbox into notes.\"** --- - Write your first thought or paste a link here..."}],"body":"\n# Inbox (Scratchpad)\n\nType anything here without worrying about formatting!\nWhenever you're ready, just tell your AI: **\"Organize my inbox into notes.\"**\n\n---\n\n- Write your first thought or paste a link here...\n","color":"#78716c","backlinks":["AGENTS.md","ARCHITECTURE.md","index.md","onboarding/contributor-checklist.md","onboarding/second-brain-quickstart.md"],"inGraph":true},{"id":"index.md","title":"My Second Brain","subtitle":"OKF Knowledge Index","type":"index","group":null,"description":"Team knowledge base powered by Google Open Knowledge Format (OKF), Developer Docs, and an Interactive Mind Map.","updated":"","tags":[],"headings":[{"level":2,"text":"Quick Capture","slug":"quick-capture"},{"level":2,"text":"Topics","slug":"topics"},{"level":2,"text":"For AI Agents","slug":"for-ai-agents"}],"sections":[{"level":1,"title":"Overview","slug":"","text":"# My Second Brain Welcome! This knowledge base is organized as a **Google Open Knowledge Format (OKF)** tree. Start here, pick a topic, and open only what you need. That works the same way for people and for AI agents."},{"level":2,"title":"Quick Capture","slug":"quic
