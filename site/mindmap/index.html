,"type":"playbook","group":null,"description":"Step-by-step checklist for adding or updating a note so it passes OKF validation, links into the tree, and appears on the site.","updated":"2026-11-08","tags":["onboarding","workflow","okf"],"headings":[{"level":2,"text":"1. Pick the right folder","slug":"1-pick-the-right-folder"},{"level":2,"text":"2. Add the frontmatter","slug":"2-add-the-frontmatter"},{"level":2,"text":"3. Link it into the tree","slug":"3-link-it-into-the-tree"},{"level":2,"text":"4. Validate and preview","slug":"4-validate-and-preview"},{"level":2,"text":"5. Log and push","slug":"5-log-and-push"}],"sections":[{"level":1,"title":"Overview","slug":"","text":"# Contributor Checklist Use this whenever you add or change knowledge, by hand or through an AI agent. An agent following [AGENTS.md](../AGENTS.md) does these steps automatically."},{"level":2,"title":"1. Pick the right folder","slug":"1-pick-the-right-folder","text":"| If the note is... | Put it in | `type` | |---|---|---| | How to get started or contribute | `onboarding/` | `playbook` or `note` | | A step-by-step procedure | `runbooks/` | `playbook` | | A choice we made and why | `decisions/` | `decision` | | A definition, spec, or explainer | `reference/` | `reference` or `concept` | | A local tool or environment setup | `dev-tools/` | `concept` | Not sure yet? Drop it in [inbox.md](../inbox.md) and file it later."},{"level":2,"title":"2. Add the frontmatter","slug":"2-add-the-frontmatter","text":"```yaml --- type: playbook title: \"Rotate the API Key\" description: \"One sentence that says what this note is for.\" tags: [security, oncall] updated: 2026-11-08 --- ```"},{"level":2,"title":"3. Link it into the tree","slug":"3-link-it-into-the-tree","text":"- Add a line to the folder's `index.md`: `- [Title](./file.md) - one-sentence summary.` - Link to related notes inside the body, so the graph shows real relationships."},{"level":2,"title":"4. Validate and preview","slug":"4-validate-and-preview","text":"```bash node scripts/validate-okf.mjs node scripts/export-graph.mjs open site/index.html ```"},{"level":2,"title":"5. Log and push","slug":"5-log-and-push","text":"Add one line to [log.md](../log.md), then commit and push. The [deploy runbook](../runbooks/deploy-docs-site.md) explains what happens next."}],"body":"\n# Contributor Checklist\n\nUse this whenever you add or change knowledge, by hand or through an AI agent. An agent following [AGENTS.md](../AGENTS.md) does these steps automatically.\n\n## 1. Pick the right folder\n\n| If the note is... | Put it in | `type` |\n|---|---|---|\n| How to get started or contribute | `onboarding/` | `playbook` or `note` |\n| A step-by-step procedure | `runbooks/` | `playbook` |\n| A choice we made and why | `decisions/` | `decision` |\n| A definition, spec, or explainer | `reference/` | `reference` or `concept` |\n| A local tool or environment setup | `dev-tools/` | `concept` |\n\nNot sure yet? Drop it in [inbox.md](../inbox.md) and file it later.\n\n## 2. Add the frontmatter\n\n```yaml\n---\ntype: playbook\ntitle: \"Rotate the API Key\"\ndescription: \"One sentence that says what this note is for.\"\ntags: [security, oncall]\nupdated: 2026-11-08\n---\n```\n\n## 3. Link it into the tree\n\n- Add a line to the folder's `index.md`: `- [Title](./file.md) - one-sentence summary.`\n- Link to related notes inside the body, so the graph shows real relationships.\n\n## 4. Validate and preview\n\n```bash\nnode scripts/validate-okf.mjs\nnode scripts/export-graph.mjs\nopen site/index.html\n```\n\n## 5. Log and push\n\nAdd one line to [log.md](../log.md), then commit and push. The [deploy runbook](../runbooks/deploy-docs-site.md) explains what happens next.\n","color":"#57534e","backlinks":["AGENTS.md","decisions/adr-001-okf-markdown-knowledge-base.md","onboarding/index.md","onboarding/second-brain-quickstart.md","runbooks/deploy-docs-site.md"],"inGraph":true},{"id":"onboarding/index.md","title":"Onboarding","subtitle":"OKF Knowledge Index","type":"index","group":null,"description":"OKF Knowledge Index","updated":"","tags":[],"headings":[],"sections":[{"level":1,"title":"Overview","slug":"","text":"# Onboarding Start here if you are new to this knowledge base, as a person or as an AI agent. - [Second Brain Quickstart](./second-brain-quickstart.md) - 1-minute guide to capturing notes, searching, and exploring the Mind Map. - [Contributor Checklist](./contributor-checklist.md) - Step-by-step checklist for adding or updating a note so it passes validation and shows up on the site."}],"body":"# Onboarding\n\nStart here if you are new to this knowledge base, as a person or as an AI agent.\n\n- [Second Brain Quickstart](./second-brain-quickstart.md) - 1-minute guide to capturing notes, searching, and exploring the Mind Map.\n- [Contributor Checklist](./contributor-checklist.md) - Step-by-step checklist for adding or updating a note so it passes validation and shows up on the site.\n","color":"#1c1917","backlinks":["AGENTS.md","ARCHITECTURE.md","index.md"],"inGraph":true},{"id":"onboarding/second-brain-quickstart.md","title":"Second Brain Quickstart","subtitle":"How to capture notes, search, and explore the Mind Map","type":"note","group":null,"description":"A 1-minute plain-English guide to using your Second Brain with AI, Developer Docs, and the interactive Mind Map.","updated":"2026-11-08","tags":["guide","workflow","mind-map"],"headings":[{"level":2,"text":"1. Let the AI Do the Work (Easiest)","slug":"1-let-the-ai-do-the-work-easiest"},{"level":2,"text":"2. Browse Your Developer Docs & Mind Map","slug":"2-browse-your-developer-docs-mind-map"},{"level":2,"text":"3. Write Notes Yourself","slug":"3-write-notes-yourself"}],"sections":[{"level":1,"title":"Overview","slug":"","text":"# How to Use This Second Brain You don't need any complicated VS Code extensions or rules. Everything here is plain Markdown organized as a clean tree."},{"level":2,"title":"1. Let the AI Do the Work (Easiest)","slug":"1-let-the-ai-do-the-work-easiest","text":"Just ask me in chat: - *\"Add a note about [topic]\"* - *\"Summarize this article/code into a note\"* - *\"Organize my [Inbox](../inbox.md) into clean notes\"* I automatically create the note in the right topic folder, add the [Google OKF](../reference/open-knowledge-format.md) header, link it from that folder's `index.md`, and update your Mind Map."},{"level":2,"title":"2. Browse Your Developer Docs & Mind Map","slug":"2-browse-your-developer-docs-mind-map","text":"Run this command anytime (or ask me to open it): ```bash /usr/local/bin/node scripts/export-graph.mjs && open /tmp/okf-foam-graph.html ``` - **Left Sidebar:** Search and jump to any note like real developer documentation. - **Center Docs Pane:** Read your notes with clickable links between pages. - **Interactive Mind Map:** Expand or collapse (`+` / `-`) branches from `My Second Brain` → `Sections` → `Notes` → `Headings inside each note`."},{"level":2,"title":"3. Write Notes Yourself","slug":"3-write-notes-yourself","text":"If you want to write by hand, just type in [`inbox.md`](../inbox.md) or create a `.md` file in the topic folder it belongs to (for example `runbooks/` or `decisions/`). See the [contributor checklist](./contributor-checklist.md) for the details."}],"body":"\n# How to Use This Second Brain\n\nYou don't need any complicated VS Code extensions or rules. Everything here is plain Markdown organized as a clean tree.\n\n## 1. Let the AI Do the Work (Easiest)\n\nJust ask me in chat:\n- *\"Add a note about [topic]\"*\n- *\"Summarize this article/code into a note\"*\n- *\"Organize my [Inbox](../inbox.md) into clean notes\"*\n\nI automatically create the note in the right topic folder, add the [Google OKF](../reference/open-knowledge-format.md) header, link it from that folder's `index.md`, and update your Mind Map.\n\n## 2. Browse Your Developer Docs & Mind Map\n\nRun this command anytime (or ask me to open it):\n```bash\n/usr/local/bin/node scripts/export-graph.mjs && open /tmp/okf-foam-graph.html\n```\n- **Left Sidebar:** Search and jump to any note like real developer documentation.\n- **Center Docs Pane:** Read your notes with clickable links between pages.\n- **Interactive Mind Map:** Expand or collapse (`+` / `-`) branches from `My Second Brain` → `Sections` → `Notes` → `Headings inside each note`.\n\n## 3. Write Notes Yourself\n\nIf you want to write by hand, just type in [`inbox.md`](../inbox.md) or create a `.md` file in the topic folder it belongs to (for example `runbooks/` or `decisions/`). See the [contributor checklist](./contributor-checklist.md) for the details.\n","color":"#44403c","backlinks":["AGENTS.md","onboarding/index.md","reference/open-knowledge-format.md"],"inGraph":true},{"id":"reference/glossary.md","title":"Glossary","subtitle":"Terms used across this knowledge base","type":"reference","group":null,"description":"Short definitions of OKF, frontmatter, note types, progressive disclosure, and the other terms used across this knowledge base.","updated":"2026-11-08","tags":["reference","okf","onboarding"],"headings":[{"level":2,"text":"Format","slug":"format"},{"level":2,"text":"Note types","slug":"note-types"},{"level":2,"text":"Site","slug":"site"}],"sections":[{"level":1,"title":"Overview","slug":"","text":"# Glossary"},{"level":2,"title":"Format","slug":"format","text":"- **OKF (Open Knowledge Format):** Google's convention for organizing Markdown as a tree with typed notes. See [Google Open Knowledge Format](./open-knowledge-format.md). - **Frontmatter:** The YAML block between `---` lines at the top of a note. Holds `type`, `title`, `description`, `tags`, and `updated`. - **Progressive disclosure:** Reading the root index first and opening only the branch you need, instead of everything at once. It saves AI agents tokens and keeps humans oriented. - **Topic folder:** A folder such as `runbooks/` with its own `index.md` listing the notes inside."},{"level":2,"title":"Note types","slug":"note-types","text":"- **`concept`:** Explains an idea or how something works. - **`decision`:** Records a choice and why it was made. See [ADR-001](../decisions/adr-001-okf-markdown-knowledge-base.md). - **`playbook`:** Step-by-step procedure. See the [deploy runbook](../runbooks/deploy-docs-site.md). - **`reference`:** Facts to look up, like this glossary. - **`note`:** Anything that doesn't fit the above yet."},{"level":2,"title":"Site","slug":"site","text":"- **Graph:** Shows how notes link to each other. Drag nodes, pan, zoom, and click to read. - **Mind map:** Shows the folder tree. Use the `+` / `-` badges to expand and collapse branches. - **Slide-over:** The panel that opens when you click a note in full-screen graph or mind map view. - **Tribal knowledge:** What a team knows but has never written down. The point of this repo is to write it down."}],"body":"\n# Glossary\n\n## Format\n\n- **OKF (Open Knowledge Format):** Google's convention for organizing Markdown as a tree with typed notes. See [Google Open Knowledge Format](./open-knowledge-format.md).\n- **Frontmatter:** The YAML block between `---` lines at the top of a note. Holds `type`, `title`, `description`, `tags`, and `updated`.\n- **Progressive disclosure:** Reading the root index first and opening only the branch you need, instead of everything at once. It saves AI agents tokens and keeps humans oriented.\n- **Topic folder:** A folder such as `runbooks/` with its own `index.md` listing the notes inside.\n\n## Note types\n\n- **`concept`:** Explains an idea or how something works.\n- **`decision`:** Records a choice and why it was made. See [ADR-001](../decisions/adr-001-okf-markdown-knowledge-base.md).\n- **`playbook`:** Step-by-step procedure. See the [deploy runbook](../runbooks/deploy-docs-site.md).\n- **`reference`:** Facts to look up, like this glossary.\n- **`note`:** Anything that doesn't fit the above yet.\n\n## Site\n\n- **Graph:** Shows how notes link to each other. Drag nodes, pan, zoom, and click to read.\n- **Mind map:** Shows the folder tree. Use the `+` / `-` badges to expand and collapse branches.\n- **Slide-over:** The panel that opens when you click a note in full-screen graph or mind map view.\n- **Tribal knowledge:** What a team knows but has never written down. The point of this repo is to write it down.\n","color":"#57534e","backlinks":["AGENTS.md","reference/index.md","reference/open-knowledge-format.md"],"inGraph":true},{"id":"reference/index.md","title":"Reference","subtitle":"OKF Knowledge Index","type":"index","group":null,"description":"OKF Knowledge Index","updated":"","tags":[],"headings":[],"sections":[{"level":1,"title":"Overview","slug":"","text":"# Reference Definitions, specs, and explainers to look things up in. - [Google Open Knowledge Format (OKF)](./open-knowledge-format.md) - How OKF structures Markdown files as a progressive tree for AI agents and Mind Maps. - [Glossary](./glossary.md) - Short definitions of the terms used across this knowledge base."}],"body":"# Reference\n\nDefinitions, specs, and explainers to look things up in.\n\n- [Google Open Knowledge Format (OKF)](./open-knowledge-format.md) - How OKF structures Markdown files as a progressive tree for AI agents and Mind Maps.\n- [Glossary](./glossary.md) - Short definitions of the terms used across this knowledge base.\n","color":"#1c1917","backlinks":["AGENTS.md","index.md"],"inGraph":true},{"id":"reference/open-knowledge-format.md","title":"Google Open Knowledge Format (OKF)","subtitle":"Progressive disclosure tree for AI agents (OKF v0.2)","type":"concept","group":null,"description":"How Google's Open Knowledge Format (OKF) structures Markdown files as a progressive tree for AI agents and Mind Maps.","updated":"2026-11-08","tags":["okf","ai-agents","mind-map"],"headings":[{"level":2,"text":"Progressive Disclosure Tree","slug":"progressive-disclosure-tree"},{"level":2,"text":"Why Open Knowledge Format (OKF) Scales","slug":"why-open-knowledge-format-okf-scales"}],"sections":[{"level":1,"title":"Overview","slug":"","text":"# What is Google Open Knowledge Format (OKF)? **Google's Open Knowledge Format (OKF v0.2)** is a simple standard for organizing Markdown files so humans and AI agents never get lost."},{"level":2,"title":"Progressive Disclosure Tree","slug":"progressive-disclosure-tree","text":"Instead of a messy spiderweb of links, **Open Knowledge Format (OKF)** organizes knowledge like a **Mind Map tree**: | Layer | File Pattern | Purpose in Open Knowledge Format (OKF) | | :--- | :--- | :--- | | **1. Root Index** | [`index.md`](../index.md) | Top-level table of contents listing every topic folder. | | **2. Topic Manifest** | `<topic>/index.md` | Folder index summarizing the notes inside that branch. | | **3. Concept & Note Cards** | `<topic>/<note>.md` | Typed Markdown notes (`concept`, `decision`, `playbook`, `reference`). | | **4. Change Log** | [`log.md`](../log.md) | Chronological history maintained automatically by your AI agent. | - **Root ([`index.md`](../index.md)):** The table of contents listing your topics with one-sentence summaries. - **Topic folders (`onboarding/`, `runbooks/`, ...):** Each has its own `index.md` listing the notes inside it. - **Typed Notes:** Each note has a small YAML header (`type`, `title`, `description`, `updated`) and clean `##` headings. See the [glossary](./glossary.md)."},{"level":2,"title":"Why Open Knowledge Format (OKF) Scales","slug":"why-open-knowledge-format-okf-scales","text":"- **For AI Agents:** The AI reads [`index.md`](../index.md) first and drills down only into the branch it needs, saving tokens and avoiding confusion. - **For Humans:** The exact same tree renders as a collapsible **Mind Map** and clean **Developer Docs** (see the [Second Brain Quickstart](../onboarding/second-brain-quickstart.md)). - **For Teams:** Why we chose this format is recorded in [ADR-001](../decisions/adr-001-okf-markdown-knowledge-base.md)."}],"body":"\n# What is Google Open Knowledge Format (OKF)?\n\n**Google's Open Knowledge Format (OKF v0.2)** is a simple standard for organizing Markdown files so humans and AI agents never get lost.\n\n## Progressive Disclosure Tree\n\nInstead of a messy spiderweb of links, **Open Knowledge Format (OKF)** organizes knowledge like a **Mind Map tree**:\n\n| Layer | File Pattern | Purpose in Open Knowledge Format (OKF) |\n| :--- | :--- | :--- |\n| **1. Root Index** | [`index.md`](../index.md) | Top-level table of contents listing every topic folder. |\n| **2. Topic Manifest** | `<topic>/index.md` | Folder index summarizing the notes inside that branch. |\n| **3. Concept & Note Cards** | `<topic>/<note>.md` | Typed Markdown notes (`concept`, `decision`, `playbook`, `reference`). |\n| **4. Change Log** | [`log.md`](../log.md) | Chronological history maintained automatically by your AI agent. |\n\n- **Root ([`index.md`](../index.md)):** The table of contents listing your topics with one-sentence summaries.\n- **Topic folders (`onboarding/`, `runbooks/`, ...):** Each has its own `index.md` listing the notes inside it.\n- **Typed Notes:** Each note has a small YAML header (`type`, `title`, `description`, `updated`) and clean `##` headings. See the [glossary](./glossary.md).\n\n## Why Open Knowledge Format (OKF) Scales\n\n- **For AI Agents:** The AI reads [`index.md`](../index.md) first and drills down only into the branch it needs, saving tokens and avoiding confusion.\n- **For Humans:** The exact same tree renders as a collapsible **Mind Map** and clean **Developer Docs** (see the [Second Brain Quickstart](../onboarding/second-brain-quickstart.md)).\n- **For Teams:** Why we chose this format is recorded in [ADR-001](../decisions/adr-001-okf-markdown-knowledge-base.md).\n","color":"#44403c","backlinks":["AGENTS.md","ARCHITECTURE.md","decisions/adr-001-okf-markdown-knowledge-base.md","onboarding/second-brain-quickstart.md","reference/glossary.md","reference/index.md"],"inGraph":true},{"id":"runbooks/deploy-docs-site.md","title":"Deploy the Docs Site","subtitle":"From git push to a live GitHub Pages site","type":"playbook","group":null,"description":"How a push to main becomes the live GitHub Pages site, how to check a deploy, and how to fix the common failures.","updated":"2026-11-08","tags":["runbook","deploy","github-pages"],"headings":[{"level":2,"text":"Normal deploy","slug":"normal-deploy"},{"level":2,"text":"Fix: \"Get Pages site failed ... Not Found\"","slug":"fix-get-pages-site-failed-not-found"},{"level":2,"text":"Fix: validation failed","slug":"fix-validation-failed"},{"level":2,"text":"Related","slug":"related"}],"sections":[{"level":1,"title":"Overview","slug":"","text":"# Deploy the Docs Site Every push to `main` runs the [deploy workflow](../.github/workflows/deploy.yml). It validates the notes, builds `site/`, and publishes it to GitHub Pages."},{"level":2,"title":"Normal deploy","slug":"normal-deploy","text":"```bash git add -A git commit -m \"docs: describe the change\" git push origin main ``` Check the result: ```bash gh run list --limit 3 gh run view --log-failed # only if the latest run failed ``` The site updates about 30 seconds after the run turns green."},{"level":2,"title":"Fix: \"Get Pages site failed ... Not Found\"","slug":"fix-get-pages-site-failed-not-found","text":"**Symptom:** the `Setup Pages` step fails with `HttpError: Not Found`. **Cause:** GitHub Pages is not enabled for the repository yet, so there is no site to deploy to. **Fix:** enable Pages with GitHub Actions as the source, then re-run: ```bash gh api --method POST /repos/<owner>/<repo>/pages -f build_type=workflow gh run rerun <run-id> ``` Or in the browser: **Settings → Pages → Source: GitHub Actions**."},{"level":2,"title":"Fix: validation failed","slug":"fix-validation-failed","text":"**Symptom:** the `Validate OKF & Build Site` step fails. **Cause:** a note is missing frontmatter, or a relative link points to a file that does not exist. **Fix:** run the validator locally. It prints the file and the problem: ```bash node scripts/validate-okf.mjs ``` Then follow the [contributor checklist](../onboarding/contributor-checklist.md)."},{"level":2,"title":"Related","slug":"related","text":"- [ADR-001: OKF Markdown as our knowledge base](../decisions/adr-001-okf-markdown-knowledge-base.md), which explains why the site is built from plain Markdown."}],"body":"\n# Deploy the Docs Site\n\nEvery push to `main` runs the [deploy workflow](../.github/workflows/deploy.yml). It validates the notes, builds `site/`, and publishes it to GitHub Pages.\n\n## Normal deploy\n\n```bash\ngit add -A\ngit commit -m \"docs: describe the change\"\ngit push origin main\n```\n\nCheck the result:\n\n```bash\ngh run list --limit 3\ngh run view --log-failed   # only if the latest run failed\n```\n\nThe site updates about 30 seconds after the run turns green.\n\n## Fix: \"Get Pages site failed ... Not Found\"\n\n**Symptom:** the `Setup Pages` step fails with `HttpError: Not Found`.\n\n**Cause:** GitHub Pages is not enabled for the repository yet, so there is no site to deploy to.\n\n**Fix:** enable Pages with GitHub Actions as the source, then re-run:\n\n```bash\ngh api --method POST /repos/<owner>/<repo>/pages -f build_type=workflow\ngh run rerun <run-id>\n```\n\nOr in the browser: **Settings → Pages → Source: GitHub Actions**.\n\n## Fix: validation failed\n\n**Symptom:** the `Validate OKF & Build Site` step fails.\n\n**Cause:** a note is missing frontmatter, or a relative link points to a file that does not exist.\n\n**Fix:** run the validator locally. It prints the file and the problem:\n\n```bash\nnode scripts/validate-okf.mjs\n```\n\nThen follow the [contributor checklist](../onboarding/contributor-checklist.md).\n\n## Related\n\n- [ADR-001: OKF Markdown as our knowledge base](../decisions/adr-001-okf-markdown-knowledge-base.md), which explains why the site is built from plain Markdown.\n","color":"#57534e","backlinks":["AGENTS.md","decisions/adr-001-okf-markdown-kn function slugify(text) {
  return text.replace(/`([^`]+)`/g, '$1').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}

function resolvePath(baseFile, relTarget) {
  const clean = relTarget.split('#')[0].trim();
  if (!clean) return currentDocId;
  const dir = baseFile.includes('/') ? baseFile.slice(0, baseFile.lastIndexOf('/')) : '';
  const parts = (dir ? dir + '/' + clean : clean).split('/');
  const stack = [];
  for (const p of parts) {
    if (!p || p === '.') continue;
    if (p === '..') stack.pop();
    else stack.push(p);
  }
  const joined = stack.join('/');
  if (nodeById.has(joined)) return joined;
  if (nodeById.has(joined + '.md')) return joined + '.md';
  return joined;
}

function escapeHtml(str) {
  return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function toggleCodeTheme() {

function injectHexSwatches(escapedStr) {
  return escapedStr.replace(/#([0-9A-Fa-f]{6,8})\b/g, (full, hex) => {
    const rgbHex = '#' + hex.slice(0, 6);
    return `<span class="code-swatch" style="background:${rgbHex}"></span>${full}`;
  });
}

/* Shiki / Expressive-Code 12-Token Multi-Grammar Line Highlighter */
function highlightLineTokens(rawLine, lang) {
  const trimmed = rawLine.trim();
  if (!trimmed) return ' ';

  // 1. Full-line comments
  if ((lang === 'bash' || lang === 'sh' || lang === 'yaml' || lang === 'py' || lang === 'python' || lang === 'text') && trimmed.startsWith('#')) {
    return `<span class="tok-com">${escapeHtml(rawLine)}</span>`;
  }
  if ((lang === 'json' || lang === 'js' || lang === 'ts' || lang === 'css') && trimmed.startsWith('//')) {
    return `<span class="tok-com">${escapeHtml(rawLine)}</span>`;
  }

  const tokens = [];
  function stash(htmlSpan) {
    tokens.push(htmlSpan);
    return `@@TOK_${tokens.length - 1}@@`;
  }

  let work = escapeHtml(rawLine);

  // 2. Trailing comments (# in bash/yaml/python, // in js)
  if (lang === 'bash' || lang === 'sh' || lang === 'yaml' || lang === 'py' || lang === 'python') {
    work = work.replace(/(\s+#[^"']*)$/g, m => stash(`<span class="tok-com">${m}</span>`));
  }

  // 3. JSON / Dict / Object quoted keys ("key":)
  work = work.replace(/"([^"\\]*(?:\\.[^"\\]*)*)"(\s*:)/g, (_, k, colon) => {
    if (k.startsWith('$')) {
      return stash(`<span class="tok-var">"${k}"</span>`) + stash(`<span class="tok-op">${colon}</span>`);
    }
    return stash(`<span class="tok-key">"${k}"</span>`) + stash(`<span class="tok-op">${colon}</span>`);
  });

  // 4. Unquoted YAML / Prompt Spec keys at start of line or bullet (e.g. "   - BackgroundColor: ")
  work = work.replace(/^(\s*(?:[-*]\s+|\d+\.\s+)?)([A-Za-z_][A-Za-z0-9_.-]*)(\s*:)(?=\s|$)/, (_, pre, key, colon) =>
    pre + stash(`<span class="tok-key">${key}</span>`) + stash(`<span class="tok-op">${colon}</span>`)
  );

  // 5. Byte strings & regular strings (with inline hex color swatches!)
  work = work.replace(/(\bb)?("[^"\\]*(?:\\.[^"\\]*)*"|'[^'\\]*(?:\\.[^'\\]*)*')/g, (full, bPrefix, strPart) => {
    const inner = injectHexSwatches(strPart);
    if (bPrefix) {
      return stash(`<span class="tok-kw">b</span><span class="tok-str">${inner}</span>`);
    }
    return stash(`<span class="tok-str">${inner}</span>`);
  });

  // 6. Inline hex colors outside strings (e.g. (#161A28 at 60% opacity))
  work = work.replace(/#([0-9A-Fa-f]{6,8})\b/g, (full, hex) => {
    const rgbHex = '#' + hex.slice(0, 6);
    return stash(`<span class="tok-num"><span class="code-swatch" style="background:${rgbHex}"></span>${full}</span>`);
  });

  // 7. Shell & Environment Variables ($VAR)
  work = work.replace(/(\$[A-Za-z_][A-Za-z0-9_]*|\${[^}]+})/g, m =>
    stash(`<span class="tok-var">${m}</span>`)
  );

  // 8. CLI Flags (--install-extension, -dr)
  work = work.replace(/(\s)(--?[A-Za-z0-9_-]+)/g, (_, sp, fl) =>
    sp + stash(`<span class="tok-flag">${fl}</span>`)
  );

  // 9. File Paths & VS Code Extension IDs (~/Library/..., enkia.tokyo-night)
  work = work.replace(/(~\/[A-Za-z0-9_./-]+|\b(?:enkia\.tokyo-night|illixion\.vscode-vibrancy-continued|pkief\.material-icon-theme|com\.apple\.[A-Za-z0-9_.-]+)\b)/g, m =>
    stash(`<span class="tok-path">${m}</span>`)
  );

  // 10. Function & Method calls: identifier followed by (
  work = work.replace(/\b([A-Za-z_][A-Za-z0-9_]*)(?=\s*\()/g, (m) => {
    if (/^(if|for|while|with|return|def|class|import|from)$/.test(m)) {
      return stash(`<span class="tok-kw">${m}</span>`);
    }
    return stash(`<span class="tok-fn">${m}</span>`);
  });

  // 11. Booleans & Null/None
  work = work.replace(/\b(True|False|None|true|false|null|undefined)\b/g, m =>
    stash(`<span class="tok-bool">${m}</span>`)
  );

  // 12. Language Keywords
  work = work.replace(/\b(import|from|def|return|if|else|elif|for|in|while|with|as|try|except|finally|class|const|let|var|function|async|await|export|default)\b/g, m =>
    stash(`<span class="tok-kw">${m}</span>`)
  );

  // 13. Built-in Modules, Classes & Constants
  work = work.replace(/\b(os|plistlib|subprocess|glob|re|path|FMT_BINARY|UID|NSKeyedArchiver|NSColor|NSFont|NSObject|NSRGB|NSColorSpace|NSSize|NSfFlags|NSName|WindowServer)\b/g, m =>
    stash(`<span class="tok-builtin">${m}</span>`)
  );

  // 14. CLI Commands & Binaries
  work = work.replace(/\b(python3|python|node|npm|npx|git|code|agy|sudo|xattr|defaults|plutil|killall|cfprefsd|open|mkdir|rm|cp|cat|echo|export|pip|brew|curl|EOF)\b/g, m =>
    stash(`<span class="tok-cmd">${m}</span>`)
  );

  // 15. Numbers, Floats & Percentages
  work = work.replace(/\b(\d+(?:\.\d+)?%?)\b/g, m =>
    stash(`<span class="tok-num">${m}</span>`)
  );

  return work.replace(/@@TOK_(\d+)@@/g, (_, idx) => tokens[Number(idx)]);
}

function dedentLines(lines) {
  let minIndent = Infinity;
  for (const l of lines) {
    if (!l.trim()) continue;
    const m = l.match(/^( +)/);
    const indent = m ? m[1].length : 0;
    if (indent < minIndent) minIndent = indent;
  }
  if (minIndent > 0 && minIndent < Infinity) {
    return lines.map(l => l.slice(minIndent));
  }
  return lines;
}

function renderCodeBlock(rawCode, lang, idx) {
  const cleanLang = (lang || 'text').toLowerCase();
  const rawLines = dedentLines(rawCode.split('\n'));

  // Detect embedded Python heredoc inside bash (e.g., python3 - <<'EOF')
  let hasEmbeddedPython = false;
  let activeLineLang = cleanLang;
  const rowsHtml = rawLines.map((line, i) => {
    const trimmed = line.trim();
    if ((cleanLang === 'bash' || cleanLang === 'sh') && /python3?\s+.*<<\s*['"]?EOF['"]?/.test(trimmed)) {
      hasEmbeddedPython = true;
      const htmlLine = highlightLineTokens(line, 'bash');
      activeLineLang = 'python';
      return `<tr><td class="code-ln">${i + 1}</td><td class="code-line">${htmlLine}</td></tr>`;
    }
    if (activeLineLang === 'python' && trimmed === 'EOF') {
      activeLineLang = cleanLang;
      const htmlLine = highlightLineTokens(line, 'bash');
      return `<tr><td class="code-ln">${i + 1}</td><td class="code-line">${htmlLine}</td></tr>`;
    }
    const lineHtml = highlightLineTokens(line, activeLineLang);
    return `<tr><td class="code-ln">${i + 1}</td><td class="code-line">${lineHtml}</td></tr>`;
  }).join('');

  const displayLang = hasEmbeddedPython
    ? 'bash · python'
    : (cleanLang === 'text' ? 'prompt spec' : cleanLang);
  const themeLabel = currentCodeTheme === 'tokyo' ? 'Tokyo Night' : 'Match Page';

  return `
    <div class="code-block-wrap">
      <div class="code-block-header">
        <div class="code-header-left">
          <span class="code-window-dots">
            <span class="code-window-dot dot-r"></span>
            <span class="code-window-dot dot-y"></span>
            <span class="code-window-dot dot-g"></span>
          </span>
          <span class="lang-label">${escapeHtml(displayLang)}</span>
        </div>
        <div class="code-header-actions">
          <button class="code-theme-btn" onclick="toggleCodeTheme()" title="Switch code block syntax theme (Tokyo Night IDE vs Adaptive Page)">
            <span>🎨</span>
            <span class="code-theme-label">${themeLabel}</span>
          </button>
          <button class="copy-btn" onclick="copyCode(${idx}, this)" title="Copy to clipboard">
            ${SVG_COPY}
            <span>Copy</span>
          </button>
        </div>
      </div>
      <div class="code-scroll">
        <table class="code-table"><tbody>${rowsHtml}</tbody></table>
      </div>
    </div>
  `;
}

function renderInline(text, sourceId) {
  const kbdTokens = [];
  let working = text.replace(/<kbd>([^<]+)<\/kbd>/gi, (_, k) => {
    kbdTokens.push(k);
    return `@@KBD_${kbdTokens.length - 1}@@`;
  });

  const linkTokens = [];
  working = working.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, href) => {
    linkTokens.push({ label, href });
    return `@@LINK_${linkTokens.length - 1}@@`;
  });

  let out = escapeHtml(working);

  out = out.replace(/`([^`]+)`/g, (_, code) => {
    const hexMatch = code.match(/^#([0-9A-Fa-f]{6})$/);
    if (hexMatch) {
      return `<code><span class="color-swatch" style="background:${code}"></span>${code}</code>`;
    }
    return `<code>${code}</code>`;
  });

  out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/\*([^*]+)\*/g, '<em>$1</em>');

  out = out.replace(/@@LINK_(\d+)@@/g, (_, idx) => {
    const { label, href } = linkTokens[Number(idx)];
    const renderedLabel = escapeHtml(label).replace(/`([^`]+)`/g, '<code>$1</code>');
    if (/^(https?:|mailto:)/.test(href)) {
      return `<a href="${href}" target="_blank" class="external-link">${renderedLabel}</a>`;
    }
    const targetId = resolvePath(sourceId, href);
    if (nodeById.has(targetId)) {
      return `<a href="#${encodeURIComponent(targetId)}" class="internal-link" onclick="openDoc('${targetId}'); return false;">${renderedLabel}</a>`;
    }
    return `<a href="#${encodeURIComponent(targetId)}" class="internal-link">${renderedLabel}</a>`;
  });

  out = out.replace(/@@KBD_(\d+)@@/g, (_, idx) => `<kbd>${escapeHtml(kbdTokens[Number(idx)])}</kbd>`);
  return out;
}

function copyCode(idx, btn) {
  navigator.clipboard.writeText(codeStore[idx] || '');
  btn.innerHTML = `${SVG_CHECK}<span>Copied</span>`;
  setTimeout(() => {
    btn.innerHTML = `${SVG_COPY}<span>Copy</span>`;
  }, 1400);
}

function renderMarkdown(md, sourceId) {
  codeStore.length = 0;
  const lines = md.split(/\r?\n/);
  let html = '';
  let inCode = false, codeLang = '', codeBuf = [];
  let inTable = false, tableRows = [];
  let listStack = [];

  function closeListsTo(targetDepth = 0) {
    while (listStack.length > targetDepth) html += `</${listStack.pop()}>`;
  }

  function flushTable() {
    if (!inTable) return;
    inTable = false;
    if (tableRows.length < 2) return;
    const headers = tableRows[0];
    const bodyRows = tableRows.slice(2);
    html += '<table class="md-table"><thead><tr>' + headers.map(h => `<th>${renderInline(h, sourceId)}</th>`).join('') + '</tr></thead><tbody>';
    for (const r of bodyRows) {
      html += '<tr>' + r.map(c => `<td>${renderInline(c, sourceId)}</td>`).join('') + '</tr>';
    }
    html += '</tbody></table>';
    tableRows = [];
  }

  for (const line of lines) {
    const fenceMatch = line.match(/^\s*```(.*)$/);
    if (fenceMatch) {
      flushTable();
      if (!inCode) {
        inCode = true;
        codeLang = (fenceMatch[1] || 'text').trim();
        codeBuf = [];
      } else {
        const rawCode = codeBuf.join('\n');
        const idx = codeStore.push(rawCode) - 1;
        html += renderCodeBlock(rawCode, codeLang, idx);
        inCode = false;
      }
      continue;
    }
    if (inCode) { codeBuf.push(line); continue; }

    if (/^\s*\|.*\|\s*$/.test(line)) {
      closeListsTo(0);
      inTable = true;
      tableRows.push(line.trim().slice(1, -1).split('|').map(c => c.trim()));
      continue;
    } else if (inTable) {
      flushTable();
    }

    if (/^---+$/.test(line.trim())) {
      closeListsTo(0);
      html += '<hr/>';
      continue;
    }

    const hMatch = line.match(/^(#{1,3})\s+(.+)$/);
    if (hMatch) {
      closeListsTo(0);
      const level = hMatch[1].length;
      const idAttr = slugify(hMatch[2]);
      html += `<h${level} id="${idAttr}">${renderInline(hMatch[2], sourceId)}</h${level}>`;
      continue;
    }

    const ulMatch = line.match(/^(\s*)[-*]\s+(.+)$/);
    if (ulMatch) {
      const depth = ulMatch[1].length >= 2 ? 2 : 1;
      while (listStack.length < depth) { html += '<ul>'; listStack.push('ul'); }
      while (listStack.length > depth) html += `</${listStack.pop()}>`;
      html += `<li>${renderInline(ulMatch[2], sourceId)}</li>`;
      continue;
    }

    const olMatch = line.match(/^(\s*)\d+\.\s+(.+)$/);
    if (olMatch) {
      const depth = olMatch[1].length >= 2 ? 2 : 1;
      while (listStack.length < depth) { html += '<ol>'; listStack.push('ol'); }
      while (listStack.length > depth) html += `</${listStack.pop()}>`;
      html += `<li>${renderInline(olMatch[2], sourceId)}</li>`;
      continue;
    }

    if (!line.trim()) continue;
    closeListsTo(0);
    html += `<p>${renderInline(line, sourceId)}</p>`;
  }
  flushTable();
  closeListsTo(0);
  return html;
}

function getSidebarGroups() {
  const dynamicFolderGroups = (data.sidebarGroups || []).map(g => ({
    key: 'dir:' + g.dir,
    title: g.title,
    color: g.color,
    filter: n => n.id.startsWith(g.dir + '/')
  }));
  return [
    { key: 'overview', title: 'Overview', color: '#6366f1', filter: n => n.id === 'index.md' || n.id === 'inbox.md' },
    ...dynamicFolderGroups,
    { key: 'system', title: 'Governance', color: '#38bdf8', filter: n => n.id === 'AGENTS.md' || n.id === 'ARCHITECTURE.md' || n.id === 'log.md' }
  ];
}

function getOrderedDocs() {
  const groups = getSidebarGroups();
  const ordered = [];
  for (const g of groups) {
    const items = data.nodes.filter(n => g.filter(n));
    for (const item of items) {
      ordered.push({ doc: item, groupTitle: g.title, groupColor: g.color });
    }
  }
  return ordered;
}

/* Unsquished Tag Popover Dropdown + Collapsible Sidebar Tags Section */
function toggleTagPopover(e) {
  if (e) e.stopPropagation();
  const pop = document.getElementById('tag-popover');
  const btn = document.getElementById('tag-dropdown-btn');
  const isOpen = pop.classList.toggle('open');
  btn.classList.toggle('open', isOpen);
  if (isOpen) {
    const inp = document.getElementById('tag-popover-input');
    inp.value = '';
    renderTagPopoverList();
    setTimeout(() => inp.focus(), 20);
  }
}

window.addEventListener('click', () => {
  const pop = document.getElementById('tag-popover');
  const btn = document.getElementById('tag-dropdown-btn');
  if (pop && pop.classList.contains('open')) {
    pop.classList.remove('open');
    btn.classList.remove('open');
  }
});

function selectTagFilter(tag) {
  activeTagFilter = activeTagFilter === tag ? null : tag;
  const pop = document.getElementById('tag-popover');
  const btn = document.getElementById('tag-dropdown-btn');
  if (pop) pop.classList.remove('open');
  if (btn) btn.classList.remove('open');
  updateTagDropdownTrigger();
  renderTagPopoverList();
  renderSidebar();
}

function updateTagDropdownTrigger() {
  const labelEl = document.getElementById('tag-dropdown-label');
  if (!activeTagFilter) {
    labelEl.innerHTML = `Filter by tag <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px">(${(data.tags || []).length})</span>`;
  } else {
    labelEl.innerHTML = `Tag: <span class="active-tag-badge">#${escapeHtml(activeTagFilter)} <span onclick="event.stopPropagation();selectTagFilter(null)" title="Clear tag filter" style="cursor:pointer;opacity:0.75">×</span></span>`;
  }
}

function renderTagPopoverList() {
  const listEl = document.getElementById('tag-popover-list');
  const q = (document.getElementById('tag-popover-input')?.value || '').trim().toLowerCase().replace(/^#/, '');
  const tags = (data.tags || []).filter(t => !q || t.name.toLowerCase().includes(q));

  let html = `
    <div class="tag-row-item ${!activeTagFilter ? 'active' : ''}" onclick="selectTagFilter(null)">
      <span class="tag-row-name">All Documents</span>
      <span class="tag-row-count">${data.nodes.length}</span>
    </div>
  `;
  for (const t of tags) {
    const isActive = activeTagFilter === t.name;
    html += `
      <div class="tag-row-item ${isActive ? 'active' : ''}" onclick="selectTagFilter('${t.name}')">
        <span class="tag-row-name">#${escapeHtml(t.name)}</span>
        <span class="tag-row-count">${t.count}</span>
      </div>
    `;
  }
  if (!tags.length) {
    html += '<div style="padding:10px;text-align:center;color:var(--text-muted);font-size:11.5px">No matching tags</div>';
  }
  listEl.innerHTML = html;
}

function toggleSidebarFolder(groupKey) {
  if (collapsedSidebarFolders.has(groupKey)) collapsedSidebarFolders.delete(groupKey);
  else collapsedSidebarFolders.add(groupKey);
  renderSidebar();
}

function renderNavDocItem(item) {
  const isActive = item.id === currentDocId;
  const tipText = item.subtitle ? `${item.subtitle} — ${item.description || ''}` : (item.description || item.id);
  let html = `
    <div class="nav-item ${isActive ? 'active' : ''}" title="${escapeHtml(tipText)}" onclick="openDoc('${item.id}'); if (layoutMode === 'full') openPeek();">
      <span class="nav-item-title">${escapeHtml(item.title)}</span>
    </div>`;
  if (isActive && item.headings && item.headings.length > 0) {
    const h2s = item.headings.filter(h => h.level === 2);
    if (h2s.length > 0) {
      html += `<div class="nav-subitems">`;
      for (const h of h2s) {
        html += `<div class="nav-subitem" onclick="scrollToSection('${h.slug}')">${escapeHtml(h.text)}</div>`;
      }
      html += `</div>`;
    }
  }
  return html;
}

function renderSidebar() {
  const nav = document.getElementById('nav-list');
  const groups = getSidebarGroups();

  let out = '';
  for (const g of groups) {
    const items = data.nodes.filter(n => g.filter(n) && (!activeTagFilter || (n.tags || []).includes(activeTagFilter)));
    if (!items.length) continue;
    const isCollapsed = collapsedSidebarFolders.has(g.key);
    out += `
      <div class="nav-folder ${isCollapsed ? 'collapsed' : ''}">
        <div class="nav-folder-header" onclick="toggleSidebarFolder('${g.key}')">
          <div class="folder-left">
            <span class="folder-chevron">${SVG_CHEVRON_DOWN}</span>
            <span>${escapeHtml(g.title)}</span>
          </div>
          <span class="folder-count">${items.length}</span>
        </div>
        <div class="nav-folder-items">`;

    const ungrouped = items.filter(i => !i.group);
    const subMap = new Map();
    for (const i of items) {
      if (i.group) {
        if (!subMap.has(i.group)) subMap.set(i.group, []);
        subMap.get(i.group).push(i);
      }
    }

    for (const item of ungrouped) {
      out += renderNavDocItem(item);
    }

    for (const [subName, subItems] of subMap.entries()) {
      const subKey = `subgroup:${g.key}:${subName}`;
      const hasActiveChild = subItems.some(si => si.id === currentDocId);
      if (hasActiveChild) collapsedSidebarFolders.delete(subKey);
      const isSubCollapsed = collapsedSidebarFolders.has(subKey);
      out += `
        <div class="nav-subgroup ${isSubCollapsed ? 'collapsed' : ''}">
          <div class="nav-subgroup-header" onclick="toggleSidebarFolder('${subKey}')">
            <div class="folder-left">
              <span class="folder-chevron">${SVG_CHEVRON_DOWN}</span>
              <span>${escapeHtml(subName)}</span>
            </div>
            <span class="folder-count">${subItems.length}</span>
          </div>
          <div class="nav-subgroup-items">`;
      for (const subItem of subItems) {
        out += renderNavDocItem(subItem);
      }
      out += `</div></div>`;
    }

    out += `</div></div>`;
  }

  // Collapsible 1-Row-Per-Tag Tree Section at Bottom of Sidebar
  if (data.tags && data.tags.length > 0) {
    const isTagsCollapsed = collapsedSidebarFolders.has('tags-tree');
    out += `
      <div class="nav-folder ${isTagsCollapsed ? 'collapsed' : ''}">
        <div class="nav-folder-header" onclick="toggleSidebarFolder('tags-tree')">
          <div class="folder-left">
            <span class="folder-chevron">${SVG_CHEVRON_DOWN}</span>
            <span>Tags</span>
          </div>
          <span class="folder-count">${data.tags.length}</span>
        </div>
        <div class="nav-folder-items">`;
    for (const t of data.tags) {
      const isTagActive = activeTagFilter === t.name;
      out += `
        <div class="nav-item ${isTagActive ? 'active' : ''}" onclick="selectTagFilter('${t.name}')">
          <span class="nav-item-title" style="font-family:var(--font-mono);font-size:12px">#${escapeHtml(t.name)}</span>
          <span class="nav-item-badge">${t.count}</span>
        </div>`;
    }
    out += `</div></div>`;
  }

  nav.innerHTML = out;
}

function scrollToSection(slug) {
  const el = document.getElementById(slug);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function expandPathToDoc(docId) {
  if (!rootTree) return;
  function walk(n) {
    if (!n.children || !n.children.length) return false;
    let found = false;
    for (const c of n.children) {
      if (c.docId === docId || walk(c)) found = true;
    }
    if (found && (n.sublabel === 'branch' || n.sublabel === 'subgroup')) {
      n.collapsed = false;
    }
    return found;
  }
  walk(rootTree);
}

function openDoc(id, sectionSlug = null) {
  const node = nodeById.get(id);
  if (!node) return;
  currentDocId = id;
  window.location.hash = encodeURIComponent(id);
  expandPathToDoc(id);
  if (vizType === 'mindmap') computeTreeLayout(rootTree);

  const ordered = getOrderedDocs();
  const currentEntryIdx = ordered.findIndex(e => e.doc.id === id);
  const groupTitle = currentEntryIdx !== -1 ? ordered[currentEntryIdx].groupTitle : 'Workspace';

  // Header & Document Hero Breadcrumbs
  document.getElementById('header-breadcrumb').innerHTML = `
    <span class="bc-folder">${escapeHtml(groupTitle)}</span>
    <span class="bc-sep">${SVG_CHEVRON_RIGHT}</span>
    <span class="bc-current">${escapeHtml(node.title)}</span>
  `;

  document.getElementById('doc-breadcrumb').innerHTML = `
    <span class="bc-dot" style="background:${node.color}"></span>
    <span>${escapeHtml(groupTitle)}</span>
    <span style="opacity:0.4">/</span>
    <span style="color:var(--text-secondary)">${escapeHtml(node.type)}</span>
  `;

  document.getElementById('doc-path').textContent = node.id;
  document.getElementById('doc-updated').textContent = node.updated ? '· ' + node.updated : '';
  document.getElementById('doc-hero-title').textContent = node.title;
  document.getElementById('doc-hero-subtitle').textContent = node.subtitle || '';

  const tagsEl = document.getElementById('doc-tags');
  tagsEl.innerHTML = (node.tags || []).slice().sort().map(t =>
    `<span class="doc-tag-pill" onclick="selectTagFilter('${t}')">#${escapeHtml(t)}</span>`
  ).join('');
  tagsEl.style.display = (node.tags && node.tags.length) ? 'flex' : 'none';

  const descEl = document.getElementById('doc-desc');
  if (node.description && node.description !== node.subtitle) {
    descEl.style.display = 'block';
    descEl.textContent = node.description;
  } else {
    descEl.style.display = 'none';
  }

  document.getElementById('doc-body').innerHTML = renderMarkdown(node.body, node.id);

  // TOC
  const tocEl = document.getElementById('doc-toc');
  const tocLinks = document.getElementById('toc-links');
  if (node.headings && node.headings.length > 0) {
    tocEl.classList.add('visible');
    tocLinks.innerHTML = node.headings.map(h =>
      `<a class="toc-link toc-h${h.level}" onclick="scrollToSection('${h.slug}')">${escapeHtml(h.text)}</a>`
    ).join('');
  } else {
    tocEl.classList.remove('visible');
  }

  // Mintlify / VitePress Prev / Next Cards
  const pnEl = document.getElementById('doc-prev-next');
  const prevEntry = currentEntryIdx > 0 ? ordered[currentEntryIdx - 1] : null;
  const nextEntry = (currentEntryIdx !== -1 && currentEntryIdx < ordered.length - 1) ? ordered[currentEntryIdx + 1] : null;

  let pnHtml = '';
  if (prevEntry) {
    pnHtml += `
      <div class="pn-card pn-prev" onclick="openDoc('${prevEntry.doc.id}')">
        <span class="pn-label">← Previous</span>
        <div class="pn-title">${escapeHtml(prevEntry.doc.title)}</div>
        <div class="pn-sub">${escapeHtml(prevEntry.doc.subtitle || prevEntry.groupTitle)}</div>
      </div>
    `;
  } else {
    pnHtml += '<div></div>';
  }
  if (nextEntry) {
    pnHtml += `
      <div class="pn-card pn-next" onclick="openDoc('${nextEntry.doc.id}')">
        <span class="pn-label">Next →</span>
        <div class="pn-title">${escapeHtml(nextEntry.doc.title)}</div>
        <div class="pn-sub">${escapeHtml(nextEntry.doc.subtitle || nextEntry.groupTitle)}</div>
      </div>
    `;
  } else {
    pnHtml += '<div></div>';
  }
  pnEl.innerHTML = pnHtml;

  // Backlinks
  const blCards = document.getElementById('backlink-cards');
  if (node.backlinks && node.backlinks.length) {
    blCards.innerHTML = node.backlinks.map(bid => {
      const bn = nodeById.get(bid);
      return `<div class="backlink-card" title="${escapeHtml(bn.subtitle || bn.description)}" onclick="openDoc('${bid}')">
        <span class="nav-dot" style="background:${bn.color}"></span>
        <span>${escapeHtml(bn.title)}</span>
      </div>`;
    }).join('');
  } else {
    blCards.innerHTML = '<span style="font-size:12.5px;color:var(--text-muted)">No incoming references.</span>';
  }

  renderSidebar();
  if (sectionSlug) {
    setTimeout(() => scrollToSection(sectionSlug), 40);
  } else {
    document.getElementById('doc-pane').scrollTop = 0;
  }
}

/* Interactive Drag-Resize Splitters & Dock Position Switcher */
function setDockPosition(pos) {
  dockPosition = pos;
  const splitEl = document.getElementById('content-split');
  const resizerViz = document.getElementById('resizer-viz');
  splitEl.classList.remove('dock-right', 'dock-left', 'dock-bottom');
  splitEl.classList.add('dock-' + pos);

  document.getElementById('btn-dock-left').classList.toggle('active', pos === 'left');
  document.getElementById('btn-dock-bottom').classList.toggle('active', pos === 'bottom');
  document.getElementById('btn-dock-right').classList.toggle('active', pos === 'right');

  if (pos === 'bottom') {
    resizerViz.classList.remove('resizer-x');
    resizerViz.classList.add('resizer-y');
  } else {
    resizerViz.classList.remove('resizer-y');
    resizerViz.classList.add('resizer-x');
  }

  setTimeout(() => { resizeCanvas(); fitView(); }, 25);
}

(function initResizers() {
  const resizerSidebar = document.getElementById('resizer-sidebar');
  const resizerViz = document.getElementById('resizer-viz');
  const contentSplit = document.getElementById('content-split');
  let activeResizer = null;

  resizerSidebar.addEventListener('mousedown', e => {
    e.preventDefault();
    activeResizer = 'sidebar';
    resizerSidebar.classList.add('dragging');
    document.body.classList.add('is-resizing');
  });

  resizerViz.addEventListener('mousedown', e => {
    e.preventDefault();
    activeResizer = 'viz';
    resizerViz.classList.add('dragging');
    document.body.classList.add('is-resizing');
  });

  window.addEventListener('mousemove', e => {
    if (!activeResizer) return;
    if (activeResizer === 'sidebar') {
      const newW = Math.max(180, Math.min(480, e.clientX));
      document.documentElement.style.setProperty('--sidebar-width', newW + 'px');
      resizeCanvas();
    } else if (activeResizer === 'viz') {
      const rect = contentSplit.getBoundingClientRect();
      if (dockPosition === 'right') {
        const newW = Math.max(240, Math.min(rect.width - 280, rect.right - e.clientX));
        document.documentElement.style.setProperty('--viz-width', newW + 'px');
      } else if (dockPosition === 'left') {
        const newW = Math.max(240, Math.min(rect.width - 280, e.clientX - rect.left));
        document.documentElement.style.setProperty('--viz-width', newW + 'px');
      } else if (dockPosition === 'bottom') {
        const newH = Math.max(180, Math.min(rect.height - 180, rect.bottom - e.clientY));
        document.documentElement.style.setProperty('--viz-height', newH + 'px');
      }
      resizeCanvas();
    }
  });

  window.addEventListener('mouseup', () => {
    if (!activeResizer) return;
    resizerSidebar.classList.remove('dragging');
    resizerViz.classList.remove('dragging');
    document.body.classList.remove('is-resizing');
    activeResizer = null;
    resizeCanvas();
  });
})();

/* Cmd+K Spotlight Search Engine (MiniSearch Fuzzy CDN + Built-in Fallback) */
let spotlightHits = [];
let selectedHitIdx = 0;

function ensureMiniSearch() {
  if (miniSearchEngine || !window.MiniSearch) return;
  try {
    miniSearchEngine = new window.MiniSearch({
      fields: ['docTitle', 'sectionTitle', 'text', 'tagsStr'],
      storeFields: ['docId', 'sectionSlug', 'docTitle', 'sectionTitle', 'text'],
      searchOptions: {
        boost: { docTitle: 3, sectionTitle: 2, tagsStr: 2 },
        fuzzy: 0.2,
        prefix: true
      }
    });
    const docsToIndex = [];
    let idCounter = 1;
    for (const doc of data.nodes) {
      const tagsStr = (doc.tags || []).join(' ');
      docsToIndex.push({
        id: idCounter++,
        docId: doc.id,
        sectionSlug: null,
        docTitle: doc.title,
        sectionTitle: doc.subtitle || '',
        text: doc.description || doc.id,
        tagsStr
      });
      for (const sec of doc.sections || []) {
        docsToIndex.push({
          id: idCounter++,
          docId: doc.id,
          sectionSlug: sec.slug || null,
          docTitle: doc.title,
          sectionTitle: sec.title,
          text: sec.text,
          tagsStr
        });
      }
    }
    miniSearchEngine.addAll(docsToIndex);
  } catch (_) {
    miniSearchEngine = null;
  }
}

function openSearchModal() {
  ensureMiniSearch();
  const bd = document.getElementById('search-backdrop');
  bd.classList.add('open');
  const inp = document.getElementById('spotlight-input');
  inp.value = '';
  inp.focus();
  runSpotlightSearch();
}

function closeSearchModal() {
  document.getElementById('search-backdrop').classList.remove('open');
}

function highlightText(text, query) {
  const safe = escapeHtml(text);
  if (!query) return safe;
  const cleanQ = query.replace(/^#/, '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  if (!cleanQ) return safe;
  return safe.replace(new RegExp(`(${cleanQ})`, 'gi'), '<mark>$1</mark>');
}

function runSpotlightSearch() {
  const rawQ = document.getElementById('spotlight-input').value.trim();
  const q = rawQ.toLowerCase();
  const results = [];

  if (!q) {
    for (const doc of data.nodes) {
      results.push({
        docId: doc.id,
        sectionSlug: null,
        docTitle: doc.title,
        sectionTitle: doc.subtitle || null,
        snippet: doc.description || doc.id,
        score: doc.id === 'index.md' ? 100 : 50
      });
    }
    results.sort((a, b) => b.score - a.score);
    spotlightHits = results.slice(0, 20);
    selectedHitIdx = 0;
    renderSpotlightHits(rawQ);
    return;
  }

  // Use MiniSearch fuzzy index when available and not a strict #tag prefix query
  if (miniSearchEngine && !q.startsWith('#')) {
    const msHits = miniSearchEngine.search(rawQ);
    if (msHits.length > 0) {
      spotlightHits = msHits.slice(0, 20).map(h => {
        const rawText = h.text || '';
        const idx = rawText.toLowerCase().indexOf(q);
        let snippet = rawText;
        if (idx !== -1) {
          const start = Math.max(0, idx - 45);
          const end = Math.min(rawText.length, idx + q.length + 75);
          snippet = (start > 0 ? '…' : '') + rawText.slice(start, end) + (end < rawText.length ? '…' : '');
        } else if (rawText.length > 120) {
          snippet = rawText.slice(0, 120) + '…';
        }
        return {
          docId: h.docId,
          sectionSlug: h.sectionSlug,
          docTitle: h.docTitle,
          sectionTitle: h.sectionTitle,
          snippet
        };
      });
      selectedHitIdx = 0;
      renderSpotlightHits(rawQ);
      return;
    }
  }

  for (const doc of data.nodes) {
    const tagStr = (doc.tags || []).map(t => '#' + t).join(' ');

    if (q.startsWith('#')) {
      const targetTag = q.slice(1);
      if ((doc.tags || []).some(t => t.toLowerCase().includes(targetTag))) {
        results.push({
          docId: doc.id,
          sectionSlug: null,
          docTitle: doc.title,
          sectionTitle: tagStr,
          snippet: doc.description || doc.id,
          score: 95
        });
      }
      continue;
    }

    const inTitle = doc.title.toLowerCase().includes(q);
    const inSub = (doc.subtitle || '').toLowerCase().includes(q);
    const inDesc = (doc.description || '').toLowerCase().includes(q);
    const inTag = (doc.tags || []).some(t => t.toLowerCase().includes(q));
    if (inTitle || inSub || inDesc || inTag) {
      results.push({
        docId: doc.id,
        sectionSlug: null,
        docTitle: doc.title,
        sectionTitle: doc.subtitle || (inTag ? tagStr : null),
        snippet: doc.description || doc.id,
        score: inTitle ? 95 : 80
      });
    }

    for (const sec of doc.sections || []) {
      const inSecTitle = sec.title.toLowerCase().includes(q);
      const idx = sec.text.toLowerCase().indexOf(q);
      if (inSecTitle || idx !== -1) {
        let snippet = sec.text;
        if (idx !== -1) {
          const start = Math.max(0, idx - 45);
          const end = Math.min(sec.text.length, idx + q.length + 75);
          snippet = (start > 0 ? '…' : '') + sec.text.slice(start, end) + (end < sec.text.length ? '…' : '');
        } else {
          snippet = sec.text.slice(0, 120) + (sec.text.length > 120 ? '…' : '');
        }
        results.push({
          docId: doc.id,
          sectionSlug: sec.slug || null,
          docTitle: doc.title,
          sectionTitle: sec.title,
          snippet,
          score: inSecTitle ? 85 : 60
        });
      }
    }
  }

  results.sort((a, b) => b.score - a.score);
  spotlightHits = results.slice(0, 20);
  selectedHitIdx = 0;
  renderSpotlightHits(rawQ);
}

function renderSpotlightHits(rawQ) {
  const container = document.getElementById('spotlight-results');
  document.getElementById('spotlight-count').textContent = `${spotlightHits.length} result(s)`;
  if (!spotlightHits.length) {
    container.innerHTML = '<div style="padding:28px;text-align:center;color:var(--text-muted)">No matching documents, sections, or #tags found.</div>';
    return;
  }
  container.innerHTML = spotlightHits.map((hit, idx) => `
    <div class="search-result-item ${idx === selectedHitIdx ? 'selected' : ''}" onclick="selectSpotlightHit(${idx})">
      <div class="sr-top">
        <div class="sr-breadcrumb">
          ${highlightText(hit.docTitle, rawQ)}
          ${hit.sectionTitle ? ` <span class="sr-sec">/ ${highlightText(hit.sectionTitle, rawQ)}</span>` : ''}
        </div>
        <div class="sr-meta">
          <span class="sr-path">${escapeHtml(hit.docId)}</span>
          <span class="sr-enter">↵</span>
        </div>
      </div>
      <div class="sr-snippet">${highlightText(hit.snippet, rawQ)}</div>
    </div>
  `).join('');
}

function selectSpotlightHit(idx) {
  const hit = spotlightHits[idx];
  if (!hit) return;
  closeSearchModal();
  openDoc(hit.docId, hit.sectionSlug);
  if (layoutMode === 'full') openPeek();
}

window.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    const bd = document.getElementById('search-backdrop');
    if (bd.classList.contains('open')) closeSearchModal();
    else openSearchModal();
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'b') {
    e.preventDefault();
    toggleLeftSidebar();
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.code === 'Backslash') {
    e.preventDefault();
    toggleRightViz();
    return;
  }
  const bd = document.getElementById('search-backdrop');
  if (!bd.classList.contains('open')) {
    if (e.key === 'Escape' && isPeekOpen()) closePeek();
    return;
  }
  if (e.key === 'Escape') { closeSearchModal(); return; }
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    selectedHitIdx = Math.min(spotlightHits.length - 1, selectedHitIdx + 1);
    renderSpotlightHits(document.getElementById('spotlight-input').value.trim());
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    selectedHitIdx = Math.max(0, selectedHitIdx - 1);
    renderSpotlightHits(document.getElementById('spotlight-input').value.trim());
  } else if (e.key === 'Enter' && spotlightHits[selectedHitIdx]) {
    e.preventDefault();
    selectSpotlightHit(selectedHitIdx);
  }
});

/* React Flow / Linear Style Mind Map & Force Graph Engine */
const vizPane = document.getElementById('viz-pane');
const canvas = document.getElementById('viz-canvas');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('node-tooltip');
let width = 540, height = 600;
const dpr = window.devicePixelRatio || 1;
let camX = 40, camY = 0, zoom = 0.9;
let visibleNodes = [];
let visibleLinks = [];
let hoveredItem = null;

function setTreeGrouping(mode) {
  activeTreeMode = mode;
  rootTree = mode === 'tag' ? data.mindMapByTag : data.mindMapByFolder;
  document.getElementById('btn-tree-folder').classList.toggle('active', mode === 'folder');
  document.getElementById('btn-tree-tag').classList.toggle('active', mode === 'tag');
  if (vizType !== 'mindmap') {
    vizType = 'mindmap';
  }
  fitView();
}

const nonRoot = graphNodes.filter(n => n.id !== 'index.md');
graphNodes.forEach(n => {
  if (n.id === 'index.md') { n.gx = 0; n.gy = 0; }
  else {
    const idx = nonRoot.indexOf(n);
    const angle = (idx / Math.max(1, nonRoot.length)) * Math.PI * 2 - Math.PI / 2;
    n.gx = Math.cos(angle) * 170;
    n.gy = Math.sin(angle) * 170;
  }
  n.vx = 0; n.vy = 0;
});

const LEVEL_X_GAP = 272;
const LEAF_Y_GAP = 66;

function getCanvasFontStack() {
  return {
    title: '"Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
    body: '"Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
    titleSize: '13px',
    subSize: '11px'
  };
}

function computeTreeLayout(root) {
  visibleNodes = [];
  visibleLinks = [];
  let leafIndex = 0;
  const fStack = getCanvasFontStack();

  function measure(node, depth) {
    node.depth = depth;
    ctx.font = `600 ${fStack.titleSize} ${fStack.title}`;
    const titleW = ctx.measureText(node.label).width;
    ctx.font = `400 ${fStack.subSize} ${fStack.body}`;
    const subW = ctx.measureText(node.subtitle || '').width;
    node.w = Math.min(246, Math.max(154, Math.max(titleW, subW) + 38));
    node.h = node.sublabel === 'section' ? 34 : 52;
    node.x = depth * LEVEL_X_GAP;

    const hasKids = node.children && node.children.length > 0;
    if (!hasKids || node.collapsed) {
      node.y = leafIndex * LEAF_Y_GAP;
      leafIndex++;
    } else {
      for (const child of node.children) {
        measure(child, depth + 1);
        visibleLinks.push({ source: node, target: child });
      }
      node.y = (node.children[0].y + node.children[node.children.length - 1].y) / 2;
    }
    visibleNodes.push(node);
  }

  measure(root, 0);
  const rootY = root.y;
  for (const n of visibleNodes) n.y -= rootY;
}

function fitView() {
  if (vizType === 'graph') {
    camX = width / 2;
    camY = height / 2;
    zoom = layoutMode === 'full' ? 1.2 : 0.95;
    return;
  }
  computeTreeLayout(rootTree);
  if (!visibleNodes.length) return;
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const n of visibleNodes) {
    minX = Math.min(minX, n.x);
    maxX = Math.max(maxX, n.x + n.w + 30);
    minY = Math.min(minY, n.y - n.h / 2);
    maxY = Math.max(maxY, n.y + n.h / 2);
  }
  const treeW = Math.max(200, maxX - minX);
  const treeH = Math.max(160, maxY - minY);
  const padX = 76, padY = 110;
  zoom = Math.max(0.5, Math.min(1.18, Math.min((width - padX) / treeW, (height - padY) / treeH)));
  camX = (width - treeW * zoom) / 2 - minX * zoom;
  camY = height / 2 - ((minY + maxY) / 2) * zoom + 8;
}

function expandAll(expand) {
  function walk(node, depth) {
    if (depth >= 1 && node.children && node.children.length > 0) {
      node.collapsed = !expand;
    }
    for (const c of node.children || []) walk(c, depth + 1);
  }
  walk(rootTree, 0);
  fitView();
}

function toggleLeftSidebar(forceState) {

// Keep the address bar in sync with the active view so it can always be copied & shared
function syncViewUrl() {
  try {
    const params = new URLSearchParams(window.location.search);
    if (activeSegment === DEFAULT_VIEW) params.delete('view');
    else params.set('view', activeSegment);
    const q = params.toString();
    history.replaceState(null, '', window.location.pathname + (q ? '?' + q : '') + window.location.hash);
  } catch (err) { /* some browsers block replaceState on file:// */ }
}

function setViewSwitch(seg) {
  activeSegment = seg;

  document.getElementById('seg-split').classList.toggle('active', seg === 'split');

  if (seg === 'split') {

    layoutMode = 'full';

  }

  syncViewUrl();
  setTimeout(() => { resizeCanvas(); fitView(); }, 20);
}

function resizeCanvas() {
  const rect = vizPane.getBoundingClientRect();
  if (rect.width === 0 || rect.height === 0) return;
  width = rect.width;
  height = rect.height;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

new ResizeObserver(() => { resizeCanvas(); }).observe(vizPane);

function screenToWorld(sx, sy) {
  return { x: (sx - camX) / zoom, y: (sy - camY) / zoom };
}

function hitTestMindMap(wx, wy) {
  for (let i = visibleNodes.length - 1; i >= 0; i--) {
    const n = visibleNodes[i];
    const top = n.y - n.h / 2, bottom = n.y + n.h / 2;
    if (n.children && n.children.length > 0) {
      const tx = n.x + n.w + 12, ty = n.y;
      if (Math.hypot(wx - tx, wy - ty) <= 11) return { node: n, action: 'toggle' };
    }
    if (wx >= n.x && wx <= n.x + n.w && wy >= top && wy <= bottom) {
      return { node: n, action: 'select' };
    }
  }
  return null;
}

function hitTestGraph(wx, wy) {
  for (let i = graphNodes.length - 1; i >= 0; i--) {
    const n = graphNodes[i];
    const rad = n.id === 'index.md' ? 14 : 10;
    if (Math.hypot(wx - n.gx, wy - n.gy) <= rad + 6) return { node: n, action: 'select' };
  }
  return null;
}

function showTooltip(item, sx, sy) {
